<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HCC3book: Exam 3 Study Feed</title>
<style>
:root{--bg:#f0f2f5;--card:#fff;--tx:#050505;--mut:#65676b;--line:#dadde1;--blue:#1877f2;--hov:#f2f2f2;--ok:#1b8a3a;--no:#d92d20;--okbg:#e4f5e9;--nobg:#fde8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18191a;--card:#242526;--tx:#e4e6eb;--mut:#b0b3b8;--line:#3e4042;--blue:#4599ff;--hov:#3a3b3c;--ok:#4ade80;--no:#ff7a70;--okbg:#17331f;--nobg:#3d1b18}}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:120px}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line)}
.top{max-width:620px;margin:auto;display:flex;align-items:center;gap:10px;padding:8px 12px}
.logo{font-weight:800;font-size:22px;color:var(--blue);letter-spacing:-.03em;white-space:nowrap}
#q{flex:1;min-width:0;border:0;border-radius:99px;background:var(--bg);color:var(--tx);padding:9px 14px;font:inherit}
#score{font-size:13px;color:var(--mut);white-space:nowrap}
.tabs{max-width:620px;margin:auto;display:flex}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:600 15px inherit;padding:12px 4px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
main{max-width:620px;margin:0 auto;padding:12px}
#stories{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.st{flex:none;width:92px;height:150px;border-radius:12px;border:0;color:#fff;font:700 14px inherit;padding:10px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;outline-offset:2px}
.st.on{outline:3px solid var(--blue)}
.st b{font-size:30px;font-weight:400}
.post{background:var(--card);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.2);margin-bottom:12px}
.hd{display:flex;gap:10px;align-items:center;padding:12px 14px 6px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}
.hd strong{display:block;font-size:15px}
.hd small{color:var(--mut);font-size:13px}
.bd{padding:4px 14px 10px}
.bd ul{padding-left:18px}
.bd li{margin:5px 0;font-size:15.5px}
.qq{font-size:18px;font-weight:600;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:11px 14px;margin-bottom:8px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){background:var(--hov)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.cnt{display:flex;justify-content:space-between;padding:6px 14px;color:var(--mut);font-size:14px}
.act{display:flex;border-top:1px solid var(--line);margin:0 10px;padding:3px 0}
.act button{flex:1;border:0;background:none;color:var(--mut);font:600 14px inherit;padding:9px 4px;border-radius:6px;cursor:pointer}
.act button:hover{background:var(--hov)}
.act button.on{color:var(--blue)}
.cm{display:none;padding:6px 14px 14px;gap:8px}
.post.open .cm{display:flex}
.cm .av{width:32px;height:32px;font-size:16px}
.bub{background:var(--bg);border-radius:16px;padding:8px 12px;font-size:14.5px}
.bub b{display:block;font-size:13px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
button:focus-visible,#q:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
</style></head><body>
<header><div class="top"><span class="logo">HCC3book</span><input id="q" type="search" placeholder="Search Exam 3 topics" aria-label="Search"><span id="score"></span></div>
<nav class="tabs"><button class="on" data-t="feed">Feed</button><button data-t="polls">Polls</button><button data-t="saved">Saved</button></nav></header>
<main><div id="stories"></div><div id="list"></div></main>
<script>
const K={STI:["#e11d74","#ff8a5c","🧪"],Contraception:["#7c3aed","#4f8cff","💊"],Prenatal:["#0d9488","#4fd1c5","🤰"],Testing:["#0369a1","#38bdf8","📈"],"High-risk":["#b91c1c","#fb7185","🚨"],Meds:["#15803d","#86d36b","💉"]};
const P=(n,e,c,b,t)=>({k:"p",n,e,c,b,t}),Q=(c,q,o,a,w)=>({k:"q",c,q,o,a,w});
const D=[
P("Chlamydia & Gonorrhea","🧪","STI",["Chlamydia: often silent. Dysuria, discharge, pelvic pain. Tx: doxycycline (nonpregnant), azithromycin (pregnant). Treat partners, retest ~3 months.","Gonorrhea: purulent discharge, dysuria, pelvic pain, may be silent. Tx: IM ceftriaxone, add chlamydia coverage if not excluded.","Abstain until the 7-day regimen is done (or 7 days after a single dose) and partners are treated."],"Both can cause PID, infertility and ectopic pregnancy if untreated."),
Q("STI","Which medication treats uncomplicated gonorrhea?",["Azithromycin PO","Ceftriaxone IM","Metronidazole PO","Doxycycline PO"],1,"Ceftriaxone IM is first-line."),
P("Syphilis","🩹","STI",["Primary: painless chancre.","Secondary: palm and sole rash.","Late: systemic damage.","Penicillin G, regimen by stage. Required in pregnancy: desensitize if allergic."],"Painless chancre = syphilis. Painful ulcers = HSV."),
P("HSV, HPV & Trich","🧫","STI",["HSV: painful vesicles/ulcers, recurs. Acyclovir/valacyclovir control outbreaks, don’t cure. Avoid sex with lesions.","HPV: often silent, warts or cervical changes. Vaccine + cervical screening. Defer vaccine in pregnancy.","Trichomoniasis: frothy discharge, odor, strawberry cervix. Oral metronidazole, treat partners.","Condoms reduce but don’t eliminate HPV/HSV spread."],"Frothy + strawberry cervix = trich."),
P("HIV, Hep B & PID","🩸","STI",["HIV: flu-like illness or silent. ART; condoms, PrEP/PEP, testing.","Hep B: often silent, maybe jaundice. Vaccinate; evaluate chronic infection for antivirals.","PID: pelvic pain, cervical motion tenderness, fever. Ceftriaxone + doxycycline + metronidazole."],"HIV and hep B do NOT need airborne isolation."),
P("Prevention & Precautions","🧤","STI",["Primary: prevent infection (condoms, HPV/HBV vaccines, PrEP, education).","Secondary: detect early (STI/HIV and pregnancy screening).","Tertiary: treat and limit complications (antibiotics, partner services, HIV care).","Standard precautions: hand hygiene for all; gloves for body fluids/mucosa/nonintact skin; gown/mask/eye protection by risk.","Risk factors: inconsistent condoms, new/multiple partners, prior STI, substance use, coercion."],"Primary = prevent. Secondary = screen. Tertiary = treat."),
Q("STI","Which contraceptive also helps prevent STIs?",["Copper IUD","Hormonal IUD","Condom","Implant"],2,"Only barrier methods like condoms. IUDs and hormones don’t protect against STIs."),
P("Contraceptive Methods","💊","Contraception",["Pill/patch/ring: estrogen + progestin, adherence needed.","Progestin-only pill: no estrogen, timing rules vary.","Depo-Provera: shot ~every 13 weeks. Irregular bleeding, delayed fertility, bone density.","Hormonal IUD: long-acting, lighter periods. Copper IUD: no hormones, more cramps/bleeding, works as emergency contraception.","Implant: long-acting progestin, irregular bleeding.","Diaphragm: barrier + spermicide, fit matters. Sterilization: permanent, informed consent, no STI protection."],"Only condoms reduce STI risk."),
P("Combined Hormonal: Don’t Use If…","⛔","Contraception",["Migraine with aura","Severe HTN (160/100 or higher)","High-risk VTE / thrombophilia","Current breast cancer, certain liver disease","Early postpartum","Smoker age 35+ (especially 15+ cigarettes/day)"],"Estrogen = clot and stroke risk."),
P("Contraceptive Interactions","⚠️","Contraception",["Reduce effectiveness: St. John’s wort, phenytoin and other enzyme-inducing anticonvulsants, rifampin/rifabutin.","Routine antibiotics (amoxicillin, azithromycin, doxycycline) do NOT.","Severe vomiting/diarrhea can interfere with oral pills."],"Enzyme inducers lower hormone levels."),
Q("Contraception","A patient on a combined oral contraceptive starts St. John’s wort. The concern is…",["Serotonin syndrome only","Reduced contraceptive effectiveness","Increased clotting","Nothing, it’s safe"],1,"Enzyme induction decreases hormone exposure."),
P("Emergency Contraception","🆘","Contraception",["Levonorgestrel: ASAP, best within 72 h, benefit up to 120 h.","Ulipristal: up to 120 h. Wait at least 5 days before starting/resuming hormonal contraception; use backup.","Copper IUD: within ~5 days.","Prevents pregnancy; does not end an established one; no STI protection."],"Time-sensitive: earlier is better."),
P("Normal Adaptations","🫀","Prenatal",["Cardiovascular: blood volume up ~40–50%, higher cardiac output, dilutional anemia.","Respiratory: more tidal volume; mild breathlessness OK, severe dyspnea is NOT.","Renal: GFR up, frequency. Assess for UTI.","GI: nausea, reflux, constipation. Small meals, fluids, fiber.","MSK: lordosis, loose ligaments, fall prevention.","Hematologic: hypercoagulable, VTE risk. Endocrine: rising insulin resistance."],"Supine hypotensive syndrome: uterus compresses the IVC. Turn her lateral, often left."),
P("Signs of Pregnancy","🔎","Prenatal",["Presumptive (subjective): amenorrhea, nausea, fatigue, breast tenderness, frequency, quickening.","Probable (objective, not definitive): positive hCG, Goodell, Chadwick, Hegar, ballottement, uterine enlargement.","Positive (confirmatory): ultrasound embryo/fetus or cardiac activity; fetal movement palpated by trained examiner."],"A positive hCG is only PROBABLE."),
Q("Prenatal","Which is a POSITIVE sign of pregnancy?",["Positive hCG","Chadwick sign","Amenorrhea","Fetal cardiac activity on ultrasound"],3,"Ultrasound-visible fetal cardiac activity is confirmatory."),
P("GPTPAL & Nägele’s Rule","🧮","Prenatal",["G: total pregnancies including current. T: births at 37+ wk. P: births 20 to 36w6d. A: losses before 20 wk. L: living children.","Twins = ONE delivery event, TWO living children.","Current + 10-wk miscarriage + twins at 34 wk + singleton at 39 wk, all living = G4 T1 P1 A1 L3.","Nägele: LMP + 7 days − 3 months + 1 year. LMP Jan 10, 2026 → EDD Oct 17, 2026."],"Assumes a 28-day cycle. Early ultrasound may refine dating."),
Q("Prenatal","Current pregnancy, 9-wk miscarriage, 35-wk twins, 39-wk singleton, 3 living. GPTPAL?",["G3 T1 P1 A1 L3","G4 T1 P2 A1 L3","G4 T1 P1 A1 L3","G4 T2 P1 A1 L3"],2,"Twins count once for preterm, twice for living."),
P("Kick Counts & BPP","👶","Testing",["Kick counts: start ~28 wk per provider. 10 movements in 2 hours. Decreased/absent movement needs prompt assessment.","Ultrasound: confirms intrauterine pregnancy, dates, anatomy, growth, placenta, fluid. No ionizing radiation.","BPP: NST, breathing, movement, tone, fluid, each 0 or 2. 8–10 reassuring if fluid adequate, 6 equivocal, 4 or less abnormal.","Breathing ≥1 episode of 30 sec; ≥3 gross movements; ≥1 tone episode; deepest pocket ≥2 cm."],"Low fluid warrants attention regardless of total score."),
Q("Testing","BPP score of 4/10. Nurse’s action?",["Repeat in 1 week","Reassure the patient","Notify provider promptly for evaluation","Encourage fluids"],2,"4 or less is abnormal fetal surveillance."),
P("NST, CST, Amnio & CVS","📉","Testing",["NST at ≥32 wk reactive: ≥2 accels ≥15 bpm for ≥15 sec in 20 min. (10x10 before 32 wk.) Lateral or semi-Fowler, 20–40 min.","CST negative: no late decels with adequate contractions. Positive: late decels with at least half of contractions.","Amnio: ultrasound-guided fluid sample. Watch leaking fluid, bleeding, contractions, infection. RhIG if indicated.","CVS: placental tissue ~10–13 wk. Does NOT directly assess open neural tube defects."],"Late decels = uteroplacental insufficiency."),
Q("Testing","Late decelerations during an oxytocin CST. First action?",["Increase oxytocin","Stop oxytocin, reposition, assess, notify provider","Continue and recheck in 30 min","Give a fluid bolus only"],1,"Stop the oxytocin, reposition, assess BP, notify provider."),
P("Diabetes in Pregnancy","🍬","High-risk",["Pregestational: existed before. Risks: anomalies, preeclampsia, macrosomia, neonatal hypoglycemia.","Gestational: first found in pregnancy. Risks: macrosomia, shoulder dystocia, preeclampsia. Screen 24–28 wk. Postpartum OGTT 4–12 weeks.","Targets: fasting <95; 1-hr <140; 2-hr <120.","Conscious low sugar: 15 g fast carbs, recheck in 15 min. Can’t swallow: IV dextrose or glucagon."],"NEVER give oral glucose to an unconscious patient."),
P("Chronic HTN","📊","High-risk",["Before pregnancy or before 20 weeks. Risks: superimposed preeclampsia, abruption, growth restriction, stroke.","Safe: labetalol, extended-release nifedipine, methyldopa.","Avoid lisinopril/ACE inhibitors and ARBs.","Low-dose aspirin (often 81 mg) for qualifying patients, start 12–28 wk, ideally before 16."],"ACE inhibitors can injure the fetus."),
P("Preeclampsia","🤕","High-risk",["New HTN after 20 wk (≥140/90) + proteinuria (≥300 mg/24 h or P/C ≥0.3) OR end-organ findings.","Severe range: ≥160 systolic OR ≥110 diastolic.","Severe features: low platelets, kidney/liver dysfunction, pulmonary edema, persistent headache, visual symptoms.","Edema alone is NOT diagnostic.","Care: BP, neuro, DTRs/clonus, urine output, labs, fetal status, seizure precautions. Avoid excess IV fluids; no diuretics for dependent edema."],"Severe headache + vision changes + high BP = severe features."),
Q("High-risk","32 wk, BP 168/112, headache, blurred vision, RUQ pain. Priority?",["Recheck BP in 1 hour","Immediate provider notification and severe-preeclampsia precautions","Give acetaminophen","Encourage rest and fluids"],1,"Severe-range BP plus organ symptoms need urgent care."),
P("Eclampsia & Magnesium","⚡","High-risk",["Eclampsia: seizure + preeclampsia. Call for help, protect from injury, lateral position, airway, record it, assess oxygenation.","DO NOT restrain. DO NOT put anything in her mouth.","After: stabilize mom, assess fetus, magnesium as ordered, prep for delivery if indicated.","Magnesium prevents/treats seizures, not the main antihypertensive. Monitor RR, DTRs, urine output, consciousness.","Toxicity: absent reflexes, respiratory depression, cardiac effects. STOP infusion, call for help, support airway. Antidote: IV calcium gluconate."],"Absent DTRs on magnesium = toxicity."),
Q("High-risk","On magnesium: absent reflexes, RR 9. Priority?",["Slow the infusion","Stop magnesium, emergency assessment, prepare calcium gluconate","Give hydralazine","Recheck in 30 min"],1,"Classic magnesium toxicity."),
P("Hyperemesis & Cerclage","🤢","High-risk",["Hyperemesis: severe vomiting, dehydration, weight loss, electrolyte problems. Isotonic IV fluids, ondansetron/promethazine, advance diet.","Prolonged vomiting/malnutrition: THIAMINE before dextrose (prevents Wernicke).","Cervical insufficiency: painless 2nd-trimester dilation. Cerclage = cervical stitch, removed ~36–37 wk.","Report contractions, pelvic pressure, bleeding, leaking fluid, fever, foul discharge."],"Thiamine first, then dextrose."),
P("Miscarriage Types","💔","High-risk",["Threatened: bleeding, cervix closed.","Inevitable: bleeding/cramping + dilated cervix.","Incomplete: some products retained. Complete: all expelled.","Missed: demise without expulsion. Septic: infected.","Check bleeding, vitals, Hgb, infection, Rh status/RhIG. Heavy bleeding, syncope, hypotension, fever = emergency."],"Closed cervix = threatened."),
P("Ectopic Pregnancy","🚑","High-risk",["Implants outside uterus, usually tube. Risks: prior ectopic, PID, tubal surgery, smoking.","Missed period, unilateral pain, spotting.","Shoulder pain, syncope, hypotension = rupture and internal bleeding.","ABCs, IV access, vitals, blood prep, urgent surgery eval.","Stable? Methotrexate + serial hCG. Avoid alcohol and folic acid unless directed."],"Unilateral pelvic pain + shock = ruptured ectopic."),
Q("High-risk","Positive pregnancy test, unilateral pain, shoulder pain, hypotension?",["Threatened miscarriage","Placenta previa","Ruptured ectopic pregnancy","Hyperemesis"],2,"Shoulder pain suggests blood irritating the diaphragm."),
P("Previa vs Abruption","🩸","High-risk",["Previa: painless, bright red, soft nontender uterus, dx by ultrasound. NO digital vaginal exam until excluded.","Abruption: often painful, may be concealed, tender rigid hypertonic uterus, dx mostly clinical. Treat hemorrhage, watch fetus, prep urgent care."],"Painless = previa. Painful and rigid = abruption."),
Q("High-risk","Painless bright-red bleeding in the third trimester. What do you avoid?",["IV access","Digital vaginal exam","Fetal monitoring","Vital signs"],1,"Previa: no digital exam until excluded."),
P("HELLP & DIC","🧬","High-risk",["HELLP: Hemolysis, Elevated Liver enzymes, Low Platelets. RUQ/epigastric pain, nausea, headache. Magnesium when indicated, deliver after stabilizing.","DIC: clotting consumes platelets and factors, then bleeding. Follows abruption, sepsis, hemorrhage.","DIC clues: oozing IV sites, low platelets/fibrinogen, long PT/aPTT, high D-dimer.","Treat the cause, watch shock/urine output, ordered blood products, avoid unnecessary invasive procedures."],"RUQ pain + low platelets + high liver enzymes = HELLP."),
Q("High-risk","Abruption patient is oozing from IV sites. Suspect…",["Preeclampsia","DIC","Eclampsia","Ectopic"],1,"Consumption coagulopathy."),
P("Antibiotics","🧴","Meds",["Azithromycin: chlamydia in pregnancy; GI effects, QT risk.","Ceftriaxone: gonorrhea; check severe beta-lactam allergy.","Doxycycline: chlamydia/PID; avoid in pregnancy; photosensitivity.","Penicillin G: syphilis, essential in pregnancy.","Metronidazole: trich, BV, PID.","Ampicillin: GBS prophylaxis. Vancomycin: selected GBS prophylaxis; monitor kidneys."],"Doxy out in pregnancy, azithro in."),
P("BP & Seizure Meds","💓","Meds",["Lisinopril: contraindicated in pregnancy.","Hydralazine: acute severe HTN. Watch hypotension, tachycardia.","Methyldopa: pregnancy HTN; sedation, mood, liver effects.","Propranolol: monitor HR/BP; masks hypoglycemia.","Magnesium sulfate: seizures. Calcium gluconate: antidote.","Lorazepam: selected seizures, NOT first-line eclampsia. Phenytoin lowers hormonal contraceptive efficacy."],"Mg prevents seizures, hydralazine lowers BP."),
Q("Meds","Which is contraindicated in pregnancy?",["Methyldopa","Hydralazine","Lisinopril","Labetalol"],2,"ACE inhibitors can cause fetal injury."),
P("Rh, Lungs, Vitamins & More","🧠","Meds",["RhIG: ~28 wk to eligible unsensitized Rh-negative patients, within 72 h after Rh-positive birth, and after sensitizing events. Does NOT reverse established sensitization.","Betamethasone: fetal lung maturity (watch maternal glucose). Doesn’t stop labor.","Folic acid 400–800 mcg/day prevents neural tube defects. Prenatal vitamins: avoid excess preformed vitamin A.","Insulin needs change. Metformin crosses placenta. Glucagon: severe hypoglycemia. Ondansetron: constipation, QT. Promethazine: sedation, injection tissue injury. Heparin: VTE, monitor platelets. Aspirin: low-dose preeclampsia prevention. Depo ~13 wk."],"Don’t overload IV fluids in preeclampsia."),
Q("Meds","Prolonged vomiting and malnutrition. What before IV dextrose?",["Calcium gluconate","Thiamine","Magnesium","Folic acid"],1,"Prevents Wernicke encephalopathy.")
];
const $=s=>document.querySelector(s),list=$("#list"),st=$("#stories");
const liked=new Set(),ans={};let tab="feed",cat="All",term="";
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const bg=c=>"linear-gradient(160deg,"+K[c][0]+","+K[c][1]+")";
st.innerHTML=["All",...Object.keys(K)].map(c=>'<button class="st'+(c==="All"?" on":"")+'" data-c="'+c+'" style="background:'+(c==="All"?"linear-gradient(160deg,#1877f2,#6aa8ff)":bg(c))+'"><b>'+(c==="All"?"📚":K[c][2])+'</b>'+c+'</button>').join("");
function score(){const v=Object.entries(ans);$("#score").textContent=v.length?"Polls "+v.filter(([i,x])=>x===D[i].a).length+"/"+v.length+" ✓":""}
function render(){
  const t=term.toLowerCase();
  const h=D.map((d,i)=>[d,i]).filter(([d,i])=>(cat==="All"||d.c===cat)&&(tab!=="polls"||d.k==="q")&&(tab!=="saved"||liked.has(i))&&(!t||JSON.stringify(d).toLowerCase().includes(t))).map(([d,i])=>{
    const k=K[d.c],lk=liked.has(i);
    const head='<div class="hd"><div class="av" style="background:'+bg(d.c)+'">'+(d.k==="p"?d.e:"🗳️")+'</div><div><strong>'+esc(d.k==="p"?d.n:"Poll: "+d.c)+'</strong><small>'+d.c+' · Exam 3</small></div></div>';
    let body,cm;
    if(d.k==="p"){body='<div class="bd"><ul>'+d.b.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul></div>";cm=d.t}
    else{const a=ans[i];body='<div class="bd"><div class="qq">'+esc(d.q)+"</div>"+d.o.map((o,j)=>'<button class="opt'+(a===undefined?"":j===d.a?" ok":j===a?" no":"")+'" data-i="'+i+'" data-j="'+j+'"'+(a===undefined?"":" disabled")+">"+esc(o)+"</button>").join("")+"</div>";cm=a===undefined?"":(a===d.a?"Correct! ":"Not quite. ")+d.w}
    const sh=d.k==="p"?"Tip":"Answer";
    return '<article class="post'+(d.k==="q"&&ans[i]!==undefined?" open":"")+'" data-i="'+i+'">'+head+body+'<div class="cnt"><span>'+(lk?"👍 You saved this":"👍 Save to review")+'</span><span>'+(d.k==="p"?"1 tip":"")+'</span></div><div class="act"><button data-a="like" class="'+(lk?"on":"")+'">👍 Like</button><button data-a="cm">💬 '+sh+'</button><button data-a="sh">↗ Share</button></div><div class="cm"><div class="av" style="background:#1877f2;color:#fff">🩺</div><div class="bub"><b>Senior Nurse</b>'+esc(cm||"Pick an answer to see the explanation.")+"</div></div></article>"}).join("");
  list.innerHTML=h||'<div class="empty">'+(tab==="saved"?"Nothing saved yet. Like a post to save it.":"No matches.")+"</div>";
  score();
}
list.addEventListener("click",e=>{
  const o=e.target.closest(".opt");
  if(o){const i=+o.dataset.i;if(ans[i]===undefined){ans[i]=+o.dataset.j;render()}return}
  const b=e.target.closest("[data-a]");if(!b)return;
  const p=b.closest(".post"),i=+p.dataset.i,a=b.dataset.a;
  if(a==="like"){liked.has(i)?liked.delete(i):liked.add(i);const y=window.scrollY;render();window.scrollTo(0,y)}
  if(a==="cm")p.classList.toggle("open");
  if(a==="sh"){const d=D[i],tx=d.k==="p"?d.n+"\n"+d.b.join("\n"):d.q+"\n"+d.o[d.a];try{navigator.clipboard.writeText(tx).then(()=>{b.textContent="✓ Copied"},()=>{b.textContent="Copy blocked"})}catch(x){b.textContent="Copy blocked"}}
});
st.addEventListener("click",e=>{const b=e.target.closest(".st");if(!b)return;cat=b.dataset.c;st.querySelectorAll(".st").forEach(x=>x.classList.toggle("on",x===b));render()});
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));render()});
$("#q").addEventListener("input",e=>{term=e.target.value;render()});
render();
</script></body></html>
