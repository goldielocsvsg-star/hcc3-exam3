{tp:"ecl",sk:"TA",t:"order",case:"pih",info:"Grace's findings are unchanged.",q:"Place the nurse's actions in priority order.",o:["Stop the magnesium infusion","Call for help and notify the provider","Support airway and breathing; apply oxygen","Give calcium gluconate IV per order","Draw a serum magnesium level and reassess"],
r:"Remove the drug, summon help, support ABCs, give the antidote (kept at bedside per PIH map), then reassess.",tk:"Stop, help, airway, calcium gluconate, reassess."},
{tp:"ecl",sk:"TA",t:"sata",case:"pih",info:"<b>Next day:</b> After recovery and a lower magnesium rate, Grace has a generalized tonic-clonic seizure. FHR drops to 85 during the seizure.",q:"Which actions are appropriate during the seizure? Select all that apply.",o:["Stay with her and call for help","Protect her head and body from injury","Turn her to her side when safe","Insert a padded tongue blade","Restrain her extremities","Time and document the seizure"],a:[0,1,2,5],
w:["Correct.","Correct.","Correct: airway and aspiration prevention.","Nothing goes in the mouth.","Restraint causes injury.","Correct."],
r:"Lecture: immediate care is to maintain the airway and safety during the seizure. FHR bradycardia during the seizure usually recovers as maternal oxygenation returns.",tk:"Protect, don't restrain, nothing in the mouth."},
{tp:"ecl",sk:"EO",t:"mc",case:"pih",info:"The seizure ends after 70 seconds. Grace is postictal; FHR returns to 140.",q:"What is the nurse's next priority?",o:["Maintain the airway, suction, give oxygen, and give magnesium as ordered","Proceed directly to cesarean birth before reassessing the mother","Offer oral fluids to rehydrate her once she begins to wake","Leave the room briefly to document the seizure at the station"],a:0,
w:["Correct (lecture: stabilize mother after seizure, magnesium, fetal status).","Stabilize the mother first.","Aspiration risk.","Stay with the client."],
r:"After stabilization, assess for abruption (pain, rigid uterus, bleeding) because seizures and hypertension raise that risk; PIH map adds preparing for emergency delivery and emotional support.",tk:"After seizure: airway, mag, fetus, check for abruption."},
{tp:"ecl",sk:"AC",t:"mc",q:"A client receiving magnesium sulfate feels warm and flushed. DTRs 2+, RR 16, urine output 50 mL/hr. What should the nurse do?",o:["Explain this is an expected effect and continue monitoring","Stop the infusion because these signs suggest magnesium toxicity","Give calcium gluconate to reverse the magnesium effects","Call a rapid response because this is likely anaphylaxis"],a:0,
w:["Correct.","No toxicity cues.","Not indicated.","No airway or circulatory signs of anaphylaxis."],
r:"Flushing and warmth come from vasodilation. Reflexes, respirations, and output are reassuring, so the infusion continues.",tk:"Flushed with normal reflexes = side effect."},
{tp:"ecl",sk:"RC",t:"sata",q:"Which assessments are on your PIH map for a client receiving magnesium sulfate? Select all that apply.",o:["Deep tendon reflexes","Urine output","IV flow rate","Level of consciousness","Serum magnesium level","Daily fundal height"],a:[0,1,2,3,4],
w:["Correct.","Correct.","Correct.","Correct.","Correct.","Not part of magnesium monitoring."],
r:"PIH map: monitor maternal vital signs, LOC, FHR, urine output, DTRs, IV flow rate, and serum magnesium; keep calcium gluconate at the bedside.",tk:"Reflexes, breathing, LOC, urine, rate, level."},
{tp:"ecl",sk:"PH",t:"mc",q:"A client on magnesium has RR 14, DTRs 1+, and urine output of 22 mL/hr for 2 consecutive hours. What should the nurse do first?",o:["Notify the provider about the low output and anticipate a serum magnesium level","Increase the magnesium rate to give better seizure protection","Give calcium gluconate now to reverse magnesium toxicity","Stop all IV fluids to prevent pulmonary edema from developing"],a:0,
w:["Correct: oliguria allows magnesium to accumulate.","Raises toxicity risk.","Not yet toxic; reflexes and RR are present.","Unsafe without evaluation."],
r:"Anticipating toxicity before it develops is a key nursing judgment because magnesium is cleared by the kidneys.",tk:"Low urine on mag = report and check the level."},
{tp:"ecl",sk:"AC",t:"mc",q:"A client asks why she is getting magnesium when her blood pressure medicine is already working. Which response is accurate?",o:["\"Magnesium is given to prevent seizures, not to lower blood pressure.\"","\"Magnesium is a stronger blood pressure medicine for emergencies.\"","\"Magnesium helps the baby's lungs mature faster.\"","\"Magnesium prevents bleeding after delivery.\""],a:0,
w:["Correct.","Not its purpose.","That is betamethasone.","It actually relaxes the uterus and can increase PPH risk."],
r:"Magnesium is a CNS depressant that decreases neuromuscular excitability; BP control requires hydralazine or another antihypertensive.",tk:"Magnesium = seizures; hydralazine = BP."},
{tp:"ecl",sk:"GS",t:"sata",q:"A client with severe preeclampsia delivers while on magnesium sulfate. Which postpartum priorities apply? Select all that apply.",o:["Continue seizure precautions because eclampsia can occur after birth","Assess fundal tone and lochia closely for hemorrhage","Inform the neonatal team about maternal magnesium","Stop all monitoring once the placenta delivers","Give methylergonovine routinely for every client with hypertension"],a:[0,1,2],
w:["Correct (lecture: before, during, or after birth).","Correct: magnesium relaxes smooth muscle.","Correct: newborn may be hypotonic.","Unsafe.","Methylergonovine raises BP; avoid in hypertension."],
r:"Postpartum magnesium is commonly continued for about 24 hours. Methergine is contraindicated in hypertensive disorders because it causes vasoconstriction (supplemental).",tk:"Eclampsia can happen after delivery."},
{tp:"ecl",sk:"TA",t:"mc",q:"An eclamptic client has a second seizure despite a therapeutic magnesium level. Which medication from your learning map does the nurse anticipate?",o:["Lorazepam IV","Calcium gluconate IV","Rh(D) immune globulin IM","Betamethasone IM"],a:0,
w:["Correct: a benzodiazepine for refractory seizures (supplemental).","Antidote for magnesium toxicity, not a seizure drug.","Prevents Rh sensitization.","Fetal lung maturity."],
r:"Magnesium remains first-line. Recurrent seizures are treated with an additional anticonvulsant such as lorazepam; watch for respiratory depression when combined with magnesium.",tk:"Refractory eclamptic seizure: lorazepam, watch RR."},

/* ---------- HELLP & DIC (7) ---------- */
{tp:"hellp",sk:"AC",t:"mc",case:"pih",info:"<b>Postpartum day 1:</b> Grace reports RUQ pain and nausea. Platelets 64,000/µL (was 190,000), AST and ALT markedly elevated, hemoglobin dropping, LDH elevated. BP 146/94.",q:"What is the most likely complication?",o:["HELLP syndrome","Acute cholecystitis","Magnesium toxicity","Postpartum hemorrhage from atony"],a:0,
w:["Correct: hemolysis, elevated liver enzymes, low platelets.","Labs show hemolysis and thrombocytopenia beyond gallbladder disease.","No toxicity signs.","Bleeding source and labs do not fit."],
r:"Lecture: HELLP is diagnosed by labs and can occur with only moderate BP elevation. It can appear postpartum.",tk:"RUQ pain + low platelets + high LFTs = HELLP."},
{tp:"hellp",sk:"PH",t:"bt",case:"pih",info:"Two hours later: oozing from the IV site and incision line, petechiae on the arms, fibrinogen falling, PT and aPTT prolonged.",q:"Complete the bow-tie for Grace.",
c:["Disseminated intravascular coagulation","Heparin-induced thrombocytopenia","Magnesium toxicity","Placenta previa"],ca:0,
ac:["Treat the underlying cause and give blood products as ordered","Implement bleeding precautions; avoid IM injections","Give vitamin K and wait for it to work","Apply deep palpation over the liver to assess size","Restrict all IV fluids"],aa:[0,1],
pm:["Platelets, fibrinogen, PT/aPTT","Urine output and vital signs","Fetal kick counts","Deep tendon reflexes only","Daily weight only"],pa:[0,1],
r:"Lecture: DIC is pathologic diffuse clotting causing widespread bleeding, triggered by severe preeclampsia, HELLP, and Gram-negative sepsis; manage by treating the cause and assessing for bleeding. Avoid deep liver palpation in HELLP because of hepatic hematoma risk.",tk:"DIC: treat cause, replace factors, protect from bleeding."},
{tp:"hellp",sk:"RC",t:"sata",q:"Which complications does your lecture associate with HELLP syndrome? Select all that apply.",o:["Disseminated intravascular coagulation","Placental abruption","Liver hemorrhage or failure","Acute renal failure","Pulmonary edema","Neural tube defects"],a:[0,1,2,3,4],
w:["Correct.","Correct.","Correct.","Correct.","Correct.","Folate-related, not HELLP."],
r:"Lecture list also includes ARDS, sepsis, and stroke, with increased risk of maternal death.",tk:"HELLP can bleed, rupture the liver, fail the kidneys."},
{tp:"hellp",sk:"AC",t:"mc",q:"A client at 32 weeks reports malaise and epigastric pain she thinks is heartburn. BP 142/90. Which lab finding most strongly supports HELLP?",o:["Platelets 78,000/µL with elevated AST","Hemoglobin 12.8 g/dL with normal platelets","Fasting glucose 102 mg/dL","Urine ketones 2+"],a:0,
w:["Correct: low platelets and liver injury.","Not consistent with hemolysis or thrombocytopenia.","Relevant to diabetes, not HELLP.","Relevant to hyperemesis or starvation."],
r:"Epigastric pain in HELLP comes from hepatic ischemia and capsule stretching, which clients often mistake for heartburn.",tk:"'Heartburn' + low platelets in late pregnancy = think HELLP."},
{tp:"hellp",sk:"TA",t:"mc",q:"A client with HELLP has platelets of 42,000/µL. An IM injection is ordered. What should the nurse do?",o:["Clarify the route with the provider because of bleeding risk","Give it and massage the site well","Give it in the deltoid instead of the gluteus","Give it and apply ice afterward"],a:0,
w:["Correct.","Massage worsens bleeding.","Any IM site can form a hematoma.","Does not remove the risk."],
r:"Bleeding precautions with severe thrombocytopenia: avoid IM injections and rectal temperatures, apply prolonged pressure, use soft toothbrushes.",tk:"Very low platelets: no IM, no rectal, press longer."},
{tp:"hellp",sk:"AC",t:"matrix",q:"Indicate the expected direction of each lab value in DIC.",o:["Platelet count","Fibrinogen","PT and aPTT","D-dimer / fibrin degradation products"],c:["Increased or prolonged","Decreased"],a:[1,1,0,0],
r:"Consumption of platelets and clotting factors lowers platelets and fibrinogen and prolongs clotting times; breakdown of fibrin raises D-dimer.",tk:"DIC: low platelets, low fibrinogen, long PT/aPTT, high D-dimer."},
{tp:"hellp",sk:"EO",t:"mc",q:"After delivery and blood product replacement for DIC, which finding best indicates improvement?",o:["Fibrinogen rising and no new oozing from IV sites","Platelet count continuing to fall on serial labs","New petechiae appearing across the trunk","Urine output of 15 mL/hr over the last 2 hours"],a:0,
w:["Correct: clotting factors recovering and bleeding stopping.","Worsening.","Ongoing coagulopathy.","Poor renal perfusion."],
r:"Lecture: management treats the underlying cause and assesses for bleeding; recovery shows as rising fibrinogen and platelets, stable vitals, and adequate urine output.",tk:"DIC improving = fibrinogen up, bleeding stops."}
);

/* Part D: cervical insufficiency, miscarriage, ectopic/molar, previa, abruption */
CASES.prev = {title:"Unfolding case: Meghan, 34 weeks", bg:"Meghan, 36, G5 T2 P0 A2 L2, prior cesarean, chronic hypertension. She arrives at the ED at 34 weeks."};
CASES.abr = {title:"Unfolding case: Rosa, a fall at 31 weeks", bg:"Rosa, 33, G3 P2 at 31 weeks with chronic hypertension, slipped and fell down four stairs this morning."};
QS.push(
/* ---------- CERVICAL INSUFFICIENCY (5) ---------- */
{tp:"ci",sk:"AC",t:"mc",q:"A client at 19 weeks reports pelvic pressure and increased watery discharge without pain. She has had two prior losses at 18 and 21 weeks. Which condition does the nurse suspect?",o:["Cervical insufficiency","Placental abruption","Ectopic pregnancy","Hyperemesis gravidarum"],a:0,
w:["Correct: painless second-trimester dilation with a history of late losses.","Abruption is painful and later in pregnancy.","Ectopic presents earlier with pain.","No vomiting."],
r:"Lecture: cervical insufficiency is impaired cervical strength; etiology is an OB history of preterm births or late miscarriages.",tk:"Painless 2nd-trimester pressure + prior late losses = cervical insufficiency."},
{tp:"ci",sk:"GS",t:"mc",q:"Which treatment does your lecture list for cervical insufficiency?",o:["Cerclage with close monitoring of the pregnancy","Methotrexate injection to stop the pregnancy","Suction curettage to empty the uterus","Salpingectomy to remove the affected tube"],a:0,
w:["Correct.","For ectopic pregnancy.","For molar pregnancy or retained tissue.","For ectopic pregnancy."],
r:"Lecture management: cerclage, close monitoring, report signs and symptoms of preterm labor. The cerclage diagram shows McDonald, Shirodkar, TVCIC, and TAC placements.",tk:"Weak cervix = stitch it and watch closely."},
{tp:"ci",sk:"EO",t:"sata",q:"A client is discharged after cerclage placement. Which statements show correct understanding? Select all that apply.",o:["\"I will call if I have contractions or cramping that keeps coming back.\"","\"I will report any fluid leaking from my vagina.\"","\"I will report a fever or foul-smelling discharge.\"","\"The stitch guarantees I will carry to term.\"","\"I'll follow the activity limits my provider gives me.\""],a:[0,1,2,4],
w:["Correct: possible preterm labor.","Correct: possible membrane rupture.","Correct: possible infection.","Cerclage reduces risk but does not guarantee term birth.","Correct: restrictions are individualized."],
r:"Course study guide: teach monitoring for contractions, bleeding, fluid leakage, fever, or pain; membrane rupture, labor, or infection may require removal.",tk:"Cerclage: report contractions, fluid, bleeding, fever."},
{tp:"ci",sk:"PH",t:"mc",q:"A client with a cerclage placed at 14 weeks is now 24 weeks and calls with fever 101.4°F and uterine tenderness. What is the nurse's priority?",o:["Have her come in now for evaluation of intrauterine infection","Tell her to take acetaminophen and call if fever lasts 3 days","Reassure her that tenderness is common with a stitch","Schedule an ultrasound for next week"],a:0,
w:["Correct: chorioamnionitis may require cerclage removal and delivery.","Delays care.","Fever and tenderness are not expected.","Too slow."],
r:"Infection changes cerclage candidacy (study guide). Untreated intrauterine infection threatens both mother and fetus.",tk:"Cerclage + fever = come in now."},
{tp:"ci",sk:"AC",t:"mc",q:"Why is a contraction stress test contraindicated for a client with cervical insufficiency?",o:["Induced contractions could cause further cervical dilation and preterm birth","The cerclage stitch blocks the tocodynamometer from reading contractions","Oxytocin is ineffective once a cerclage has been placed in the cervix","The test cannot detect fetal heart accelerations in the second trimester"],a:0,
w:["Correct: worksheet lists cervical insufficiency as a CST contraindication.","Not true.","Not the reason.","CST evaluates decelerations, and the reason is clinical risk."],
r:"Do not perform a CST on any client who should not give birth vaginally at the time of the test.",tk:"Weak cervix: no induced contractions."},

/* ---------- MISCARRIAGE (6) ---------- */
{tp:"sab",sk:"AC",t:"matrix",q:"Classify each presentation of early pregnancy loss.",o:["Light bleeding, closed cervix, fetal heart activity present","Moderate bleeding and cramping, cervix dilated, no tissue passed yet","Heavy bleeding, some tissue passed, some retained","Brownish spotting, closed cervix, nonviable pregnancy retained on ultrasound"],c:["Threatened","Inevitable","Incomplete","Missed"],a:[0,1,2,3],
r:"The cervix and the tissue decide the type: threatened (closed, viable), inevitable (open, progressing), incomplete (some retained), missed (nonviable but retained).",tk:"Closed + viable = threatened; open = inevitable."},
{tp:"sab",sk:"PH",t:"mc",q:"Which client in the early pregnancy unit should the nurse assess first?",o:["8 weeks, fever 102°F, foul-smelling discharge, and uterine tenderness after passing tissue","10 weeks, light spotting, BP 118/74, HR 82","12 weeks, threatened abortion, crying and asking what she did wrong","16 weeks with a cerclage, mild low back ache"],a:0,
w:["Correct: possible septic abortion, which can progress to sepsis.","Stable.","Emotional need, not physiologically unstable.","Needs assessment but is stable."],
r:"Course study guide: septic abortion is an infected loss with fever, uterine tenderness, and systemic symptoms; physiologic threats come before emotional needs.",tk:"Fever after a loss = septic until proven otherwise."},
{tp:"sab",sk:"GS",t:"sata",q:"An Rh-negative client has a complete spontaneous abortion at 9 weeks. Which nursing actions are appropriate? Select all that apply.",o:["Assess amount of bleeding and vital signs","Verify antibody status and give Rh(D) immune globulin as ordered","Offer grief support and resources","Tell her the loss was likely caused by exercise","Teach to report heavy bleeding, fever, or foul discharge"],a:[0,1,2,4],
w:["Correct.","Correct: prevents sensitization in future pregnancies.","Correct.","Inaccurate and harmful; many early losses are chromosomal.","Correct."],
r:"Priority assessment: hemodynamics, bleeding, infection signs, blood type and Rh, emotional needs (study guide).",tk:"Loss + Rh-negative = RhoGAM + grief support."},
{tp:"sab",sk:"TA",t:"mc",q:"A client with an inevitable abortion at 11 weeks is soaking a pad every 15 minutes. BP 94/58, HR 118. What is the nurse's first action?",o:["Call for help, establish large-bore IV access, and notify the provider","Weigh the pads to measure loss and recheck vital signs in an hour","Offer pain medication and a warm blanket, then reassess comfort","Begin discharge teaching about pelvic rest and bleeding precautions"],a:0,
w:["Correct: hemorrhage with early shock.","Too slow for this rate of bleeding.","Comfort measures come after stabilization.","Inappropriate while unstable."],
r:"Lecture: hemorrhagic disorders in pregnancy are medical emergencies; maternal blood loss reduces oxygen-carrying capacity and risks hypovolemia.",tk:"Soaking pads + tachycardia = emergency."},
{tp:"sab",sk:"EO",t:"mc",q:"Which statement by the nurse to a client after a miscarriage is therapeutic?",o:["\"I'm so sorry for your loss. Would you like to talk about how you are feeling?\"","\"At least you are young, so you will be able to try again soon.\"","\"It was probably for the best, since something must have been wrong.\"","\"You shouldn't be too sad; this happens to many women every year.\""],a:0,
w:["Correct: acknowledges the loss and invites expression.","Minimizes the loss.","Minimizes and assumes.","Dismisses her feelings."],
r:"Grief-sensitive, nonjudgmental support is part of nursing care for every pregnancy loss.",tk:"Acknowledge, don't minimize."},
{tp:"sab",sk:"RC",t:"mc",q:"Ms. C. (G5 P3) reports cramping in both lower quadrants (10/10), moderate bleeding this morning, and dark brown intermittent bleeding over the past week. BP 102/54, HR 104. Which additional finding is most important to determine the type of loss?",o:["Whether the cervix is open or closed","Her vitamin D intake","Her history of diverticulosis","Whether she had a kneecap replacement"],a:0,
w:["Correct: cervical status separates threatened from inevitable or incomplete.","Irrelevant.","Not the deciding factor.","Irrelevant."],
r:"From your bleeding concept map, Report B. Ultrasound and serial hCG also guide classification, and her tachycardia needs hemodynamic monitoring.",tk:"Cervix status classifies the loss."},

/* ---------- ECTOPIC & MOLAR (6) ---------- */
{tp:"ecto",sk:"PH",t:"bt",q:"A client at 7 weeks reports sudden severe left lower quadrant pain and right shoulder pain. She is pale and diaphoretic. BP 84/50, HR 128, light vaginal spotting. Transvaginal ultrasound shows no intrauterine pregnancy. Complete the bow-tie.",
c:["Ruptured ectopic pregnancy","Threatened abortion","Hyperemesis gravidarum","Molar pregnancy"],ca:0,
ac:["Activate emergency response and establish two large-bore IVs","Prepare for surgery (salpingectomy)","Give methotrexate IM","Schedule a repeat hCG in 48 hours","Encourage oral fluids"],aa:[0,1],
pm:["Blood pressure and heart rate","Hemoglobin/hematocrit and blood loss","Weekly fetal kick counts","Deep tendon reflexes","Urine ketones"],pa:[0,1],
r:"Lecture: ectopic = implantation outside the uterine cavity, 90% tubal (ampulla), with abdominal pain, delayed menses, and abnormal bleeding; diagnosis by quantitative hCG and TVUS. Rupture bleeds into the abdomen; shoulder pain is referred from diaphragmatic irritation. Methotrexate is only for stable, unruptured ectopics.",tk:"Unstable ectopic = OR, not methotrexate."},
{tp:"ecto",sk:"GS",t:"sata",q:"A hemodynamically stable client with an unruptured ectopic pregnancy receives methotrexate. Which teaching is appropriate? Select all that apply.",o:["Return for weekly hCG levels until undetectable","Stop prenatal vitamins containing folic acid","Avoid alcohol","Report sudden severe pain or dizziness immediately","Take ibuprofen freely for cramping","Avoid prolonged sun exposure"],a:[0,1,2,3,5],
w:["Correct (lecture follow-up: weekly hCG).","Correct: folate counteracts methotrexate.","Correct: hepatotoxicity.","Correct: possible rupture.","NSAIDs interact with methotrexate; avoid.","Correct: photosensitivity."],
r:"Lecture management: methotrexate (medical), salpingectomy (surgical), follow-up with weekly hCG, future fertility, and contraception. Drug precautions are supplemental pharmacology.",tk:"MTX: no folate, alcohol, or NSAIDs; weekly hCG."},
{tp:"ecto",sk:"RC",t:"mc",q:"According to your lecture, where do most ectopic pregnancies implant?",o:["Fallopian tube, most often the ampulla","Cervix, near the internal os","Ovary, on the corpus luteum","Abdominal cavity, on the bowel"],a:0,
w:["Correct (90% tubal).","Uncommon site.","Uncommon site.","Uncommon site."],
r:"Lecture slide: 90% occur in the uterine (fallopian) tube, most on the ampulla; other sites include ovary, abdominal cavity, and cervix.",tk:"Tube, ampulla, 90%."},
{tp:"ecto",sk:"AC",t:"mc",q:"Ms. C. reports fatigue, lightheadedness, severe abdominal pain (8/10), and spotting. BP 102/54, HR 104, RR 22, pale mucous membranes, diminished peripheral pulses. Which interpretation is most accurate?",o:["Possible ectopic pregnancy with hypovolemia; treat as a hemorrhage emergency","Normal early pregnancy discomfort made worse by mild anxiety","Threatened abortion that needs only pelvic rest and follow-up","Hyperemesis gravidarum with mild dehydration from vomiting"],a:0,
w:["Correct.","Pain and perfusion cues are not normal.","Instability rules out a benign picture.","No vomiting history."],
r:"From your bleeding concept map, Report A. Early pregnancy + severe pain + spotting + signs of poor perfusion = ectopic until proven otherwise.",tk:"Early pregnancy + pain + poor perfusion = ectopic."},
{tp:"ecto",sk:"AC",t:"mc",q:"At 12 weeks, a client has dark brown vaginal bleeding, severe vomiting, a uterus larger than expected for dates, and a very high serum hCG. No fetal heart activity is detected. What does the nurse suspect?",o:["Hydatidiform mole","Twin pregnancy","Hyperemesis gravidarum alone","Missed abortion"],a:0,
w:["Correct.","Twins would show fetal activity.","Does not explain the size, bleeding, or hCG.","hCG would be falling, and the uterus would not be large for dates."],
r:"Lecture: molar pregnancy (1:1000, unknown cause, complete or partial) presents with blood loss and anemia; diagnosis by TVUS and serum hCG. Very high hCG and large-for-dates uterus are classic supplemental signs.",tk:"Too big + too much hCG = mole."},
{tp:"ecto",sk:"EO",t:"mc",q:"After suction curettage for a molar pregnancy, which client statement shows understanding?",o:["\"I'll have weekly hCG checks and frequent pelvic exams, and avoid pregnancy during follow-up.\"","\"Once the uterus is empty, I won't need any more follow-up visits or blood tests.\"","\"I can start trying to conceive again as soon as next month if I feel well.\"","\"I only need to come back for an ultrasound if I have pain or bleeding.\""],a:0,
w:["Correct (lecture follow-up).","Persistent disease must be ruled out.","A new pregnancy would raise hCG and mask persistent disease.","hCG, not symptoms, guides follow-up."],
r:"Lecture: management by suction curettage and coping with loss; follow-up with weekly hCG and frequent pelvic examinations.",tk:"Mole: watch hCG weekly; no pregnancy during follow-up."},

/* ---------- PLACENTA PREVIA (6) ---------- */
{tp:"previa",sk:"AC",t:"mc",case:"prev",info:"<b>ED arrival:</b> Painless bright red bleeding since this morning. No contractions. Abdomen soft, uterus nontender with normal tone. T 98.6°F, BP 110/54, HR 90, RR 20.",q:"Which condition should the nurse suspect?",o:["Placenta previa","Placental abruption","Preterm labor","Uterine rupture"],a:0,
w:["Correct.","Abruption is painful with a firm, tender uterus.","No contractions.","Would cause severe pain and fetal distress."],
r:"From your collaborative activity Part 2. Lecture: previa is painless bright red bleeding; prior cesarean and older maternal age are risk factors.",tk:"Painless + bright red + soft uterus = previa."},
{tp:"previa",sk:"TA",t:"sata",case:"prev",info:"Vital signs are recorded.",q:"Which actions should the nurse take next? Select all that apply.",o:["Apply continuous fetal monitoring","Notify the provider","Perform a sterile vaginal exam to check dilation","Insert a large-bore IV and send CBC and type and crossmatch","Prepare for transabdominal ultrasound","Position laterally and monitor bleeding"],a:[0,1,3,4,5],
w:["Correct.","Correct.","Contraindicated: can provoke massive hemorrhage.","Correct.","Correct (lecture: standard diagnosis is transabdominal ultrasound).","Correct."],
r:"Lecture: no vaginal or rectal examinations with placenta previa.",tk:"Suspected previa: hands out of the vagina."},
{tp:"previa",sk:"GS",t:"mc",case:"prev",info:"Bleeding stops. FHR is reassuring. She is 34 weeks.",q:"Which management plan matches the lecture?",o:["Expectant management: observation, rest, and no vaginal or rectal exams","Immediate oxytocin induction to deliver before bleeding worsens","Amniotomy to speed labor and lower the risk of more bleeding","Discharge home today with no activity restrictions"],a:0,
w:["Correct.","Contractions risk hemorrhage.","Contraindicated.","Unsafe."],
r:"Lecture: expectant management (observation and bed rest, no vaginal or rectal exams, home care) vs active management (cesarean birth).",tk:"Stable preterm previa = expectant management."},
{tp:"previa",sk:"EO",t:"sata",case:"prev",info:"<b>Day 3:</b> No bleeding for 48 hours. Discharge orders list magnesium sulfate, Methergine, lisinopril, and sertraline.",q:"Which prescriptions should the nurse question? Select all that apply.",o:["Methergine","Lisinopril","Sertraline","Prenatal vitamins with folic acid"],a:[0,1],
w:["Correct: a uterotonic given only after birth.","Correct: ACE inhibitor, contraindicated in pregnancy.","Not contraindicated by this case.","Appropriate."],
r:"Collaborative activity item (no key supplied). Lisinopril is the learning map's contraindicated BP drug; Methergine causes sustained uterine contraction and hypertension. Magnesium sulfate is an IV inpatient drug and would also need clarification on a discharge list.",tk:"Antepartum: no ACE inhibitors, no uterotonics."},
{tp:"previa",sk:"RC",t:"sata",q:"Which complications are associated with placenta previa according to your lecture? Select all that apply.",o:["Excessive bleeding","Abnormal placental attachment","Preterm birth","Fetal malpresentation","Macrosomia"],a:[0,1,2,3],
w:["Correct.","Correct.","Correct.","Correct.","Not associated."],
r:"Lecture outcomes: abnormal placental attachment, excessive bleeding; fetal risks include malpresentation, preterm birth, fetal anemia, and congenital anomalies.",tk:"Previa: bleeding and early birth."},
{tp:"previa",sk:"EO",t:"mc",q:"Which statement by a client with placenta previa going home shows understanding?",o:["\"I won't have intercourse or put anything in my vagina, and I'll come in for any bleeding.\"","\"Light bleeding is expected now, so I will just wait for my next visit.\"","\"I can use tampons if I have spotting, as long as I change them often.\"","\"I should walk a lot every day to help get my body ready for labor.\""],a:0,
w:["Correct.","Any bleeding must be evaluated.","Nothing in the vagina.","Activity follows provider orders; labor is not the plan."],
r:"Previa home care: pelvic rest, report bleeding, contractions, pain, or decreased fetal movement.",tk:"Previa at home: pelvic rest, report any bleeding."},

/* ---------- ABRUPTION (6) ---------- */
{tp:"abrupt",sk:"RC",t:"mc",case:"abr",info:"<b>Arrival:</b> Rosa says she feels \"mostly fine.\" BP 130/82, HR 98. Small amount of dark vaginal blood, mild low back pain, uterus slightly tender. FHR baseline 155 with minimal variability.",q:"Why is the nurse concerned despite near-normal vital signs?",o:["Expanded blood volume can hide blood loss, and abruption bleeding can be concealed","Vital signs are always normal for the first few hours after a fall","Dark blood is a normal finding for a client at 31 weeks of gestation","Back pain is expected in the third trimester and is not concerning"],a:0,
w:["Correct (lecture: significant blood loss is less obvious in vital signs).","Not a reason for reassurance.","Not normal after trauma.","With trauma and bleeding, it is concerning."],
r:"Lecture trauma slides: decreased tolerance for hypoxia, significant blood loss less obvious in VS, and the fetus depends on maternal arterial pressure. Minimal variability may be an early fetal cue.",tk:"Pregnant trauma: vital signs can lie."},
{tp:"abrupt",sk:"AC",t:"mc",case:"abr",info:"<b>90 minutes later:</b> Constant abdominal pain 8/10, uterus rigid and boardlike. BP 90/56, HR 130. Recurrent late decelerations. Visible bleeding is still small.",q:"What is the most likely explanation?",o:["Placental abruption with concealed hemorrhage","Placenta previa","Normal preterm labor","Round ligament strain from the fall"],a:0,
w:["Correct.","Previa is painless with a soft uterus.","A rigid uterus and shock are not normal labor.","Does not cause shock or late decelerations."],
r:"Lecture: abruption is premature separation of a normally implanted placenta (1:100 births, grades 1 to 3), with bleeding, abdominal pain, uterine tenderness, and contractions; diagnosis is primarily clinical.",tk:"Shock out of proportion to visible blood = concealed abruption."},
{tp:"abrupt",sk:"TA",t:"order",case:"abr",info:"Rosa's condition is unchanged.",q:"Place the nurse's actions in priority order.",o:["Call for help and notify the provider","Position laterally and apply oxygen per protocol","Establish two large-bore IVs and send type and crossmatch and coagulation studies","Give IV fluids and blood products as ordered","Prepare for urgent cesarean birth"],
r:"Mobilize the team, optimize perfusion, gain access and labs (including coags for DIC), replace volume, and prepare for active management when mother and fetus are compromised.",tk:"Help, position, access, replace, deliver."},
{tp:"abrupt",sk:"EO",t:"sata",case:"abr",info:"<b>In the OR:</b> oozing from IV sites and the incision. Platelets 70,000/µL, fibrinogen low, PT and aPTT prolonged.",q:"Which findings indicate Rosa has developed DIC? Select all that apply.",o:["Oozing from IV sites","Low fibrinogen","Prolonged PT and aPTT","Platelets 70,000/µL","Rigid uterus"],a:[0,1,2,3],
w:["Correct.","Correct.","Correct.","Correct.","A sign of abruption, not a DIC lab finding."],
r:"Severe abruption releases tissue factor, triggering consumptive coagulopathy. Monitor fibrinogen closely; it is especially concerning in pregnancy.",tk:"Abruption → DIC: watch fibrinogen."},
{tp:"abrupt",sk:"AC",t:"matrix",q:"For each finding, choose whether it is more consistent with placenta previa or placental abruption.",o:["Painless bright red bleeding","Rigid, tender uterus","Soft, relaxed uterus with normal tone","Dark bleeding with constant pain","Diagnosis by transabdominal ultrasound","Concealed hemorrhage and DIC risk"],c:["Placenta previa","Placental abruption"],a:[0,1,0,1,0,1],
r:"Previa is a location problem (painless, bright red, soft uterus, ultrasound diagnosis). Abruption is a separation problem (painful, dark or concealed bleeding, rigid uterus, clinical diagnosis, DIC risk).",tk:"Pain + rigid uterus = abruption."},
{tp:"abrupt",sk:"RC",t:"sata",q:"Which factors increase the risk of placental abruption? Select all that apply.",o:["Chronic hypertension","Blunt abdominal trauma","Cocaine use","HELLP syndrome","Low-lying placenta on ultrasound"],a:[0,1,2,3],
w:["Correct (lecture links chronic HTN to abruption).","Correct.","Correct (vasoconstriction; supplemental).","Correct (lecture lists abruption as a HELLP complication).","A low-lying placenta is a type of previa, not an abruption risk factor."],
r:"Vasoconstriction and shearing forces separate a normally implanted placenta; hypertensive disorders are the most common association.",tk:"HTN, trauma, cocaine, HELLP → abruption."}
);

CASES.msp={title:"Unfolding case: Ms. P., bleeding at 26 weeks",bg:"Ms. P., 28, G5 P3, is 26 weeks pregnant. History: diverticulosis, one prior cesarean birth, knee surgery. Smokes 1 pack of cigarettes per day. Home medications: vitamin D 5000 IU daily and prenatal vitamins."};
QS.push(
{tp:"previa",sk:"AC",t:"mc",case:"msp",info:"<b>Arrival:</b> Ms. P. reports fatigue and lightheadedness and noticed bright red vaginal bleeding this morning. Pain 0/10. BP 122/54, HR 99, RR 20. Abdomen soft; uterus nontender to palpation.",q:"Which condition is the nurse most likely to suspect?",
o:["Placenta previa","Placental abruption","Preterm labor with bloody show","Cervical insufficiency with membrane bulging"],a:0,
w:["Correct: painless, bright red bleeding with a soft, nontender uterus in the second half of pregnancy is the classic previa pattern.","Abruption causes pain, a firm or tender uterus, and often dark bleeding; Ms. P. has none of these.","Bloody show is a small amount of blood-tinged mucus with contractions; she has frank bright red bleeding and no contractions.","Cervical insufficiency presents with pelvic pressure and watery discharge, usually earlier in the second trimester, not bright red bleeding."],
r:"In placenta previa the placenta implants over or near the cervical os. As the lower uterine segment stretches and the cervix begins to change, the placental attachment is disrupted, causing bleeding from open maternal sinuses. Because the uterus itself is not irritated, the bleeding is painless and the uterus stays soft. Bright red blood means it is fresh and exiting quickly rather than pooling behind the placenta.",tk:"Painless + bright red + soft uterus = previa."},
{tp:"previa",sk:"RC",t:"sata",case:"msp",q:"Which findings in Ms. P.'s history increase her risk for this condition? Select all that apply.",
o:["Prior cesarean birth","Smoking 1 pack per day","Multiparity (G5 P3)","Diverticulosis","Vitamin D 5000 IU daily"],a:[0,1,2],
w:["Correct: a uterine scar can lead to abnormal implantation in the lower segment.","Correct: smoking impairs uteroplacental perfusion, and the placenta compensates by spreading over a larger surface, including the lower segment.","Correct: multiple prior pregnancies damage the endometrium of the upper segment, so implantation shifts lower.","Diverticulosis is a bowel condition with no link to placental implantation.","Vitamin D supplementation does not affect where the placenta implants."],
r:"Previa risk factors share one mechanism: scarred or poorly perfused endometrium in the upper uterus pushes implantation toward the lower segment. Prior cesarean, uterine surgery, multiparity, advanced maternal age, multiple gestation, and smoking all fit this pattern.",tk:"Previa risks: scar, smoking, many pregnancies."},
{tp:"previa",sk:"GS",t:"mc",case:"msp",info:"<b>What if:</b> Two hours later Ms. P. reports regular tightening every 8 minutes with low back pain. The provider suspects preterm labor.",q:"Which prescription should the nurse question?",
o:["Perform a digital cervical exam to assess dilation","Apply the external fetal monitor and tocodynamometer","Give betamethasone 12 mg IM, two doses 24 hours apart","Start lactated Ringer's through a large-bore IV catheter"],a:0,
w:["Correct: with a known or suspected previa, a digital exam can tear the placenta and cause massive hemorrhage. Dilation is assessed by ultrasound or a sterile speculum exam only, by the provider, in a setting ready for cesarean birth.","Continuous fetal monitoring with contraction tracking is appropriate for both bleeding and preterm labor.","At 26 weeks, antenatal corticosteroids speed fetal lung maturity and are indicated when preterm birth may happen within 7 days.","Large-bore IV access prepares for fluid resuscitation or transfusion if bleeding increases."],
r:"Preterm labor in a client with previa adds risk: contractions efface the cervix and shear the placenta from the lower segment. Every intervention that would normally assess the cervix must be weighed against that risk. Care is supportive: monitor the fetus and contractions, protect access for transfusion, and give corticosteroids for fetal lungs.",tk:"Previa: no digital cervical exams, ever."},
{tp:"abrupt",sk:"PH",t:"mc",case:"msp",info:"<b>What if:</b> Ms. P. later reports dark vaginal bleeding, constant abdominal pain, uterine tenderness, and contractions.",q:"Which complication should the nurse now suspect, and why?",
o:["Placental abruption: separation with bleeding behind the placenta","Uterine rupture from her prior cesarean scar, with fetal parts felt","Worsening previa as more of the lower segment thins out","Normal progression of preterm labor with bloody show"],a:0,
w:["Correct: pain, tenderness, contractions, and dark (older, pooled) blood signal premature separation. Her smoking is also a major abruption risk factor.","Rupture usually presents with sudden tearing pain, loss of fetal station, and fetal parts palpable through the abdomen; dark bleeding with tenderness fits abruption better.","Previa bleeding stays painless with a soft uterus; the new pain and tenderness point to a second problem.","Bloody show is scant and mucus-like; dark bleeding with a tender uterus is never normal labor."],
r:"In abruption the placenta separates from a normally located implantation site. Blood collects between the placenta and uterine wall, irritating the myometrium (pain, tenderness, hypertonic contractions) and darkening as it pools. Some or all of the hemorrhage may be concealed, so vital signs and visible loss can underestimate blood loss. Smoking and cocaine cause vasoconstriction that weakens the placental bed.",tk:"Dark blood + pain + tender uterus = abruption."},
{tp:"abrupt",sk:"GS",t:"matrix",case:"msp",q:"The nurse compares the plan of care for placenta previa and placental abruption. For each intervention, choose whether it is specific to previa, specific to abruption, or common to both.",
o:["Avoid vaginal and rectal exams; confirm placental location by transabdominal ultrasound","Measure abdominal girth and fundal height and mark the fundus to detect concealed bleeding","Continuous electronic fetal monitoring and maternal vital signs","Large-bore IV access, type and crossmatch, CBC","Expectant management with activity restriction if bleeding stops and the fetus is immature","Monitor fibrinogen, platelets, and PT/aPTT for DIC"],
c:["Previa","Abruption","Both"],a:[0,1,2,2,0,1],
r:"Both conditions threaten maternal circulation and fetal oxygenation, so monitoring, IV access, and blood readiness are shared. Previa care centers on not disturbing the placenta over the os and buying time when bleeding settles. Abruption care centers on hidden blood loss (rising fundus, girth) and the consumptive coagulopathy that tissue factor from the damaged placenta triggers.",tk:"Previa: protect the os. Abruption: find hidden blood and DIC."},
{tp:"pre",sk:"GS",t:"sata",q:"A client at 32 weeks has preeclampsia without severe features and will be managed at home. According to your PIH map, which interventions belong in her plan? Select all that apply.",
o:["Rest in a lateral position","Daily blood pressure monitoring","Fetal kick counts and a nonstress test weekly or twice a week","High-protein diet with adequate water intake","Place in a dark, quiet room and start magnesium sulfate","Limit fluids to 1 liter per day to reduce edema"],a:[0,1,2,3],
w:["Correct (PIH map): lateral positioning improves uteroplacental and renal blood flow.","Correct: daily BP readings detect progression toward severe features.","Correct: weekly fetal evaluations, kick counts, and NSTs track placental function.","Correct: protein replaces urinary losses and supports oncotic pressure; adequate water supports perfusion.","Dark room and magnesium are inpatient interventions for preeclampsia with severe features.","Fluid restriction worsens intravascular depletion, which is already present from capillary leak."],
r:"Preeclampsia narrows the vascular space (vasospasm plus capillary leak), so outpatient care protects perfusion and watches for progression. Your PIH map also lists elevating the feet, a low-sodium diet, and antihypertensives such as methyldopa or hydralazine. Note: current ACOG guidance no longer recommends strict bed rest or sodium restriction for preeclampsia; answer according to your course materials on the exam.",tk:"Mild PIH at home: lateral rest, daily BP, fetal checks, protein."},
{tp:"pre",sk:"AC",t:"matrix",q:"Using your PIH map, classify each client finding.",
o:["Weight gain of more than 5 lb in a week with mild facial and peripheral edema","BP 144/92, rechecked 4 hours later at 146/94, at 30 weeks in a previously normotensive client; platelets 210,000","New-onset hyperreflexia with headache and blurred vision","Tonic-clonic seizure","Platelets 88,000/µL with RUQ pain, no seizure activity"],
c:["Preeclampsia (mild)","Preeclampsia with severe features","Eclampsia"],a:[0,0,1,2,1],
r:"Severity follows organ involvement. The mild column is BP 140/90 or higher twice, 4 hours apart, after 20 weeks, with rapid weight gain and mild edema. Severe features add cerebral irritability (headache, visual changes, new hyperreflexia), thrombocytopenia under 100,000, liver involvement (RUQ pain), renal decline, or pulmonary edema. A seizure moves the diagnosis to eclampsia regardless of the BP.",tk:"Seizure = eclampsia; organ signs = severe."},
{tp:"ecl",sk:"TA",t:"sata",q:"A client at 31 weeks has preeclampsia with severe features. Which interventions from your PIH map should the nurse implement? Select all that apply.",
o:["Place her in a dark, quiet room","Give dexamethasone for fetal lung maturity as prescribed","Keep calcium gluconate at the bedside during magnesium sulfate","Set up seizure precautions and emergency resuscitation equipment","Encourage ambulation in the hallway every 2 hours","Group care and leave the overhead lights on for frequent checks"],a:[0,1,2,3],
w:["Correct: reducing light and noise lowers cerebral irritability.","Correct: your PIH map lists dexamethasone; your lecture also uses betamethasone. Both are antenatal corticosteroids.","Correct: calcium gluconate is the antidote for magnesium toxicity.","Correct: seizure precautions, suction, oxygen, and resuscitation equipment must be ready.","Activity increases stimulation and is not part of severe preeclampsia care.","Bright light is a stimulus that can trigger seizures; dim the room instead."],
r:"Vasospasm and endothelial damage make the brain irritable, so care lowers stimulation and protects against seizures (magnesium, precautions) while giving the fetus time to mature (corticosteroids) until delivery. Hydralazine manages severe BP. The nurse monitors vital signs, LOC, FHR, urine output, DTRs, IV rate, and serum magnesium levels.",tk:"Severe PIH: dark room, magnesium, calcium gluconate, steroids."}
);

QS.push(
{src:"Question Guide #1",tp:"gtpal",sk:"AC",t:"mc",q:"Ms. C. is 28 and visiting the clinic for prenatal care. She reports nausea/vomiting, weakness, fatigue, lightheadedness, coughing and sore throat, and constipation. Her last normal menstrual period was 8 weeks ago (January 12, 2023), and her home pregnancy test was positive. What is her estimated day of delivery?",o:["October 5, 2023","October 19, 2023","September 19, 2023","November 12, 2023"],a:1,w:["Subtracted 7 days.","Correct (class answer).","Subtracted 4 months.","Added 10 months."],r:"Nägele’s rule: January 12 − 3 months = October 12; + 7 days = October 19; + 1 year = 2023.",tk:"−3 months, +7 days, +1 year."},
{src:"Question Guide #2",tp:"signs",sk:"RC",t:"sata",q:"Which of these signs and symptoms are <b>presumptive</b> for pregnancy? Select all that apply.",o:["Ballottement","Braxton Hicks contractions","Positive pregnancy test results","Hegar sign","Chadwick sign","Goodell sign","Breast enlargement and firmness","Amenorrhea","Urinary frequency","Nausea, vomiting","Fatigue","Quickening","Fetal movement palpated by examiner","Fetal heart tones by ultrasound"],a:[6,7,8,9,10,11],w:["Probable.","Probable.","Probable.","Probable.","Probable.","Probable.","Presumptive.","Presumptive.","Presumptive.","Presumptive.","Presumptive.","Presumptive.","Positive.","Positive."],r:"Presumptive = experienced or reported by the client. (Your guide references figure 8.1 in the book; no written key was supplied.)",tk:"Client-reported = presumptive."},
{src:"Question Guide #3",tp:"signs",sk:"RC",t:"sata",q:"<b>Probable</b> signs that Ms. C. is pregnant include: Select all that apply.",o:["Ballottement","Braxton Hicks contractions","Positive pregnancy test results","Hegar sign","Chadwick sign","Goodell sign","Breast enlargement and firmness","Amenorrhea","Urinary frequency","Nausea, vomiting","Fatigue","Quickening","Fetal movement palpated by examiner","Fetal heart tones by ultrasound"],a:[0,1,2,3,4,5],w:["Probable.","Probable.","Probable.","Probable.","Probable.","Probable.","Presumptive.","Presumptive.","Presumptive.","Presumptive.","Presumptive.","Presumptive.","Positive.","Positive."],r:"Probable = observed by the examiner but not conclusive.",tk:"Examiner-observed, not proof = probable."},
{src:"Question Guide #4",tp:"signs",sk:"RC",t:"mc",q:"The bluish discoloration of the vagina, cervix, and labia is known as:",o:["Chadwick sign","Hegar sign","Goodell sign","Braxton Hicks sign"],a:0,w:["Correct.","Softening of the lower uterine segment.","Softening of the cervix.","Painless irregular contractions."],r:"Chadwick = blue (increased vascularity).",tk:"Chadwick = blue."},
{src:"Question Guide #5",tp:"adapt",sk:"AC",t:"sata",q:"A normal physiologic change associated with the first trimester of pregnancy is: (Select all your class notes support.)",o:["Increased respirations","Increased peristalsis","Increased resistance to infection","Decrease in blood pressure","Increased cardiac output"],a:[3,4],w:["Rate changes little; tidal volume rises.","Class note: progesterone causes MORE constipation (decreased peristalsis).","Class note: MORE susceptible to infection.","Class note: relaxing hormone causes decreased BP.","Class note: blood volume (plasma especially) increases to support the fetus and placenta."],r:"Your class annotations corrected b and c and explained d and e as true. Written as single-answer in the guide; the annotations support decreased BP and increased cardiac output.",tk:"BP down, cardiac output up, gut slower, infection risk up."},
{src:"Question Guide #6",tp:"adapt",sk:"GS",t:"mc",q:"Health teaching of particular importance at this early stage of pregnancy includes:",o:["Comfort measures for trimester-related discomforts","Choices of prenatal education classes","Signs and symptoms of labor","Infant feeding techniques"],a:0,w:["Correct.","Later.","Late pregnancy.","Midpregnancy."],r:"Class note: teach to take prenatals, small frequent meals (more proteins), folic acid intake.",tk:"Teach what matters now."},
{src:"Question Guide #7",tp:"adapt",sk:"AC",t:"mc",q:"The primary source of the hormones estrogen and progesterone during early pregnancy is the:",o:["Placenta","Anterior lobe of the pituitary gland","Corpus luteum","Adrenal cortex"],a:2,w:["Takes over later.","Not the source.","Correct.","Not the source."],r:"The corpus luteum produces estrogen and progesterone until the placenta takes over.",tk:"Early hormones = corpus luteum."},
{src:"Question Guide #8",tp:"adapt",sk:"RC",t:"mc",q:"A pregnant woman should immediately report which of the following symptoms to her health care provider?",o:["Leg cramps","Abdominal pain","Dyspnea","Heartburn"],a:1,w:["Common discomfort.","Correct.","Mild dyspnea is common as the uterus grows.","Common discomfort."],r:"Abdominal pain may signal ectopic pregnancy, abruption, preterm labor, or preeclampsia (RUQ).",tk:"Abdominal pain = report now."},
{src:"Question Guide #9",tp:"gtpal",sk:"AC",t:"mc",q:"Ms. C. is at 28 weeks. This is her fifth pregnancy; she has four living children and one set of twins born at 36 weeks. How is her obstetric history recorded?",o:["G5 P3 T2 P1 A1 L4","G5 P4 T2 P2 A0 L4","G4 P3 T2 P1 A1 L4","G5 P3 T3 P0 A1 L4"],a:0,w:["Correct (class answer).","Twins count once.","G includes the current pregnancy.","36 weeks is preterm."],r:"Class answer: G5, P3, T2, P1, A1, L4. The instructor marked this history “FIX ME” because the prose is incomplete.",tk:"Twins = 1 birth, 2 living."},
{src:"Question Guide #10",tp:"adapt",sk:"GS",t:"sata",q:"Routine laboratory tests that should be repeated at the 28-week visit include: Select all that apply.",o:["hCG level","Rubella titer","Antibody screen","CBC with differential smear"],a:[2,3],w:["Not repeated once pregnancy is confirmed.","Done once at the first visit.","Repeated near 28 weeks for Rh-negative clients before Rh(D) immune globulin.","Hgb/Hct repeated to detect anemia."],r:"No key was supplied. Course study guide: Rh-negative unsensitized clients are rescreened near 28 weeks; lecture: Hgb/Hct monitoring.",tk:"28 weeks: antibody screen, CBC, glucose screen."},
{src:"Question Guide #11",tp:"adapt",sk:"AC",t:"mc",q:"She reports feeling fatigued and being bothered by constipation. These symptoms are related to the hormone:",o:["Estrogen","hCG","Thyroxine","Relaxin"],a:3,w:["Not primarily responsible.","Peaks early.","Increases metabolism.","Best of these choices: relaxes smooth muscle."],r:"No key was supplied. Smooth-muscle relaxation slows the gut; progesterone is the main driver but is not an option, so relaxin is the best choice. Confirm with your professor.",tk:"Relaxed smooth muscle = constipation."},
{src:"Question Guide #12",tp:"adapt",sk:"AC",t:"mc",q:"Her hemoglobin value is 11.7 g/dL. Which factor explains this finding?",o:["The trimester of pregnancy","Hemodilution of pregnancy","The presence of iron deficiency anemia","Greater-than-expected weight gain"],a:1,w:["Not the mechanism.","Correct.","Not supported by one mild value.","Unrelated."],r:"Plasma volume rises more than red cells. Class note: iron foods = greens, beans, peanuts, rice, pasta.",tk:"Hgb 11.7 in pregnancy = hemodilution."},
{src:"Question Guide #13",tp:"adapt",sk:"AC",t:"mc",q:"At 28 weeks, her fundal height should measure about:",o:["20 cm","24 cm","28 cm","36 cm"],a:2,w:["Expected at 20 weeks.","Expected at 24 weeks.","Correct.","Expected at 36 weeks."],r:"Class note: at 20 weeks fundal height equals weeks pregnant; after 20 weeks cm ≈ weeks.",tk:"After 20 weeks, cm ≈ weeks."},
{src:"Question Guide #14",tp:"adapt",sk:"AC",t:"mc",q:"The increase in uterine size during pregnancy is primarily the result of which factor?",o:["Growth of the fetus","Formation of new muscle fibers","Increase in blood circulation to the uterus","Growth of existing myometrial cells and muscle fibers"],a:3,w:["Contributes but not primary.","Few new fibers form.","Contributes but not primary.","Correct."],r:"Uterine growth is mainly hypertrophy of existing myometrial cells.",tk:"Hypertrophy, not new fibers."},
{src:"Question Guide #15",tp:"adapt",sk:"AC",t:"mc",q:"Normal physiologic responses to pregnancy include:",o:["Increased cardiac output","Increased peristalsis","Increased respirations","Increased blood pressure"],a:0,w:["Correct.","Peristalsis decreases.","Rate changes little; tidal volume rises.","BP decreases."],r:"No key was supplied. Cardiac output increases with blood volume.",tk:"Cardiac output goes up."},
{src:"Question Guide #16",tp:"adapt",sk:"AC",t:"mc",q:"The expected height of the fundus at 28 weeks’ gestation is:",o:["At the xiphoid process","At the umbilicus","Halfway between the umbilicus and xiphoid process","At the symphysis pubis"],a:2,w:["About 36 weeks.","About 20 weeks.","Correct.","About 12 weeks."],r:"Fundus rises from the symphysis (12 wk) to the umbilicus (20 wk) to the xiphoid (36 wk).",tk:"28 weeks = halfway to the xiphoid."},
{src:"Collaborative Activity Part 1",tp:"dm",sk:"GS",t:"mc",q:"Meghan’s 1-hour glucose tolerance test was 140 mg/dL and requires the second step. What is the next step?",o:["Diagnose GDM and start insulin","A fasting 100 g, 3-hour OGTT","Repeat the 50 g test in a month","No further testing"],a:1,w:["Screen is not diagnostic.","Correct.","Delays diagnosis.","Positive screens need step 2."],r:"Lecture flowchart: positive ≥130 to 140 → 3-hour 100 g OGTT; GDM if ≥2 values met or exceeded.",tk:"Screen positive → 3-hour test."},
{src:"Collaborative Activity Part 2",tp:"previa",sk:"PH",t:"mc",q:"Meghan, 34 weeks, has painless bright red bleeding that started this morning, no contractions, soft relaxed abdomen, nontender uterus with normal tone. T 98.6°F, BP 110/54, HR 90, RR 20. What condition should the nurse suspect?",o:["Placental abruption","Placenta previa","Preterm labor","Cervical insufficiency"],a:1,w:["Abruption is painful with a firm uterus.","Correct.","No contractions.","Second trimester, painless dilation, not bright red bleeding at 34 weeks."],r:"Painless bright red bleeding + soft nontender uterus = previa.",tk:"Painless + bright red = previa."},
{src:"Collaborative Activity Part 2",tp:"previa",sk:"TA",t:"mc",q:"After obtaining Meghan’s vital signs, what should be the nurse’s next action?",o:["Perform a vaginal exam to assess dilation","Assess the fetal heart rate and notify the provider","Ambulate her to the bathroom","Administer oxytocin per protocol"],a:1,w:["Contraindicated with suspected previa.","Correct.","Unsafe.","Stimulates contractions."],r:"Assess fetal status, notify the provider, IV access, anticipate ultrasound; no vaginal or rectal exams.",tk:"Previa: fetus + provider, hands off the cervix."},
{src:"Collaborative Activity Part 2",tp:"previa",sk:"AC",t:"sata",q:"What 2 complications can result from Meghan’s condition? Select the two best.",o:["Hemorrhage (hemorrhagic shock)","Preterm birth","Gestational diabetes","Macrosomia","Post-term pregnancy"],a:[0,1],w:["Correct.","Correct.","Unrelated.","Unrelated.","Unrelated."],r:"Lecture: excessive bleeding; fetal risks include preterm birth, malpresentation, fetal anemia, congenital anomalies.",tk:"Previa → bleeding and early birth."},
{src:"Collaborative Activity Part 2",tp:"previa",sk:"EO",t:"sata",q:"Meghan has had no vaginal bleeding in 48 hours and has a discharge order. Which of these prescriptions should the nurse question? Select all that apply.",o:["Magnesium sulfate","Methergine","Lisinopril","Zoloft"],a:[0,1,2],w:["Correct: magnesium sulfate is an IV infusion given only in a monitored inpatient setting, and Meghan has no indication (no preeclampsia, eclampsia, or preterm labor) for it at discharge.","Correct: Methergine is a uterotonic used only after birth to control postpartum hemorrhage; antepartum it causes sustained uterine contraction and also raises BP.","Correct: lisinopril is an ACE inhibitor and is contraindicated in pregnancy (fetal renal injury); her chronic hypertension needs a pregnancy-safe drug such as methyldopa, labetalol, or nifedipine.","Sertraline (Zoloft) is not contraindicated by this case; continuing an SSRI in pregnancy is a provider decision weighing benefits and risks."],r:"No answer key was supplied with this activity. Lisinopril and Methergine are the clear targets from your learning map and lecture. Magnesium sulfate is also included here because an IV-only inpatient drug with no indication on a home discharge list must be clarified; if your professor keys only two answers, they will be Methergine and lisinopril.",tk:"Antepartum: no ACE inhibitors, no uterotonics."},
{src:"Collaborative Activity Part 2",tp:"previa",sk:"GS",t:"mc",q:"Meghan asks, “What is fetal kick count and how do I do that?” How should the nurse respond?",o:["“Count 60 minutes daily after a meal; call if fewer than 3 in an hour.”","“Count only when you notice the baby seems quieter than usual.”","“Count right after jogging, when the baby is usually most active.”","“Call right away if you feel more than 10 kicks in a single hour.”"],a:0,w:["Correct (assessment teaching worksheet).","Needs a consistent routine.","Exercise is not the method.","More movement is reassuring."],r:"Worksheet: count once a day for 60 minutes or 2 to 3 times daily for 2 hours; after meals or before bed; report no activity for 12 hours or fewer than 3 in 1 hour.",tk:"Consistent time; fewer than 3 in an hour → call."},
{src:"Pregnancy Terminology Activity",tp:"gtpal",sk:"AC",t:"mc",q:"Sally is pregnant for the fifth time. She has had one miscarriage at 16 weeks and one elective abortion in the first trimester. She has a son born at 40 weeks and a daughter born at 36 weeks. Her LMP is July 30, 2025. Which entry is correct?",
o:["G5 P2 T1 P1 A2 L2; EDD May 7, 2026","G5 P3 T1 P1 A1 L2; EDD May 7, 2026","G4 P2 T1 P1 A2 L2; EDD May 7, 2026","G5 P2 T1 P1 A2 L2; EDD April 23, 2026"],a:0,
w:["Correct: 5 pregnancies including the current one; births at 20 weeks or later = son (term) and daughter (preterm), so P2 T1 P1; two losses before 20 weeks = A2; 2 living. July 30 minus 3 months = April 30, plus 7 days = May 7, 2026.","A loss at 16 weeks is before 20 weeks, so it is an abortion, not a para.","Gravida includes the pregnancy in progress.","Naegele's rule adds 7 days after subtracting 3 months; April 23 subtracts them."],
r:"Handout definitions: Gravida = pregnancies regardless of outcome; Para = pregnancies ending at 20 weeks or later; Term = births at 38 to 42 weeks (your handout); Preterm = 20 weeks to before 37 weeks; Abortion = losses before 20 weeks (spontaneous or elective); Living = living children. EDD = LMP minus 3 months plus 7 days.",tk:"Under 20 weeks = A, whether spontaneous or elective."},
{src:"Pregnancy Terminology Activity",tp:"gtpal",sk:"AC",t:"mc",q:"Betsy arrives for her first prenatal visit. History: 4-year-old triplets born at 34 weeks and one miscarriage at 13 weeks. Her LMP is October 10, 2025. Which entry is correct?",
o:["G3 P1 T0 P1 A1 L3; EDD July 17, 2026","G3 P3 T0 P3 A1 L3; EDD July 17, 2026","G2 P1 T0 P1 A1 L3; EDD July 17, 2026","G3 P1 T1 P0 A1 L3; EDD July 3, 2026"],a:0,
w:["Correct: triplets, miscarriage, and current pregnancy = G3; the triplet birth is one preterm birth (P1, T0, P1); A1; three living children. October 10 minus 3 months = July 10, plus 7 days = July 17, 2026.","The number of fetuses does not change para; one triplet birth counts once for P and preterm.","She is currently pregnant, so G is 3.","34 weeks is preterm, and the EDD subtracts 7 days instead of adding them."],
r:"Only L counts babies. G, P, T, and preterm count pregnancies. Triplets born at 34 weeks add 1 to para and preterm and 3 to living.",tk:"Multiples: 1 birth, many living."},
{src:"Pregnancy Terminology Activity",tp:"gtpal",sk:"AC",t:"mc",q:"A primigravida is currently pregnant at 35 weeks with twins. LMP = February 21, 2026. Which entry is correct?",
o:["G1 P0 T0 P0 A0 L0; EDD November 28, 2026","G1 P1 T0 P1 A0 L2; EDD November 28, 2026","G2 P0 T0 P0 A0 L0; EDD November 28, 2026","G1 P0 T0 P0 A0 L0; EDD November 14, 2026"],a:0,
w:["Correct: first pregnancy, not yet delivered, so all outcome numbers are 0. February 21 minus 3 months = November 21, plus 7 days = November 28, 2026.","She has not given birth yet; the current pregnancy counts only toward gravida.","A twin pregnancy is still one pregnancy.","The EDD subtracts 7 days instead of adding them."],
r:"The current pregnancy adds to G only. T, P, A, and L change after the pregnancy ends.",tk:"Undelivered pregnancy counts only in G."},
{src:"Pregnancy Terminology Activity",tp:"gtpal",sk:"AC",t:"mc",q:"A client is currently pregnant at 19 weeks. History: 2 miscarriages (14 and 18 weeks), a son born at 38 weeks, a daughter born at 41 weeks, and a set of twins born at 39 weeks. LMP = May 1, 2025. Which entry is correct?",
o:["G6 P3 T3 P0 A2 L4; EDD February 8, 2026","G6 P4 T4 P0 A2 L4; EDD February 8, 2026","G5 P3 T3 P0 A2 L4; EDD February 8, 2026","G6 P3 T3 P0 A2 L4; EDD January 25, 2026"],a:0,
w:["Correct: 2 losses + 3 births + current = G6; three term births (38, 41, 39 weeks) = P3 T3; no preterm; A2; 4 living (son, daughter, twins). May 1 minus 3 months = February 1, plus 7 days = February 8, 2026.","The twins are one birth, so para and term are 3, not 4.","Gravida includes the current 19-week pregnancy.","The EDD subtracts 7 days instead of adding them."],
r:"Count each pregnancy event once: the 14- and 18-week losses are abortions (before 20 weeks); each delivery at 38 weeks or later is term on your handout.",tk:"Twins = 1 in P and T, 2 in L."},
{src:"Pregnancy Terminology Activity",tp:"gtpal",sk:"AC",t:"mc",q:"Josie is pregnant at 34 weeks with quadruplets. She has a 4-year-old son born at 28 weeks and a 2-year-old daughter born at 32 weeks. LMP = March 30, 2025. Which entry is correct?",
o:["G3 P2 T0 P2 A0 L2; EDD January 6, 2026","G3 P2 T0 P2 A0 L6; EDD January 6, 2026","G6 P2 T0 P2 A0 L2; EDD January 6, 2026","G3 P2 T0 P2 A0 L2; EDD December 23, 2025"],a:0,
w:["Correct: two prior births + current = G3; both births were preterm (P2 T0 P2); A0; 2 living. March 30 minus 3 months = December 30, plus 7 days = January 6, 2026.","The quadruplets are not born yet, so they are not counted as living.","A quadruplet pregnancy is one pregnancy.","The EDD subtracts 7 days instead of adding them, and the year rolls forward."],
r:"Naegele dates that cross December roll into the next year. Unborn multiples add only 1 to gravida.",tk:"Unborn babies are not L."},
{src:"Pregnancy Terminology Activity",tp:"gtpal",sk:"AC",t:"mc",q:"Cindy is pregnant at 12 weeks. She has had 2 elective abortions, at 14 weeks and 16 weeks. LMP = June 15, 2025. Which entry is correct?",
o:["G3 P0 T0 P0 A2 L0; EDD March 22, 2026","G3 P2 T0 P2 A0 L0; EDD March 22, 2026","G2 P0 T0 P0 A2 L0; EDD March 22, 2026","G3 P0 T0 P0 A2 L0; EDD March 8, 2026"],a:0,
w:["Correct: 2 prior pregnancies + current = G3; both ended before 20 weeks (A2); no births or living children. June 15 minus 3 months = March 15, plus 7 days = March 22, 2026.","Terminations before 20 weeks are abortions, not preterm births.","Gravida includes the current pregnancy.","The EDD subtracts 7 days instead of adding them."],
r:"Abortion in GTPAL includes elective and spontaneous losses before 20 weeks.",tk:"Elective or spontaneous, under 20 weeks = A."},
{src:"Pregnancy Terminology Activity",tp:"gtpal",sk:"AC",t:"mc",q:"Louise is pregnant at 21 weeks. She has 10-year-old twins born at 38 weeks and a 5-year-old son born at 26 weeks. LMP = March 17, 2025. Which entry is correct?",
o:["G3 P2 T1 P1 A0 L3; EDD December 24, 2025","G3 P3 T2 P1 A0 L3; EDD December 24, 2025","G3 P2 T1 P0 A1 L3; EDD December 24, 2025","G3 P2 T1 P1 A0 L3; EDD December 10, 2025"],a:0,
w:["Correct: twins + son + current = G3; twin birth at 38 weeks = term, son at 26 weeks = preterm (P2 T1 P1); A0; 3 living. March 17 minus 3 months = December 17, plus 7 days = December 24, 2025.","The twin birth counts once in para and term.","26 weeks is after 20 weeks, so it is a preterm birth, not an abortion.","The EDD subtracts 7 days instead of adding them."],
r:"Births at 20 to before 37 weeks are preterm even when very early; only losses before 20 weeks are abortions.",tk:"20 weeks is the para line."},
{src:"Pregnancy Terminology Activity",tp:"gtpal",sk:"AC",t:"mc",q:"Susie is 38 weeks pregnant. This is her second pregnancy. She delivered a healthy baby boy at 39 weeks with her first pregnancy. What is her GTPAL?",
o:["G2 T1 P0 A0 L1","G2 T2 P0 A0 L2","G1 T1 P0 A0 L1","G2 T1 P1 A0 L1"],a:0,
w:["Correct: 2 pregnancies, 1 term birth, no preterm births, no abortions, 1 living child.","Her current baby has not been born yet.","Gravida includes the current pregnancy.","She has had no preterm births."],
r:"GTPAL lists Gravida, Term, Preterm, Abortions, Living. The current 38-week pregnancy adds to G only until delivery.",tk:"GTPAL = G-T-P-A-L, current pregnancy only in G."},
{src:"Collaborative Activity Part 1",tp:"dm",sk:"RC",t:"mc",q:"Meghan arrives for her 24-week prenatal appointment, and the nurse explains she will complete a two-step glucose screening test today. Why is this test important?",
o:["It screens for gestational diabetes at 24 to 28 weeks, when placental hormones raise insulin resistance; untreated GDM increases risks like macrosomia and neonatal hypoglycemia","It confirms her A1C of 4.5 was accurate, since a normal A1C before pregnancy rules out any form of diabetes for the rest of this pregnancy","It checks whether her lisinopril has raised her blood glucose, which ACE inhibitors commonly do once insulin resistance rises in pregnancy","It is the diagnostic test for type 1 diabetes, which most often first appears in the second trimester as the pancreas is stressed by the fetus"],a:0,
w:["Correct: human placental lactogen, cortisol, and other hormones increase insulin resistance as the placenta grows, so screening is timed for 24 to 28 weeks.","A normal prepregnancy A1C does not prevent GDM, which develops as placental hormones rise.","ACE inhibitors are a separate safety issue (contraindicated in pregnancy); they are not the reason for glucose screening.","The 50 g test is a screen for gestational diabetes, not a diagnostic test for type 1 diabetes."],
r:"Maternal hyperglycemia crosses the placenta, and the fetal pancreas responds with extra insulin, which acts as a growth hormone (macrosomia, shoulder dystocia) and causes neonatal hypoglycemia after birth. Meghan also has risk factors: age 36, Latina heritage, chronic hypertension, and a family history of diabetes.",tk:"Screen at 24 to 28 weeks: placental hormones peak in insulin resistance."},
{src:"Collaborative Activity Part 1",tp:"dm",sk:"GS",t:"sata",q:"What education should the nurse provide before Meghan's 1-hour (step 1) glucose test? Select all that apply.",
o:["No fasting is needed for this screening test","Drink the entire 50 g glucose beverage within about 5 minutes","Blood will be drawn 1 hour after you finish the drink","Stay seated and avoid eating or smoking until the blood draw","Fast for 8 to 14 hours before the test","Expect blood draws every hour for 3 hours"],a:[0,1,2,3],
w:["Correct: step 1 is a nonfasting 50 g challenge (lecture).","Correct: timing starts when the drink is finished, so it is consumed quickly.","Correct: a single 1-hour sample is compared with the site's cutoff (130, 135, or 140 mg/dL).","Correct: activity, food, and smoking alter glucose levels during the hour.","Fasting is required for the 3-hour 100 g test, not the 1-hour screen.","Three hourly draws describe the diagnostic 3-hour OGTT."],
r:"The two-step approach starts with a nonfasting 50 g, 1-hour screen. Only a positive screen leads to the fasting 100 g, 3-hour diagnostic test.",tk:"Step 1: no fasting, one draw at 1 hour."},
{src:"Collaborative Activity Part 1",tp:"dm",sk:"GS",t:"sata",q:"Meghan's 1-hour value was 140 mg/dL, so she needs the second step. What should the nurse teach about the 3-hour test? Select all that apply.",
o:["Fast overnight (8 to 14 hours) before the test","Eat your usual diet with adequate carbohydrates for several days beforehand","A fasting sample is drawn, then samples 1, 2, and 3 hours after a 100 g glucose drink","Remain seated and do not eat or smoke during the 3 hours","One value above its limit confirms gestational diabetes","Only one blood sample is drawn, 3 hours after the drink"],a:[0,1,2,3],
w:["Correct: the 100 g test is a fasting test.","Correct: restricting carbohydrates beforehand can cause a falsely abnormal result.","Correct: four timed samples are compared with thresholds (95, 180, 155, 140 mg/dL in your lecture).","Correct: activity, food, and smoking change glucose levels.","The two-step criteria require at least 2 values met or exceeded.","There are four samples: fasting, 1, 2, and 3 hours."],
r:"The screen is not a diagnosis. The fasting 100 g OGTT uses all four timed values; GDM is diagnosed when 2 or more meet or exceed their thresholds.",tk:"Step 2: fasting, 100 g, 4 draws, 2 abnormal = GDM."},
{src:"Collaborative Activity Part 1",tp:"dm",sk:"AC",t:"mc",q:"Meghan's 3-hour glucose tolerance test was 154 mg/dL. Complete the worksheet statement: Meghan potentially has ______ related to ______ serum glucose.",
o:["Gestational diabetes; elevated","Pregestational type 1 diabetes; elevated","Gestational diabetes; decreased","Hyperemesis gravidarum; decreased"],a:0,
w:["Correct (expected worksheet answer): glucose intolerance first found in pregnancy.","Her prepregnancy A1C was 4.5 and she was never diagnosed with diabetes, so this is not pregestational diabetes.","GDM involves elevated, not decreased, glucose.","She has no persistent vomiting, and the finding is a high glucose value."],
r:"Expected answer: gestational diabetes related to elevated serum glucose. Your study guide adds a caution: a single 3-hour reading without its time point does not confirm GDM, because diagnosis needs at least 2 abnormal values on the full panel.",tk:"GDM = elevated glucose first recognized in pregnancy."},
{src:"Collaborative Activity Part 1",tp:"dm",sk:"RC",t:"sata",q:"Which signs and symptoms should the nurse watch for in a client with gestational diabetes? Select all that apply.",
o:["Polyuria","Polydipsia","Recurrent vaginal yeast or urinary tract infections","Fundal height larger than expected for dates","Painless bright red vaginal bleeding","Weight loss with ketonuria from vomiting"],a:[0,1,2,3],
w:["Correct: glucose spills into the urine and pulls water with it (osmotic diuresis).","Correct: thirst follows the fluid loss.","Correct: glucose in urine and vaginal secretions feeds yeast and bacteria.","Correct: fetal macrosomia or polyhydramnios (fetal polyuria) makes the uterus measure large.","Painless bright red bleeding suggests placenta previa.","Weight loss with ketonuria from vomiting describes hyperemesis gravidarum."],
r:"Many clients with GDM have no symptoms, which is why universal screening is done. When present, signs reflect hyperglycemia (polyuria, polydipsia, glycosuria, infections) and its fetal effects (large-for-dates fundal height, polyhydramnios).",tk:"GDM is often silent: screen everyone."},
{src:"Collaborative Activity Part 1",tp:"dm",sk:"GS",t:"sata",q:"Which interventions should the nurse include when planning care for Meghan's gestational diabetes? Select all that apply.",
o:["Teach self-monitoring of blood glucose, fasting and after meals","Refer for medical nutrition therapy with carbohydrates spread across meals and snacks","Encourage regular moderate exercise such as walking after meals","Give insulin as prescribed if glucose goals are not met with diet and exercise","Begin fetal surveillance such as kick counts and nonstress tests as ordered","Teach her to skip the bedtime snack to keep fasting glucose low"],a:[0,1,2,3,4],
w:["Correct: home glucose logs show whether the plan is working and guide therapy.","Correct: spreading carbohydrates prevents post-meal spikes and fasting hypoglycemia.","Correct: muscle activity increases glucose uptake without insulin and lowers post-meal values.","Correct: insulin does not cross the placenta and is the standard drug therapy when diet fails.","Correct: GDM raises the risk of placental insufficiency and stillbirth late in pregnancy.","Skipping the bedtime snack risks overnight hypoglycemia and ketosis; a bedtime snack is usually part of the plan."],
r:"GDM care first uses nutrition and activity to control glucose, adds insulin when needed, and watches the fetus because hyperglycemia affects growth and placental function.",tk:"Diet, exercise, glucose checks, insulin if needed, fetal checks."},
{src:"Collaborative Activity Part 1",tp:"dm",sk:"GS",t:"sata",q:"Patient self-care education for Meghan should include: Select all that apply.",
o:["Record glucose results and bring the log to every visit","Recognize hypoglycemia (shaky, sweaty, confused) and treat it with fast-acting carbohydrate if on insulin","Have glucose testing 4 to 12 weeks after birth and regular diabetes screening afterward","Report decreased fetal movement right away","Stop checking glucose once she feels well for a week","GDM ends at birth, so no follow-up testing is needed"],a:[0,1,2,3],
w:["Correct: logs let the provider adjust diet or insulin.","Correct: insulin therapy can cause hypoglycemia; treat with about 15 g of fast-acting carbohydrate and recheck.","Correct: GDM increases her lifelong risk of type 2 diabetes.","Correct: decreased movement may signal fetal compromise.","GDM usually has no symptoms, so feeling well does not mean glucose is controlled.","GDM often resolves after birth, but the risk of type 2 diabetes later is increased, so follow-up is required."],
r:"Self-care centers on monitoring, safety with insulin, fetal awareness, and long-term follow-up, because the insulin resistance of pregnancy unmasks a tendency toward type 2 diabetes.",tk:"After GDM: retest postpartum and keep screening."},
{src:"Collaborative Activity Part 2",tp:"previa",sk:"GS",t:"mc",q:"Meghan, 34 weeks, is diagnosed with placenta previa. Bleeding has slowed and the fetal heart rate is reassuring. What is the recommended treatment?",
o:["Expectant management: activity restriction, no vaginal exams, close monitoring, and planned cesarean birth","Oxytocin induction now, since 34 weeks is close enough to term for a vaginal birth","Amniotomy to lower the presenting part and press on the placenta","Discharge with tampons for any spotting and routine prenatal visits"],a:0,
w:["Correct: when bleeding settles and mother and fetus are stable, care buys time for fetal maturity; previa requires cesarean birth because the placenta covers or is near the os.","Labor would dilate the cervix under the placenta and cause hemorrhage.","Amniotomy requires a vaginal procedure and could tear the placenta.","Nothing goes in the vagina with previa, and bleeding needs immediate evaluation."],
r:"Treatment depends on bleeding, gestational age, and fetal status: expectant care when stable; immediate cesarean birth for heavy bleeding or fetal compromise. Corticosteroids may be given if birth before 34 weeks is likely.",tk:"Previa: wait if stable, deliver by cesarean."},
{src:"Collaborative Activity Part 2",tp:"previa",sk:"GS",t:"sata",q:"What health-related teaching should the nurse provide to Meghan before discharge? Select all that apply.",
o:["Pelvic rest: no intercourse, tampons, or douching","Come in right away for any vaginal bleeding","Do daily fetal kick counts and report decreased movement","Limit activity and avoid heavy lifting as instructed","Light bleeding is expected, so wait for the next appointment","Walk often to encourage the baby to drop"],a:[0,1,2,3],
w:["Correct: anything in the vagina can disrupt the placenta.","Correct: bleeding can recur suddenly and heavily.","Correct: kick counts help track fetal well-being at home.","Correct: activity restriction lowers the chance of rebleeding.","Any bleeding with previa needs evaluation; waiting is unsafe.","Encouraging descent puts pressure on the placenta over the os."],
r:"Previa bleeding comes from the placenta separating as the lower segment stretches. Teaching protects the placenta (pelvic rest, limited activity) and makes sure Meghan returns immediately for bleeding, contractions, or decreased fetal movement.",tk:"Previa home care: nothing in the vagina, come in for any bleeding."},
{src:"Gestational Hypertension Worksheet",tp:"chtn",sk:"AC",t:"mc",q:"Lila, 19, G1 P0 at 32 weeks, was just diagnosed with gestational hypertension. She asks, \"What did the doctor see that made him know I had this problem, and did I do something to cause it?\" Which response is most accurate?",
o:["\"Your blood pressure was 140/90 or higher on two checks at least 4 hours apart after 20 weeks, without protein in your urine. It is linked to how the placenta's blood vessels formed, not to anything you did.\"","\"Your urine showed protein and your hands and face are swollen. This happens when someone eats too much salt and fast food during pregnancy, so cutting salt out completely will make it go away.\"","\"Your blood pressure was high one time at today's visit. Gaining 40 pounds is what caused it, so eating less for the rest of the pregnancy will bring your pressure back to normal.\"","\"You must have had high blood pressure before you were pregnant that nobody caught. It runs in families, so it was always going to show up and there was nothing anyone could do.\""],a:0,
w:["Correct: this is the definition of gestational hypertension, explained simply. First pregnancy and young maternal age are risk factors she did not control.","Protein in the urine would point to preeclampsia, and salt intake does not cause hypertensive disorders of pregnancy.","One reading is not enough to diagnose, and weight gain does not cause gestational hypertension.","High BP before 20 weeks or before pregnancy is chronic hypertension, not gestational hypertension."],
r:"Gestational hypertension is new BP of 140/90 or higher on two occasions at least 4 hours apart after 20 weeks, without proteinuria or organ dysfunction. The cause relates to abnormal placentation and endothelial dysfunction. Answer in plain language and remove blame: being a first-time mother and a teen are risk factors, not choices. (No answer key was supplied for this worksheet.)",tk:"GHTN = new BP ≥140/90 ×2 after 20 weeks, no protein."},
{src:"Gestational Hypertension Worksheet",tp:"chtn",sk:"GS",t:"sata",q:"Lila asks, \"What can I do to make sure my baby will be OK? Is there a pill I can take?\" Which responses should the nurse include? Select all that apply.",
o:["\"Check your blood pressure at home the way we showed you and write it down.\"","\"Keep every prenatal appointment so we can check your blood pressure, urine, and the baby.\"","\"Call right away for a bad headache, vision changes, pain under your right ribs, or the baby moving less.\"","\"If your provider prescribes a blood pressure medicine that is safe in pregnancy, take it exactly as directed.\"","\"Start taking your mom's lisinopril so your pressure stays down.\"","\"There is a pill that cures this, so once you take it you will not need more checkups.\""],a:[0,1,2,3],
