w:["Correct: home monitoring catches rising BP early (sit, same arm, arm supported at heart level).","Correct: frequent visits watch for progression to preeclampsia.","Correct: these warning signs suggest severe features and need immediate evaluation.","Correct: pregnancy-safe options include methyldopa, labetalol, and nifedipine, if her provider decides she needs one.","Lisinopril is an ACE inhibitor and is contraindicated in pregnancy; she should never take someone else's medicine.","No pill cures gestational hypertension; delivery ends it, and close monitoring continues until then."],
r:"There is no cure except birth. The plan is monitoring, recognizing warning signs, and safe medication if BP rises. Teaching should be simple and concrete for a frightened teen.",tk:"No pill cures it: monitor, report warning signs, safe meds only."},
{src:"Gestational Hypertension Worksheet",tp:"chtn",sk:"GS",t:"mc",q:"Lila says, \"My mom says I don't eat right. Is that the problem? What should I eat? Did I gain too much weight? I've gained 40 pounds.\" Which response is best?",
o:["\"Your diet did not cause this. Eat balanced meals with enough protein and water. Forty pounds is above the usual 25 to 35, so we'll review it, and tell us about any sudden fast gain.\"","\"Yes, your mom is right that poor eating caused your high blood pressure. You need to cut out all salt, skip snacks, and diet to lose some of that weight before the baby comes so your pressure drops.\"","\"What you eat makes no difference at this point in pregnancy, so it is too late to change anything; just eat whatever you feel like and we will focus on medicine instead.\"","\"Forty pounds is the right amount for every pregnancy no matter your starting weight, so your mom's doctor was being too strict with her and you have nothing to worry about.\""],a:0,
w:["Correct: removes blame, gives practical nutrition teaching (your PIH map lists a high-protein diet with adequate water), and addresses weight honestly, including rapid gain as a warning sign (over 5 lb in a week on your PIH map).","Diet did not cause her hypertension, and dieting to lose weight in pregnancy is unsafe.","Good nutrition still supports the baby's growth and her health; it is not too late.","Recommended gain depends on prepregnancy BMI; 40 pounds is above the usual range for a normal BMI."],
r:"Hypertensive disorders arise from placental and vascular changes, not poor eating. Nutrition still matters: protein, fluids, iron, and folic acid support fetal growth. Total gain guidance varies by BMI (25 to 35 lb for a normal BMI is a supplemental guideline value). A sudden gain of more than 5 lb in a week suggests fluid retention and should be reported.",tk:"Diet didn't cause it; rapid weight gain is a warning sign."},
{src:"Gestational Hypertension Worksheet",tp:"chtn",sk:"AC",t:"mc",q:"Lila asks, \"Does this change anything about having a normal (vaginal) delivery?\" Which response is most accurate?",
o:["\"Many people with gestational hypertension still have a vaginal birth. Your provider may plan to deliver a little early, and a cesarean is done only if there is a medical reason.\"","\"Gestational hypertension always requires a cesarean birth, because pushing during labor raises your blood pressure too high.\"","\"Nothing changes at all; you will simply wait until labor starts on its own, even if you go a week or two past your due date.\"","\"You must deliver today, because gestational hypertension means the baby is in danger right now and cannot stay inside safely.\""],a:0,
w:["Correct: gestational hypertension alone is not a reason for cesarean birth; birth is often planned around 37 weeks if it stays without severe features (supplemental guideline).","Mode of birth depends on obstetric factors, not the diagnosis alone.","Going past the due date is not recommended because the disorder can progress to preeclampsia.","Immediate delivery is for severe features, eclampsia, or fetal compromise, not stable gestational hypertension at 32 weeks."],
r:"Delivery is the cure, so timing balances fetal maturity against maternal risk. Without severe features, the pregnancy is monitored closely and delivered near term; worsening disease moves delivery earlier. (No answer key was supplied; timing detail is supplemental.)",tk:"GHTN: vaginal birth is often possible; timing is planned."},
{src:"Gestational Hypertension Worksheet",tp:"chtn",sk:"GS",t:"sata",q:"Lila asks, \"How will the doctor make sure my baby is OK until I deliver?\" Which monitoring methods should the nurse describe? Select all that apply.",
o:["Daily fetal kick counts at home","Nonstress tests (and biophysical profiles) once or twice a week","Ultrasounds to check the baby's growth and amniotic fluid","Blood and urine tests to watch for signs of preeclampsia","Contraction stress tests at every visit","Amniocentesis every month to check the baby's lungs"],a:[0,1,2,3],
w:["Correct: decreased movement can be an early sign of placental insufficiency.","Correct: your PIH map lists NSTs weekly or twice a week.","Correct: reduced placental blood flow can slow growth and lower fluid volume.","Correct: platelets, liver enzymes, creatinine, and urine protein detect progression.","CSTs are not routine and induce contractions; NSTs and BPPs are the usual surveillance.","Amniocentesis is invasive and is not routine monitoring for gestational hypertension."],
r:"Vasospasm can reduce placental perfusion, so surveillance tracks fetal oxygenation (kick counts, NST, BPP), growth and fluid (ultrasound), and maternal progression (labs, BP).",tk:"GHTN surveillance: kicks, NST/BPP, growth ultrasound, labs."}
);

<script>
(function(){

var TOP = {

};
var SK = {

};
var TYPEN = {mc:"Multiple choice", sata:"Select all that apply", matrix:"Matrix / grid", order:"Prioritization (ordered)", bt:"Bow-tie"};
var L = "ABCDEFGHIJKLMNOP";
var HAUNT = document.documentElement.getAttribute("data-skin") === "haunted";
function icon(n){ return HAUNT ? '<svg class="i" aria-hidden="true"><use href="#g-' + n + '"/></svg>' : ""; }
var GRP = [["Prenatal Parlor","Prenatal care & assessment","moon",["adapt","signs","gtpal","nutr"]],["Testing Tower","Antenatal testing","lantern",["kick","efm","inv"]],["Potion Cellar","Diabetes, hypertension & hyperemesis","potion",["dm","chtn","he"]],["Hypertension Hollow","Hypertensive disorders of pregnancy","web",["pre","ecl","hellp"]],["Early Bleeding Crypt","Early pregnancy bleeding & loss","grave",["ci","sab","ecto"]],["Placenta Catacombs","Late pregnancy bleeding","door",["previa","abrupt"]]];

QS.forEach(function(q, i){ q.id = "q" + i; });
var QB = {}; QS.forEach(function(q){ QB[q.id] = q; });

var S = {sess:null, hist:[], view:"home", setup:{mode:"study", len:"all", timer:true, topics:{}}};

S.map = false;

var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function range(n){ var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function now(){ return Date.now(); }
function toast(t){ var e = $("#toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function(){ e.classList.remove("show"); }, 2200); }
function inA(a, v){ return a.indexOf(v) > -1; }

/* ---------- session building ---------- */
function units(){
  var out = [], seen = {};
  QS.forEach(function(q){ if (q.case) { if (!seen[q.case]) { seen[q.case] = []; out.push(seen[q.case]); } seen[q.case].push(q); } else out.push([q]); });
  return out;
}
function makePerm(q){
  if (q.t === "mc" || q.t === "sata") return shuffle(range(q.o.length));
  if (q.t === "matrix") return shuffle(range(q.o.length));
  if (q.t === "order") { var p; do { p = shuffle(range(q.o.length)); } while (p.every(function(x, i){ return x === i; })); return p; }
  if (q.t === "bt") return {c:shuffle(range(q.c.length)), ac:shuffle(range(q.ac.length)), pm:shuffle(range(q.pm.length))};
}
function start(list, mode, label){
  var perm = {}; list.forEach(function(id){ perm[id] = makePerm(QB[id]); });
  var lim = mode === "exam" && S.setup.timer ? Math.round(list.length * 90) : 0;
  S.sess = {mode:mode, order:list, perm:perm, ans:{}, done:{}, flag:{}, i:0, start:now(), limit:lim, submitted:false, label:label || ""};
  S.view = "q"; S.confirm = false; save(); render(); window.scrollTo(0, 0);
}
function buildExam(){
  var sel = Object.keys(S.setup.topics).filter(function(t){ return S.setup.topics[t]; });
  var us = units().filter(function(u){ return (!sel.length || u.some(function(q){ return inA(sel, q.tp); })) && (!S.setup.cls || u.some(function(q){ return q.src; })); });
  us = shuffle(us);
  var n = S.setup.len === "all" ? 9999 : +S.setup.len, list = [];
  for (var i = 0; i < us.length && list.length < n; i++) us[i].forEach(function(q){ list.push(q.id); });
  if (!list.length) { toast("No questions match those topics"); return; }
  start(list, S.setup.mode, (sel.length ? "Focused: " + sel.map(function(t){ return TOP[t][0]; }).join(", ") : "Comprehensive"));
}

/* ---------- grading ---------- */
function blank(q){ if (q.t === "sata") return []; if (q.t === "matrix") return q.o.map(function(){ return -1; }); if (q.t === "order") return null; if (q.t === "bt") return {c:-1, ac:[], pm:[]}; return null; }
function cur(id){ var q = QB[id], a = S.sess.ans[id]; if (a != null) return a; if (q.t === "order") return S.sess.perm[id].slice(); return blank(q); }
function isAnswered(id){ var q = QB[id], a = S.sess.ans[id]; if (a == null) return false;
  if (q.t === "mc") return true; if (q.t === "sata") return a.length > 0; if (q.t === "matrix") return a.every(function(x){ return x > -1; });
  if (q.t === "order") return true; if (q.t === "bt") return a.c > -1 && a.ac.length === 2 && a.pm.length === 2; return false; }
function grade(q, a){
  var i, pts = 0, max = 1;
  if (q.t === "mc") { pts = a === q.a ? 1 : 0; }
  else if (q.t === "sata") { max = q.a.length; a = a || []; var g = a.filter(function(x){ return inA(q.a, x); }).length; pts = Math.max(0, g - (a.length - g)); }
  else if (q.t === "matrix") { max = q.o.length; for (i = 0; i < max; i++) if (a && a[i] === q.a[i]) pts++; }
  else if (q.t === "order") { max = q.o.length; for (i = 0; i < max; i++) if (a && a[i] === i) pts++; }
  else if (q.t === "bt") { max = 5; if (a) { if (a.c === q.ca) pts++; a.ac.forEach(function(x){ if (inA(q.aa, x)) pts++; }); a.pm.forEach(function(x){ if (inA(q.pa, x)) pts++; }); } }
  return {pts:pts, max:max, ok:pts === max};
}
function resultFor(id){ var q = QB[id]; return isAnswered(id) ? grade(q, S.sess.ans[id]) : {pts:0, max:grade(q, blank(q)).max, ok:false, blank:true}; }

/* ---------- question rendering ---------- */
function caseBox(q, idx){
  if (!q.case) return "";
  var c = CASES[q.case], prev = [];
  for (var j = 0; j < idx; j++) { var p = QB[S.sess.order[j]]; if (p.case === q.case && p.info && p.info !== q.info) prev.push(p.info); }
  var uniq = prev.filter(function(x, i){ return prev.indexOf(x) === i; });
  return '<div class="case"><div class="ct">' + esc(c.title) + '</div><div>' + c.bg + '</div>' + uniq.map(function(x){ return '<div class="ci hint">' + x + '</div>'; }).join("") + (q.info ? '<div class="ci">' + q.info + '</div>' : '') + '</div>';
}
function qBody(id, reveal){
  var q = QB[id], a = cur(id), pm = S.sess.perm[id], dis = reveal ? " disabled" : "", h = "";
  if (q.t === "mc" || q.t === "sata") {
    var sel = q.t === "mc" ? (a == null ? [] : [a]) : a, okA = q.t === "mc" ? [q.a] : q.a;
    if (q.t === "sata") h += '<div class="hint">Select every option that applies.</div>';
    h += pm.map(function(oi, i){ var on = inA(sel, oi), cls = "opt" + (q.t === "sata" ? " sq" : "");
      if (reveal) { if (inA(okA, oi)) cls += on ? " ok" : " miss"; else if (on) cls += " no"; } else if (on) cls += " sel";
      return '<button class="' + cls + '" data-o="' + oi + '"' + dis + ' aria-pressed="' + on + '"><span class="k">' + (q.t === "sata" ? (on ? "✓" : "") : L[i]) + '</span><span>' + q.o[oi] + '</span></button>'; }).join("");
  } else if (q.t === "matrix") {
    h += '<div class="tw mx"><table><thead><tr><th>Finding</th>' + q.c.map(function(c){ return '<th>' + c + '</th>'; }).join("") + '</tr></thead><tbody>' +
      pm.map(function(ri){ return '<tr><td>' + q.o[ri] + '</td>' + q.c.map(function(c, ci){ var on = a[ri] === ci, cls = "rb";
        if (reveal) { if (q.a[ri] === ci) cls += on ? " ok" : " miss"; else if (on) cls += " no"; } else if (on) cls += " sel";
        return '<td><button class="' + cls + '" data-r="' + ri + '" data-c="' + ci + '"' + dis + ' aria-label="' + esc(q.o[ri].replace(/<[^>]+>/g, "")) + ': ' + esc(c) + '" aria-pressed="' + on + '"></button></td>'; }).join("") + '</tr>'; }).join("") + '</tbody></table></div>';
  } else if (q.t === "order") {
    h += '<div class="hint">Arrange from first (top) to last using the arrows.</div><ol class="ordl">' + a.map(function(oi, i){ var cls = reveal ? (oi === i ? "ok" : "no") : "";
      return '<li class="' + cls + '"><span class="n">' + (i + 1) + '</span><span class="t">' + q.o[oi] + '</span>' + (reveal ? '' : '<button class="mv" data-mv="' + i + '" data-d="-1"' + (i === 0 ? " disabled" : "") + ' aria-label="Move up">▲</button><button class="mv" data-mv="' + i + '" data-d="1"' + (i === a.length - 1 ? " disabled" : "") + ' aria-label="Move down">▼</button>') + '</li>'; }).join("") + '</ol>' +
      (!reveal && S.sess.ans[id] == null ? '<div class="row"><button class="btn" data-keep="1">Keep this order</button><span class="hint">Moving any item also saves your order.</span></div>' : '');
  } else if (q.t === "bt") {
    var col = function(key, opts, perm, ok, multi, title){
      var chosen = multi ? a[key] : (a.c > -1 ? [a.c] : []), okA = multi ? ok : [ok];
      return '<div class="col"><h4>' + title + '</h4>' + perm.map(function(oi){ var on = inA(chosen, oi), cls = "opt sq";
        if (reveal) { if (inA(okA, oi)) cls += on ? " ok" : " miss"; else if (on) cls += " no"; } else if (on) cls += " sel";
        return '<button class="' + cls + '" data-bt="' + key + '" data-o="' + oi + '"' + dis + '><span class="k">' + (on ? "✓" : "") + '</span><span>' + opts[oi] + '</span></button>'; }).join("") + '</div>'; };
    h += '<div class="hint">Choose 1 condition, the 2 most important actions, and the 2 parameters to monitor.</div><div class="bt">' +
      col("ac", q.ac, pm.ac, q.aa, true, "Actions to take (2)") + col("c", q.c, pm.c, q.ca, false, "Condition most likely (1)") + col("pm", q.pm, pm.pm, q.pa, true, "Parameters to monitor (2)") + '</div>';
  }
  return h;
}
function feedback(id){
  var q = QB[id], r = resultFor(id), cls = r.ok ? "ok" : (r.pts > 0 ? "pt" : "no"), h = '<div class="fb ' + cls + '"><div class="v">' + (r.ok ? "Correct" : r.blank ? "Not answered" : r.pts > 0 ? "Partially correct" : "Incorrect") + (r.max > 1 ? ' · ' + r.pts + ' / ' + r.max + ' points' : '') + '</div>';
  var okA = q.t === "mc" ? [q.a] : q.a;
  if (q.t === "mc" || q.t === "sata") {
    if (!q.w) h += '<div class="fl2">Correct answer' + (q.t === "sata" ? "s" : "") + '</div><ul class="why">' + okA.map(function(i){ return '<li class="y">' + q.o[i] + '</li>'; }).join("") + '</ul>';
    else h += '<div class="fl2">Why each option is right or wrong</div><ul class="why">' + okA.concat(q.o.map(function(o, i){ return i; }).filter(function(i){ return !inA(okA, i); })).map(function(i){ var o = q.o[i]; return '<li class="' + (inA(okA, i) ? "y" : "n") + '"><b>' + o + (/[.?!"”)]$/.test(o) ? '' : '.') + '</b> ' + q.w[i] + '</li>'; }).join("") + '</ul>';
  } else if (q.t === "matrix") {
    h += '<div class="fl2">Correct grid</div><ul class="why">' + q.o.map(function(o, i){ var mine = S.sess.ans[id], ok = mine && mine[i] === q.a[i]; return '<li class="' + (ok ? "y" : "n") + '">' + o + ' → <b>' + q.c[q.a[i]] + '</b>' + (!ok && mine && mine[i] > -1 ? ' <span class="hint">(you chose ' + q.c[mine[i]] + ')</span>' : '') + '</li>'; }).join("") + '</ul>';
  } else if (q.t === "order") {
    h += '<div class="fl2">Correct order</div><ol>' + q.o.map(function(o){ return '<li>' + o + '</li>'; }).join("") + '</ol>';
  } else if (q.t === "bt") {
    h += '<div class="fl2">Correct bow-tie</div><ul class="why"><li class="y"><b>Condition:</b> ' + q.c[q.ca] + '</li><li class="y"><b>Actions:</b> ' + q.aa.map(function(i){ return q.ac[i]; }).join("; ") + '</li><li class="y"><b>Monitor:</b> ' + q.pa.map(function(i){ return q.pm[i]; }).join("; ") + '</li></ul>' +
      '<div class="fl2">Why the other choices are wrong</div><ul class="why">' + q.c.map(function(o, i){ return i === q.ca ? "" : '<li class="n">' + o + ' does not fit this cluster of cues.</li>'; }).join("") + q.ac.map(function(o, i){ return inA(q.aa, i) ? "" : '<li class="n">' + o + ': not a priority action here, or unsafe for this condition.</li>'; }).join("") + q.pm.map(function(o, i){ return inA(q.pa, i) ? "" : '<li class="n">' + o + ': does not track this condition’s response to treatment.</li>'; }).join("") + '</ul>';
  }
  h += '<div class="fl2">Rationale, pathophysiology & nursing reasoning</div><div>' + q.r + '</div>';
  h += '<div class="row" style="margin-top:12px"><span class="fl2" style="margin:0">NGN clinical judgment step</span><span class="tag">' + SK[q.sk][0] + '</span><span class="tag t2">' + TOP[q.tp][0] + '</span></div>';
  h += '<div class="strat"><div class="fl2">NGN test strategy</div><div>' + SK[q.sk][1] + '</div></div>';
  if (q.tk) h += '<div class="take"><div class="fl2">High-yield pearl</div><div>' + q.tk + '</div></div>';
  return h + '</div>';
}
function qView(){
  var s = S.sess, id = s.order[s.i], q = QB[id], reveal = s.submitted || (s.mode === "study" && s.done[id]);
  var h = '<section class="card qcard fade"><div class="qmeta"><span class="zone-tag">' + icon(ZI[q.tp] || "moon") + esc(reveal ? TOP[q.tp][0] : SEC[q.tp]) + '</span><span class="tag t2">' + TYPEN[q.t] + '</span>' + (q.src ? '<span class="tag t3">📘 ' + esc(q.src) + '</span>' : '') + (s.flag[id] ? '<span class="tag fl">⚑ Flagged</span>' : '') + '<span class="qnum">' + (s.i + 1) + ' / ' + s.order.length + '</span></div>' +
    caseBox(q, s.i) + '<div class="qq">' + q.q + '</div>' + qBody(id, reveal) + (reveal ? feedback(id) : '');
  var last = s.i === s.order.length - 1;
  h += '<div class="row between" style="margin-top:16px"><div class="row" style="margin:0"><button class="btn" data-nav="-1"' + (s.i === 0 ? " disabled" : "") + '>← Previous</button>' + (!s.submitted ? '<button class="btn" data-flag="1">' + (s.flag[id] ? "Unflag" : "⚑ Flag") + '</button>' : '') + '</div><div class="row" style="margin:0">';
  if (s.submitted) h += last ? '<button class="btn pri" data-go="results">Back to results</button>' : '<button class="btn pri" data-nav="1">Next →</button>';
  else if (s.mode === "study") h += !s.done[id] ? '<button class="btn pk" data-check="1">Check answer</button>' : (last ? '<button class="btn pri" data-finish="1">See my results</button>' : '<button class="btn pri" data-nav="1">Next question →</button>');
  else h += last ? '<button class="btn pk" data-go="review">Review & submit</button>' : '<button class="btn pri" data-nav="1">Next →</button>';
  return h + '</div></div></section>';
}
function navCard(){
  var s = S.sess, f = S.mapF || "all", rev = s.submitted || s.mode === "study";
  var cells = s.order.map(function(id, i){
    if (f === "flag" && !s.flag[id]) return ""; if (f === "open" && (rev ? (s.submitted || s.done[id]) : isAnswered(id))) return "";
    var cls = "nb"; if (s.submitted || (s.mode === "study" && s.done[id])) { var r = resultFor(id); cls += r.ok ? " rok" : r.pts > 0 ? " rpt" : " rno"; } else if (isAnswered(id)) cls += " ans";
    if (i === s.i) cls += " cur"; if (s.flag[id]) cls += " flag";
    return '<button class="' + cls + '" data-jump="' + i + '" aria-label="Question ' + (i + 1) + '">' + (i + 1) + '</button>'; }).join("");
  return '<div class="dpanel" role="dialog" aria-label="Question map"><div class="row between" style="margin:0"><h3 style="margin:0">' + icon("map") + 'Question map</h3><button class="btn sm" data-map="0">Close</button></div>' +
    '<div class="seg" style="margin-top:12px">' + [["all","All"],["flag","Flagged"],["open", rev ? "Unchecked" : "Unanswered"]].map(function(x){ return '<button aria-pressed="' + (f === x[0]) + '" data-mapf="' + x[0] + '">' + x[1] + '</button>'; }).join("") + '</div>' +
    '<div class="navgrid" style="margin-top:12px">' + (cells || '<p class="hint" style="grid-column:1/-1">Nothing here.</p>') + '</div>' +
    '<div class="legend">' + (rev ? '<span><i style="background:var(--teal-bg);border-color:var(--teal)"></i>Correct</span><span><i style="background:var(--amber-bg);border-color:var(--amber)"></i>Partial</span><span><i style="background:var(--rose-bg);border-color:var(--rose)"></i>Missed</span>' : '<span><i style="background:var(--soft2);border-color:var(--plum2)"></i>Answered</span><span><i></i>Open</span>') + '<span><i style="background:var(--amber);border-radius:50%"></i>Flagged</span></div>' +
    (s.submitted ? '<div style="margin-top:16px"><button class="btn pri" style="width:100%" data-go="results">Back to results</button></div>' : s.mode === "exam" ? '<div style="margin-top:16px"><button class="btn pk" style="width:100%" data-go="review">' + icon("key") + 'Review &amp; submit</button></div>' : '<div style="margin-top:16px"><button class="btn pk" style="width:100%" data-finish="1">' + icon("key") + 'End session &amp; see results</button></div>') + '</div>';
}
function drawer(){ var d = document.getElementById("drawer"); if (S.map && S.sess && (S.view === "q" || S.view === "review")) { d.innerHTML = navCard(); d.hidden = false; } else { d.hidden = true; d.innerHTML = ""; } }
function reviewView(){
  var s = S.sess, un = s.order.filter(function(id){ return !isAnswered(id); }), fl = s.order.filter(function(id){ return s.flag[id]; });
  return '<section class="card"><div class="kick">Before you submit</div><h2>Review your exam</h2><div class="stats"><div class="stat"><b>' + (s.order.length - un.length) + '</b><span>answered</span></div><div class="stat"><b>' + un.length + '</b><span>unanswered</span></div><div class="stat"><b>' + fl.length + '</b><span>flagged</span></div></div>' +
    (un.length ? '<p><b>Unanswered:</b></p><div class="row">' + un.map(function(id){ var i = s.order.indexOf(id); return '<button class="btn" data-jump="' + i + '">Q' + (i + 1) + '</button>'; }).join("") + '</div>' : '<p class="sub">Every question has an answer.</p>') +
    (fl.length ? '<p><b>Flagged for review:</b></p><div class="row">' + fl.map(function(id){ var i = s.order.indexOf(id); return '<button class="btn" data-jump="' + i + '">Q' + (i + 1) + '</button>'; }).join("") + '</div>' : '') +
    '<div class="row" style="margin-top:18px"><button class="btn" data-jump="' + s.i + '">← Back to questions</button><button class="btn pk" data-submit="1">' + (S.confirm ? "Tap again to submit" + (un.length ? " with " + un.length + " unanswered" : "") : "Submit exam") + '</button></div></section>';
}

/* ---------- results ---------- */
function agg(){
  var s = S.sess, out = {pts:0, max:0, ok:0, n:s.order.length, tp:{}, sk:{}, ty:{}, miss:[]};
  s.order.forEach(function(id, i){ var q = QB[id], r = resultFor(id); out.pts += r.pts; out.max += r.max; if (r.ok) out.ok++; else out.miss.push(i);
    [["tp", q.tp], ["sk", q.sk], ["ty", q.t]].forEach(function(p){ var b = out[p[0]][p[1]] = out[p[0]][p[1]] || {pts:0, max:0, n:0, ok:0}; b.pts += r.pts; b.max += r.max; b.n++; if (r.ok) b.ok++; }); });
  return out;
}
function bar(label, b){ var p = b.max ? Math.round(b.pts / b.max * 100) : 0, c = p >= 80 ? "var(--teal)" : p >= 65 ? "var(--amber)" : "var(--rose)";
  return '<div class="brow"><span>' + label + ' <span class="hint">(' + b.ok + '/' + b.n + ' fully correct)</span></span><span class="track"><i style="width:' + p + '%;background:' + c + '"></i></span><span class="pct">' + p + '%</span></div>'; }
function resultsView(){
  var s = S.sess, A = agg(), pct = A.max ? Math.round(A.pts / A.max * 100) : 0, mins = Math.max(1, Math.round(((s.end || now()) - s.start) / 60000));
  var tps = Object.keys(A.tp).sort(function(x, y){ return A.tp[x].pts / A.tp[x].max - A.tp[y].pts / A.tp[y].max; });
  var weakT = tps.filter(function(t){ return A.tp[t].pts / A.tp[t].max < .75; }), sks = Object.keys(A.sk).sort(function(x, y){ return A.sk[x].pts / A.sk[x].max - A.sk[y].pts / A.sk[y].max; });
  var weakS = sks.filter(function(k){ return A.sk[k].pts / A.sk[k].max < .75; });
  var msg = pct >= 85 ? "Exam-ready range. Polish the few misses below." : pct >= 75 ? "Solid. Target the weaker topics before exam day." : pct >= 65 ? "Close. Your weak topics below are where the points are." : "This shows you exactly where to study next. Start with the first recommendation.";
  var h = '<section class="card"><div class="kick">' + esc(s.label) + ' · ' + (s.mode === "study" ? "Study mode" : "Exam mode") + '</div><h2>Your results</h2><div class="row" style="align-items:flex-end;gap:16px"><div class="big">' + pct + '%</div><p class="sub" style="max-width:46ch">' + msg + '</p></div>' +
    '<div class="stats"><div class="stat"><b>' + A.ok + ' / ' + A.n + '</b><span>fully correct</span></div><div class="stat"><b>' + A.pts + ' / ' + A.max + '</b><span>NGN points earned</span></div><div class="stat"><b>' + A.miss.length + '</b><span>to review</span></div><div class="stat"><b>' + mins + ' min</b><span>time used</span></div></div>' +
    '<div class="row"><button class="btn pri" data-reviewall="1">Review every question</button>' + (A.miss.length ? '<button class="btn pk" data-retakemiss="1">Retake missed (' + A.miss.length + ')</button>' : '') + '<button class="btn" data-retake="1">Retake reshuffled</button><button class="btn" data-go="home">New exam</button></div></section>';
  h += '<section class="card"><h3>Performance by topic</h3><p class="hint">Points earned out of points possible (SATA, matrix, ordered, and bow-tie items give partial credit).</p>' + tps.map(function(t){ return bar(TOP[t][0], A.tp[t]); }).join("") + '</section>';
  h += '<section class="card"><h3>Clinical judgment (NCJMM) skills</h3>' + ["RC","AC","PH","GS","TA","EO"].filter(function(k){ return A.sk[k]; }).map(function(k){ return bar(SK[k][0], A.sk[k]); }).join("") + '<h3 style="margin-top:14px;font-size:1rem">By item type</h3>' + Object.keys(A.ty).map(function(t){ return bar(TYPEN[t], A.ty[t]); }).join("") + '</section>';
  h += '<section class="card"><h3>Targeted study recommendations</h3>' + (weakT.length || weakS.length ? '<ol class="recs">' + weakT.map(function(t){ return '<li><b>' + TOP[t][0] + ' (' + Math.round(A.tp[t].pts / A.tp[t].max * 100) + '%).</b> ' + TOP[t][1] + '</li>'; }).join("") + weakS.map(function(k){ return '<li><b>Clinical judgment: ' + SK[k][0] + ' (' + Math.round(A.sk[k].pts / A.sk[k].max * 100) + '%).</b> ' + SK[k][1] + '</li>'; }).join("") + '</ol>' : '<p class="sub">Every topic and skill is at 75% or higher. Retake reshuffled in exam mode to confirm under time pressure.</p>') + '</section>';
  h += '<section class="card"><h3>Missed-question review</h3>' + (A.miss.length ? '<p class="hint">Tap a question to open its full rationale.</p>' + A.miss.map(function(i){ var id = s.order[i], q = QB[id], r = resultFor(id);
      return '<details class="rv"><summary><span class="tag ' + (r.pts > 0 ? "fl" : "") + '">Q' + (i + 1) + '</span><span>' + q.q.replace(/<[^>]+>/g, "").slice(0, 150) + (q.q.length > 150 ? "…" : "") + ' <span class="hint">· ' + TOP[q.tp][0] + ' · ' + SK[q.sk][0] + '</span></span></summary><div class="rvb">' + caseBox(q, i) + '<div class="qq">' + q.q + '</div>' + qBody(id, true) + feedback(id) + '</div></details>'; }).join("") : '<p class="sub">Nothing missed. Impressive.</p>') + '</section>';
  if (S.hist.length > 1) h += '<section class="card"><h3>Previous attempts</h3><div class="tw"><table><thead><tr><th>Date</th><th>Mode</th><th>Questions</th><th>Score</th></tr></thead><tbody>' + S.hist.slice(-10).reverse().map(function(x){ return '<tr><td>' + new Date(x.d).toLocaleString() + '</td><td>' + x.m + '</td><td>' + x.n + '</td><td>' + x.p + '%</td></tr>'; }).join("") + '</tbody></table></div></section>';
  return h;
}

/* ---------- home ---------- */
function homeView(){
  var st = S.setup, counts = {}; QS.forEach(function(q){ counts[q.tp] = (counts[q.tp] || 0) + 1; });
  var tc = {}; QS.forEach(function(q){ tc[q.t] = (tc[q.t] || 0) + 1; });
  var h = '<section class="card hero fade">' + (HAUNT ? '<svg class="ghost-hero" aria-hidden="true"><use href="#g-ghost"/></svg>' : '') + '<div class="kick">' + (HAUNT ? 'Haunted entrance · ' : '') + 'HCC3 · Exam 3 · Module 7</div><h1>' + (HAUNT ? 'The <span>Haunted</span> High-Risk Pregnancy Exam' : 'High-Risk Pregnancy <span>Mock Exam</span>') + '</h1><p class="sub">' + QS.length + ' NCLEX/NGN questions (' + QS.filter(function(q){ return q.src; }).length + ' from your class activities) built from your Exam 3 learning map, lecture slides, PAINT and PIH maps, worksheets, and class cases. Question order, case order, answer choices, matrix rows, and bow-tie options reshuffle on every attempt; unfolding cases stay in sequence.</p>' +
    '<div class="row">' + Object.keys(tc).map(function(t){ return '<span class="tag t2">' + tc[t] + ' ' + TYPEN[t] + '</span>'; }).join("") + '<span class="tag t3">' + Object.keys(CASES).length + ' unfolding cases</span></div>' +
    '<div class="zones">' + GRP.map(function(g){ var n = QS.filter(function(q){ return inA(g[3], q.tp); }).length; return '<div class="zone">' + icon(g[2]) + '<b>' + (HAUNT ? g[0] : g[1]) + '</b><small>' + (HAUNT ? g[1] + ' · ' : '') + n + ' questions</small></div>'; }).join("") + '</div></section>';
  if (S.sess && !S.sess.submitted) h += '<section class="card"><h3>Continue where you left off</h3><p class="sub">' + esc(S.sess.label) + ' · ' + (S.sess.mode === "study" ? "Study" : "Exam") + ' mode · question ' + (S.sess.i + 1) + ' of ' + S.sess.order.length + '</p><div class="row"><button class="btn pri" data-resume="1">Resume</button></div></section>';
  if (S.sess && S.sess.submitted) h += '<section class="card"><h3>Last results</h3><div class="row"><button class="btn" data-go="results">Open last results</button></div></section>';
  h += '<section class="card"><h3>1 · Choose a mode</h3><div class="grid2" style="margin-top:10px">' +
    '<button class="opt-card' + (st.mode === "study" ? " on" : "") + '" data-mode="study"><b>' + icon("lantern") + 'Study mode</b><span>Check each answer and read the full rationale, pathophysiology, NCJMM skill, and takeaway before moving on.</span></button>' +
    '<button class="opt-card' + (st.mode === "exam" ? " on" : "") + '" data-mode="exam"><b>' + icon("key") + 'Exam mode</b><span>Timed, with navigation, flags, and a review screen. Rationales unlock after you submit.</span></button></div>' +
    '<h3 style="margin-top:18px">2 · Length</h3><div class="row">' + [["all","All " + QS.length],["75","75 random"],["50","50 random"],["25","25 quick set"]].map(function(x){ return '<button class="chip' + (st.len === x[0] ? " on" : "") + '" data-len="' + x[0] + '">' + x[1] + '</button>'; }).join("") + '</div><p class="hint">Random sets keep each unfolding case whole, so the count can run a few questions over.</p>' +
    (st.mode === "exam" ? '<div class="row"><button class="chip' + (st.timer ? " on" : "") + '" data-timer="1">⏱ Timer ' + (st.timer ? "on (90 sec per question)" : "off") + '</button></div>' : '') +
    '<h3 style="margin-top:18px">3 · Topics <span class="hint" style="font-family:var(--font)">(leave all off for the full blueprint)</span></h3><div class="tchips" style="margin-top:8px">' + Object.keys(TOP).map(function(t){ return '<button class="chip' + (st.topics[t] ? " on" : "") + '" data-topic="' + t + '">' + TOP[t][0] + ' <span class="hint">' + (counts[t] || 0) + '</span></button>'; }).join("") + '</div>' +
    '<h3 style="margin-top:18px">4 · Source</h3><div class="row"><button class="chip' + (!st.cls ? " on" : "") + '" data-cls="0">All questions</button><button class="chip' + (st.cls ? " on" : "") + '" data-cls="1">📘 Class activity questions only <span class="hint">' + QS.filter(function(q){ return q.src; }).length + '</span></button></div><p class="hint">Class activity questions come from your Question Guide, Collaborative Activity, Terminology Activity, and Gestational Hypertension worksheet, with answers supplied.</p>' +
    '<div class="row" style="margin-top:20px;justify-content:center"><button class="btn pk big-go" data-begin="1">' + icon("door") + 'Start ' + (st.mode === "study" ? "studying" : "the exam") + ' →</button></div></section>';
  h += '<section class="card"><h3>How scoring works</h3><ul><li>Multiple choice: 1 point.</li><li>Select all that apply: +1 for each correct choice, −1 for each incorrect choice (never below 0), the NGN +/− rule.</li><li>Matrix and ordered response: 1 point per correct row or position.</li><li>Bow-tie: 5 points (1 condition, 2 actions, 2 parameters).</li></ul><p class="hint">This is a practice tool aligned to your course materials. Where your course and current guidelines differ, rationales follow your course and note the difference.</p></section>';
  return h;
}

/* ---------- top bar & render ---------- */
var timerT = null;
function remaining(){ var s = S.sess; return s.limit ? Math.max(0, s.limit - Math.floor((now() - s.start) / 1000)) : null; }
function fmt(sec){ var m = Math.floor(sec / 60), x = sec % 60; return (m >= 60 ? Math.floor(m / 60) + ":" + ("0" + (m % 60)).slice(-2) : m) + ":" + ("0" + x).slice(-2); }
function topbar(){
  var s = S.sess, inQ = (S.view === "q" || S.view === "review") && s;
  var h = '<div class="brand">' + (HAUNT ? '<svg class="i lan" aria-hidden="true"><use href="#g-lantern"/></svg>HCC3 Haunted Exam' : 'HCC3 Module 7 Mock Exam') + '</div><div class="chips">';
  if (inQ) {
    var answered = s.order.filter(function(id){ return s.mode === "study" ? s.done[id] : isAnswered(id); }).length, rem = remaining();
    var right = s.order.filter(function(id){ return s.done[id] && resultFor(id).ok; }).length;
    h += '<span class="chip mode">' + (s.submitted ? "Review" : s.mode === "study" ? "Study mode" : "Exam mode") + '</span><span class="chip">Q <b>' + (s.i + 1) + '</b> / ' + s.order.length + '</span>' +
      (s.mode === "study" && !s.submitted ? '<span class="chip"><span class="lbl">Score </span><b>' + right + '</b> / ' + answered + '<span class="lbl"> checked</span> ✓</span>' : !s.submitted ? '<span class="chip">Answered <b>' + answered + '</b></span>' : '') +
      (!s.submitted ? '<span class="chip tm' + (rem != null && rem < 300 ? " low" : "") + '" id="tmr">⏱ ' + fmt(rem != null ? rem : Math.floor((now() - s.start) / 1000)) + '</span>' : '') +
      '<button class="btn sm" data-map="1" aria-controls="drawer">' + icon("map") + '<span class="lbl">Question </span>Map</button><button class="btn sm" data-go="home">Exit</button>';
  } else if (s && s.submitted && S.view !== "results") h += '<button class="btn sm" data-go="results">Results</button>';
  if (!HAUNT) h += '<button class="btn sm" id="themeBtn" aria-label="Toggle dark mode">' + (isDark() ? '☀<span class="lbl"> Light</span>' : '☾<span class="lbl"> Dark</span>') + '</button>';
  h += '</div>';
  if (inQ) h += '<div class="pbar" aria-label="Progress"><i style="width:' + (answered / s.order.length * 100) + '%"></i></div>';
  $("#topbar").innerHTML = h;
}
function isDark(){ var t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); }
function render(keep){
  var y = window.scrollY, v = S.view;
  if ((v === "q" || v === "review" || v === "results") && !S.sess) v = S.view = "home";
  $("#app").innerHTML = v === "q" ? qView() : v === "review" ? reviewView() : v === "results" ? resultsView() : homeView();
  topbar(); drawer();
  if (keep) window.scrollTo(0, y);
}
function submit(){
  var s = S.sess; s.submitted = true; s.end = now(); S.confirm = false;
  var A = agg(); S.hist.push({d:now(), m:s.mode === "study" ? "Study" : "Exam", n:s.order.length, p:A.max ? Math.round(A.pts / A.max * 100) : 0});
  S.view = "results"; save(); render(); window.scrollTo(0, 0);
}
function tick(){
  var s = S.sess, e = document.getElementById("tmr"); if (!s || !e || s.submitted) return;
  var rem = remaining();
  if (rem != null && s.mode === "exam") { e.textContent = "⏱ " + fmt(rem); e.classList.toggle("low", rem < 300); if (rem === 0) { toast("Time is up. Your exam was submitted."); submit(); } }
  else e.textContent = "⏱ " + fmt(Math.floor((now() - s.start) / 1000));
}
timerT = setInterval(tick, 1000);

/* ---------- events ---------- */
document.addEventListener("click", function(ev){
  var t = ev.target.closest("button"); if (!t || t.disabled) return;
  var d = t.dataset, s = S.sess;
  if (t.id === "themeBtn") { var cur2 = isDark() ? "light" : "dark"; document.documentElement.setAttribute("data-theme", cur2); try { localStorage.setItem(KEY + "-theme", cur2); } catch(e) {} topbar(); return; }
  if (d.map != null) { S.map = d.map === "1"; drawer(); return; }
  if (d.mapf) { S.mapF = d.mapf; drawer(); return; }
  if (d.mode) { S.setup.mode = d.mode; save(); render(true); return; }
  if (d.len) { S.setup.len = d.len; save(); render(true); return; }
  if (d.timer) { S.setup.timer = !S.setup.timer; save(); render(true); return; }
  if (d.cls != null) { S.setup.cls = d.cls === "1"; save(); render(true); return; }
  if (d.topic) { S.setup.topics[d.topic] = !S.setup.topics[d.topic]; save(); render(true); return; }
  if (d.begin) { buildExam(); return; }
  if (d.resume) { S.view = "q"; save(); render(); return; }
  if (d.go) { S.map = false; S.view = d.go; S.confirm = false; save(); render(); window.scrollTo(0, 0); return; }
  if (d.reviewall) { s.i = 0; S.view = "q"; save(); render(); window.scrollTo(0, 0); return; }
  if (d.retake) { start(shuffle(s.order.slice()).length ? reshuffleKeepCases(s.order) : s.order, s.mode, s.label + " (retake)"); return; }
  if (d.retakemiss) { var A = agg(); start(reshuffleKeepCases(A.miss.map(function(i){ return s.order[i]; })), "study", "Missed questions"); return; }
  if (d.submit) { if (!S.confirm) { S.confirm = true; render(true); return; } submit(); return; }
  if (d.jump != null) { S.map = false; s.i = +d.jump; S.view = "q"; S.confirm = false; save(); render(); window.scrollTo(0, 0); return; }
  if (d.nav) { s.i = Math.max(0, Math.min(s.order.length - 1, s.i + (+d.nav))); save(); render(); window.scrollTo(0, 0); return; }
  if (d.flag) { var fid = s.order[s.i]; s.flag[fid] = !s.flag[fid]; save(); render(true); return; }
  if (d.finish) { S.map = false; submit(); return; }
  if (!s || S.view !== "q") return;
  var id = s.order[s.i], q = QB[id];
  if (s.submitted || (s.mode === "study" && s.done[id])) return;
  if (d.check) { if (!isAnswered(id)) { toast(q.t === "bt" ? "Pick 1 condition, 2 actions, and 2 parameters" : "Answer every part first"); return; } s.done[id] = true; save(); render(true); return; }
  if (d.o != null && !d.bt) { var oi = +d.o;
    if (q.t === "mc") s.ans[id] = oi; else { var a = (s.ans[id] || []).slice(), p = a.indexOf(oi); if (p > -1) a.splice(p, 1); else a.push(oi); a.sort(function(x, y){ return x - y; }); s.ans[id] = a; }
    save(); render(true); return; }
  if (d.r != null) { var m = cur(id).slice(); m[+d.r] = +d.c; s.ans[id] = m; save(); render(true); return; }
  if (d.mv != null) { var arr = cur(id).slice(), i = +d.mv, j = i + (+d.d); if (j >= 0 && j < arr.length) { var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp; } s.ans[id] = arr; save(); render(true); return; }
  if (d.keep) { s.ans[id] = cur(id).slice(); save(); render(true); toast("Order saved"); return; }
  if (d.bt) { var b = JSON.parse(JSON.stringify(cur(id))), v = +d.o;
    if (d.bt === "c") b.c = b.c === v ? -1 : v;
    else { var list = b[d.bt], k2 = list.indexOf(v); if (k2 > -1) list.splice(k2, 1); else { if (list.length >= 2) { toast("Choose only 2; tap one to remove it first"); return; } list.push(v); } }
    s.ans[id] = b; save(); render(true); return; }
});
function reshuffleKeepCases(ids){
  var groups = [], seen = {};
  ids.forEach(function(id){ var q = QB[id]; if (q.case) { if (!seen[q.case]) { seen[q.case] = []; groups.push(seen[q.case]); } seen[q.case].push(id); } else groups.push([id]); });
  var out = []; shuffle(groups).forEach(function(g){ out = out.concat(g); }); return out;
}
document.getElementById("drawer").addEventListener("click", function(e){ if (e.target.id === "drawer") { S.map = false; drawer(); } });
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && S.map) { S.map = false; drawer(); return; }
  if (S.view !== "q" || !S.sess || /input|select|textarea/i.test((e.target.tagName || ""))) return;
  if (e.key === "ArrowRight" && S.sess.i < S.sess.order.length - 1) { S.sess.i++; save(); render(); }
  else if (e.key === "ArrowLeft" && S.sess.i > 0) { S.sess.i--; save(); render(); }
});
(function(){ var t = null; try { t = localStorage.getItem(KEY + "-theme"); } catch(e) {} if (t) document.documentElement.setAttribute("data-theme", t); })();
render();
window.__MOCK = {S:S, QS:QS, QB:QB, grade:grade, render:render, agg:agg};
})();

</script>
