opts:[`Screen for depression and ask directly about thoughts of suicide`,`Limit discussion of the diagnosis to staff directly involved in care`,`Refer to a case manager for low-cost ART and community support`,`Teach that daily ART plus condom use lowers the chance of transmission`,`Contact the client's recent partner today so testing can start quickly`,`Explain that ART can be deferred until the client feels emotionally ready`],
ans:[0,1,2,3],
why:`The course lists confidentiality, depression and suicide-risk assessment, connecting to resources, and adherence and transmission-prevention teaching. Partner notification goes through the client or public-health partner services, and ART is started as soon as possible after diagnosis rather than deferred.`,
best:`Covers safety, privacy, resources, and adherence.`,
not:[`Correct: "my life is over" is a cue to assess suicide risk.`,`Correct: "I can't tell anyone" makes privacy a priority.`,`Correct: no insurance is a cue.`,`Correct.`,`Partner notification is done by the client or by public-health partner services with the client's involvement; the nurse calling a partner directly breaches confidentiality.`,`Current guidance is to start ART as soon as possible after diagnosis. Emotional readiness is supported with counseling and resources, not by delaying treatment, which allows disease progression and transmission.`],
strat:`Each correct action answers a cue in the note (tearful statement, no insurance, fear of disclosure). The distractors sound supportive but violate privacy or current ART timing. Take-action item.`,
pearl:`HIV: confidentiality, mental health screening, resources, ART adherence.`});

add({id:"T22",sec:"sti",type:"sata",step:"Evaluate Outcomes",np:"Evaluation",topic:"Hepatitis",
chart:[["Nurses' Notes","28-year-old client, G2 P1, at 32 weeks' gestation. Plans to breastfeed. Lives with her partner and a 4-year-old child; partner's hepatitis B vaccination status is unknown. Asked earlier, \"Will I need a C-section so the baby doesn't catch it?\" Teaching about hepatitis B in pregnancy completed today."],["Laboratory Results","Hepatitis B surface antigen (HBsAg): POSITIVE"]],
stem:`The nurse provides teaching to a client at 32 weeks' gestation who has a positive hepatitis B surface antigen. Which statements by the client indicate understanding of the teaching? Select all that apply.`,
opts:[`"My baby should get the hepatitis B shot and immune globulin within 12 hours after birth."`,`"My partner should be checked and vaccinated if he isn't already immune to hepatitis B."`,`"I'll keep my razor, toothbrush, and nail clippers separate from the rest of the family's."`,`"I'll formula-feed, because the virus would pass to my baby through my breast milk."`,`"My baby will be tested at birth, and the shots will be given only if that test is positive."`,`"I'll need a planned cesarean birth to lower my baby's exposure to the virus at delivery."`,`"My baby will need a blood test at 9 to 12 months, after finishing the vaccine series."`],
ans:[0,1,2,6],
why:`HBV is the hepatitis most threatening to the fetus and neonate. Newborn prophylaxis (HBIG + vaccine within 12 hours) is given regardless of any newborn test, followed by the full vaccine series and postvaccination testing at 9 to 12 months. HBV spreads through blood, body fluids, sex, and birth, so nonimmune household and sexual contacts should be vaccinated and blood-contaminated personal items kept separate. Breastfeeding is not restricted, and HBV alone is not an indication for cesarean birth. This client's plan to breastfeed and her cesarean question are the cues to listen for in her statements.`,
best:`These four statements show she knows how to protect the newborn and household.`,
not:[`Correct: HBIG plus vaccine within 12 hours prevents most perinatal infection.`,`Correct: her partner's status is unknown; nonimmune sexual and household contacts should be vaccinated.`,`Correct: blood-contaminated personal items spread HBV.`,`Needs further teaching: breastfeeding is not restricted for HBsAg-positive mothers; the newborn's HBIG and vaccine provide protection.`,`Needs further teaching: prophylaxis is given within 12 hours regardless of the newborn's status. Waiting for a test result would delay protection.`,`Needs further teaching: HBV is not an indication for cesarean birth; newborn prophylaxis is the key intervention.`,`Correct: postvaccination testing (HBsAg and anti-HBs) at 9 to 12 months confirms the infant is protected and uninfected.`],
strat:`Read each statement against the transmission routes (B = blood, sex, perinatal). The formula-feeding and cesarean statements sound protective but are misconceptions, and the "only if positive" statement delays time-critical prophylaxis. Evaluate-outcomes item.`,
pearl:`HBV: prenatal HBsAg screening + newborn HBIG and vaccine within 12 hours + infant testing at 9 to 12 months.`});

add({id:"T23",sec:"sti",type:"match",step:"Generate Solutions",np:"Planning",topic:"Pregnancy medication differences",
stem:`The nurse is reviewing medication orders for several pregnant clients. For each order, click to specify whether it is indicated or contraindicated for the client.`,
cols:["Indicated","Contraindicated"],
rows:[[`Chlamydia, 12 weeks: azithromycin 1 g PO once`,0,`The pregnancy regimen for chlamydia.`],[`Chlamydia, 12 weeks: doxycycline 100 mg PO BID × 7 days`,1,`Doxycycline is avoided in pregnancy.`],[`Syphilis with penicillin allergy, 20 weeks: desensitization, then penicillin G`,0,`Penicillin is the only proven therapy in pregnancy.`],[`Genital warts, 24 weeks: imiquimod 5% cream`,1,`Patient-applied wart agents are avoided in pregnancy.`],[`Gonorrhea, 16 weeks: ceftriaxone 500 mg IM once`,0,`Ceftriaxone is used in pregnancy.`],[`Recurrent HSV, 36 weeks: suppressive acyclovir`,0,`Late-pregnancy suppression lowers recurrence at delivery.`],[`Trichomoniasis, 20 weeks: metronidazole 500 mg PO BID × 7 days`,0,`Metronidazole is the recommended treatment and can be used in any trimester.`]],
why:`Pregnancy changes medication choices: azithromycin replaces doxycycline, penicillin is required for syphilis, patient-applied HPV agents are avoided, ceftriaxone remains first-line for gonorrhea, HSV suppression late in pregnancy reduces recurrence at delivery, and metronidazole is still used for trichomoniasis.`,
best:`Each row tests one pregnancy-specific drug rule.`,
strat:`For each row, ask: is this the pregnancy version of the regimen? Don't assume every antimicrobial is unsafe in pregnancy. Generate-solutions matrix.`,
pearl:`Pregnancy: azithromycin (chlamydia), penicillin (syphilis), no imiquimod/podofilox, metronidazole OK (trich).`});

add({id:"T27",sec:"sti",type:"mcq",step:"Generate Solutions",np:"Implementation",topic:"Zika",
chart:[["Nurses' Notes","Client at 12 weeks' gestation states her partner returned yesterday from a 2-week trip to an area with active Zika transmission. Partner has no symptoms."]],
stem:`A client at 12 weeks' gestation reports that her partner just returned from an area with active Zika transmission. In instructing the client, what should the nurse emphasize?`,
opts:[`"Use condoms every time or avoid sex for the rest of the pregnancy, and tell your provider about his trip."`,`"Use condoms for the next 3 months, since that is about how long the virus can remain in semen."`,`"Avoid sex for 2 weeks after his return, since the virus clears from semen when it clears from blood."`,`"Have him tested first; if his Zika test is negative, you won't need condoms for the rest of the pregnancy."`],
ans:0,
why:`Zika spreads through mosquitoes and sexually (semen), and virus can persist in semen longer than in blood. Because congenital infection can cause microcephaly even when illness is mild or absent, a pregnant client whose partner traveled to a Zika area should use condoms or abstain for the entire pregnancy and report the exposure.`,
best:`Prevents sexual transmission for the whole period of fetal risk and starts evaluation.`,
not:[``,`Three months is the guidance for couples trying to conceive after travel. During pregnancy, condoms or abstinence are advised for the entire pregnancy.`,`Zika can persist in semen well after it clears from blood, so a 2-week pause isn't protective.`,`Testing an asymptomatic partner isn't recommended to judge sexual transmission risk, and a negative blood test doesn't rule out virus in semen.`],
strat:`No symptoms ≠ no risk. Two options mention a real time frame; the chart cue (12 weeks' pregnant) tells you which population guideline applies. Generate-solutions item.`,
pearl:`Zika: mosquito + sexual spread → microcephaly. Pregnant + exposed partner = condoms or abstinence for the whole pregnancy.`});
/* ===== NGN BANK · part 3: Contraception ===== */
add({id:"B1",sec:"bc",type:"mcq",step:"Prioritize Hypotheses",np:"Implementation",topic:"Estrogen contraindications",
chart:[["Nurses' Notes","27-year-old client requests the combined vaginal ring. Reports migraines \"about twice a month\" that begin with flashing zigzag lines in her vision for 20 minutes. Nonsmoker."],["Vital Signs","BP 116/74 · HR 72 · BMI 23"]],
stem:`A 27-year-old client who has migraines requests the combined vaginal ring for contraception. Which response by the nurse would be most helpful?`,
opts:[`"Your headaches begin with visual changes, so estrogen adds stroke risk. Let's review other options."`,`"The ring releases a lower daily estrogen dose than the pill, so it is a reasonable choice with migraines."`,`"Let's start the ring and have you keep a headache diary; we can stop it if your migraines get worse."`,`"Because you are under 35 and don't smoke, your stroke risk with the ring is low enough to start it."`],
ans:0,
why:`Zigzag visual lines before a migraine are an aura. U.S. MEC rates estrogen-containing methods as unacceptable risk with migraine with aura at any age because of ischemic stroke risk. The ring and patch both contain estrogen; progestin-only methods, IUDs, and barrier methods remain options.`,
best:`Names the stroke risk and redirects to progestin-only, copper IUD, or barrier options.`,
not:[``,`The lower dose and nonoral route don't remove the estrogen-related stroke risk with aura.`,`A headache diary is reasonable for migraine without aura; with aura, estrogen shouldn't be started at all.`,`Age and smoking guide decisions for migraine WITHOUT aura. With aura, estrogen is contraindicated regardless of age or smoking.`],
strat:`The client never says "aura"; she describes one. Normal vitals, young age, and nonsmoking are distractors. Safety item.`,
pearl:`Migraine with aura → no estrogen-containing contraception, at any age.`});

add({id:"B2",sec:"bc",type:"mcq",step:"Take Action",np:"Planning",topic:"Estrogen contraindications",
chart:[["Telephone Note","37-year-old client requests a refill of her combined oral contraceptive. Smokes 1 pack per day × 15 years. No complaints. Last BP 128/82."]],
stem:`The nurse receives a telephone request from a 37-year-old client who smokes for a refill of her combined oral contraceptive. Which nursing order would best meet the client's need for safety?`,
opts:[`Contact the provider about a non-estrogen method and offer smoking cessation support.`,`Refill one cycle of the pill and schedule a blood pressure recheck within the month.`,`Suggest a lower-dose 20-mcg estrogen pill and provide smoking cessation resources.`,`Approve the refill, since the risk applies mainly to clients with high blood pressure.`],
ans:0,
why:`Smoking plus age 35 or older raises cardiovascular and thrombotic risk with estrogen; at 15 or more cigarettes per day it is an unacceptable risk. A lower estrogen dose or normal BP doesn't change that, and the absence of symptoms doesn't make the method safe.`,
best:`Catches an unsafe selection before harm and adds cessation support.`,
not:[``,`A bridge refill continues an estrogen method that is contraindicated for a smoker her age; BP rechecks don't address clot or stroke risk.`,`Any estrogen dose is contraindicated for a smoker 35 or older; cessation support is good but doesn't make the pill safe.`,`Her risk comes from age plus smoking, independent of BP. A BP of 128/82 doesn't make estrogen safe.`],
strat:`Identify the unsafe selection even when the client feels fine. The safest order removes the hazard (estrogen) rather than monitoring it. Watch for options that pair one correct action with an unsafe one. Safety item.`,
pearl:`Smoker + age ≥35 → avoid estrogen (any dose, any route).`});

add({id:"B5",sec:"bc",type:"sata",fmt:"hl",step:"Recognize Cues",np:"Assessment",topic:"ACHES",
stem:`The nurse is reviewing the telephone triage note for a client who started the contraceptive patch 6 weeks ago. Click to highlight the findings that require immediate follow-up.`,
note:["1630: Client reports ",0," since starting the patch and ",1,". Today reports ",2," that began this afternoon. Also reports ",3,". States ",4," and ",5,". Notes ",6,"."],
opts:[`mild breast tenderness that has eased over the past 2 weeks`,`light spotting between periods during the first cycle`,`a sudden, severe headache unlike her usual headaches`,`new swelling and aching pain in her left calf`,`she noticed blurred vision in her right eye`,`she feels short of breath walking to the kitchen`,`itchy redness at the patch site that fades after removal`],
ans:[2,3,4,5],
why:`ACHES: severe Abdominal pain, Chest pain/shortness of breath, severe Headache, Eye problems, Severe leg pain. They signal clot, stroke, or liver problems. Breast tenderness, spotting, and skin irritation are expected.`,
best:`These four are ACHES warning signs.`,
not:[`Expected side effect, and it is improving.`,`Common early side effect.`,`Correct: H.`,`Correct: S.`,`Correct: E.`,`Correct: C (shortness of breath).`,`Expected patch skin irritation; rotating sites helps.`],
strat:`ACHES symptoms turn routine side-effect teaching into emergency evaluation. Recognize-cues highlight item.`,
pearl:`ACHES = report urgently. Breast tenderness, spotting, nausea = expected.`});

add({id:"B7",sec:"bc",type:"sata",step:"Evaluate Outcomes",np:"Evaluation",topic:"Condoms",
stem:`The nurse taught a client how to use external condoms. The nurse observes the client demonstrate condom use on a model while explaining each step. Which actions by the client are incorrect? Select all that apply.`,
opts:[`Applies the condom to the model before any genital contact would occur`,`Holds the rim at the base while withdrawing, before losing the erection`,`Selects a water-based lubricant to use with the latex condom`,`Rolls a second condom over the first one for extra protection`,`Picks a lambskin condom for HIV protection due to a latex allergy`,`Spreads petroleum jelly on the latex condom as a lubricant`,`Leaves about an inch of air in the tip so the condom stays snug`,`Checks the expiration date and the wrapper for tears before opening`],
ans:[3,4,5,6],
why:`CDC: check the package and expiration date, put the condom on before any genital contact, pinch the tip to remove air and leave room for semen, hold the base while withdrawing before losing the erection, and use water- or silicone-based lubricant with latex. Don'ts: two at once (friction → breakage), animal-skin condoms for STI/HIV, oil-based lubricant with latex, trapped air in the tip, reuse.`,
best:`These four break the CDC handout's rules and need correction.`,
not:[`Correct technique: the condom goes on before any genital contact.`,`Correct technique: holding the base prevents slipping and spills.`,`Correct technique: water- or silicone-based lubricant is safe with latex.`,`Correct: friction between two condoms increases breakage.`,`Correct: animal-skin condoms have pores that don't block STI/HIV; with latex allergy, use polyurethane or polyisoprene.`,`Correct: oil-based products like petroleum jelly weaken latex.`,`Correct: air should be squeezed out of the tip; trapped air increases breakage. The space left is for semen.`,`Correct technique: an expired or torn condom can fail.`],
strat:`"Incorrect" = find the actions that need correction. "Extra protection," "lambskin for allergy," and "air in the tip" all look careful but are the errors. Evaluate-outcomes item.`,
pearl:`Water- or silicone-based lube with latex. Never oil. Never two. Pinch the tip. Never reuse.`});

add({id:"B8",sec:"bc",type:"mcq",step:"Generate Solutions",np:"Planning",topic:"Dual protection",
chart:[["Nurses' Notes","19-year-old client with a contraceptive implant placed 1 year ago reports a new partner. States, \"I'm covered, so we don't need condoms.\""]],
stem:`A 19-year-old client with a contraceptive implant reports a new sexual partner. When establishing goals for the client, the nurse prioritizes that the client will:`,
opts:[`use a condom with every sexual encounter while keeping the implant.`,`use condoms only if the new partner reports other recent sex partners.`,`stop using condoms once the new partner has a negative STI screen.`,`use condoms as backup until the implant is replaced next month.`],
ans:0,
why:`The implant (<1 pregnancy per 100) offers no STI protection and lasts at least 3 years. Dual protection (condom + another method) is recommended when both goals apply, especially with a new partner, so the priority goal is consistent condom use alongside the implant.`,
best:`A measurable goal that keeps her effective method and adds STI protection.`,
not:[``,`His partner history is uncertain and infections can be asymptomatic; condoms are recommended with any new partner.`,`One negative test on one partner doesn't account for window periods, her own status, or future exposures.`,`Placed 1 year ago, the implant is effective for at least 3 years and is not due for replacement; condoms are for STI protection, not a gap in coverage.`],
strat:`Separate pregnancy prevention from STI prevention. The priority goal addresses the unmet need (STI risk with a new partner). Use the chart's placement date to rule out the replacement option. Planning item.`,
pearl:`Hormonal methods, IUDs, implants, and sterilization: no STI protection.`});

add({id:"B9",sec:"bc",type:"sata",step:"Analyze Cues",np:"Analysis",topic:"Dual protection",
chart:[["Nurses' Notes","Sexual health clinic follow-up list. Each client below reports a new sexual partner within the past month and relies on a single method used consistently. None has a known STI."]],
stem:`The nurse reviews the follow-up list of clients who each report a new sexual partner. Which clients need teaching that their current method does not reduce the risk of STIs? Select all that apply.`,
opts:[`Client taking a combined oral contraceptive pill daily`,`Client with a levonorgestrel IUD placed last year`,`Client with an etonogestrel implant placed in the arm`,`Client receiving DMPA injections every 3 months`,`Client using the combined vaginal ring each month`,`Client using an internal nitrile condom with every act`,`Client with latex allergy using polyurethane condoms`,`Client using a diaphragm with nonoxynol-9 spermicide`],
ans:[0,1,2,3,4,7],
why:`A new partner makes STI risk the unmet need. Only condoms (external and internal, latex or synthetic) reduce STI risk. Hormonal methods, IUDs, implants, and sterilization prevent pregnancy only. Diaphragms and spermicide don't reliably protect against STIs, and frequent nonoxynol-9 use can irritate tissue and increase HIV risk. Each client relying on a noncondom method needs dual-protection teaching.`,
best:`Every hormonal, device, and spermicide-based method lacks STI protection, so these clients need condoms added.`,
not:[`Correct: pregnancy protection only.`,`Correct: highly effective for pregnancy, no STI protection.`,`Correct: pregnancy protection only.`,`Correct: pregnancy protection only.`,`Correct: pregnancy protection only.`,`Internal condoms do reduce STI risk when used with every act.`,`Polyurethane condoms are an STI-protective alternative for latex allergy.`,`Correct: diaphragms and spermicide aren't relied on for STI protection, and frequent nonoxynol-9 can increase HIV risk.`],
strat:`Sort each client by what the method protects against: pregnancy only or pregnancy plus STIs. Only condoms, whatever the material, fall in the second group. Don't let "barrier" or "spermicide" fool you. Analyze-cues item.`,
pearl:`Dual protection = condom + another effective method.`});

add({id:"B10",sec:"bc",type:"mcq",step:"Evaluate Outcomes",np:"Evaluation",topic:"DMPA",
chart:[["Medication Administration Record","1015: Medroxyprogesterone acetate (DMPA) 150 mg IM, left deltoid."]],
stem:`A nurse is providing teaching for a client who just received medroxyprogesterone acetate (DMPA) 150 mg IM. Which comment by the client indicates the client needs further instruction?`,
opts:[`"I'll gently massage the shot site tonight so the medicine absorbs evenly."`,`"My next shot is due in about 12 to 13 weeks, so I'll schedule it today."`,`"It could take up to a year after my last shot before I'm able to get pregnant."`,`"I'll get enough calcium and vitamin D and do weight-bearing exercise."`],
ans:0,
why:`Textbook safety alert: do NOT massage the DMPA injection site. The other statements are correct: injections about every 13 weeks, delayed return of fertility (often 10 months or more), and bone-density protection.`,
best:`The only false statement.`,
not:[``,`Correct teaching: DMPA is repeated about every 3 months (13 weeks).`,`Correct teaching: return of fertility after DMPA is often delayed 10 months or longer.`,`Correct bone-health teaching.`],
strat:`"Needs further teaching" = find the WRONG statement. The fertility delay sounds alarming but is true. Evaluate-outcomes item.`,
pearl:`DMPA: every 3 months, don't massage, bone loss, delayed fertility return, weight gain.`});

add({id:"B11",sec:"bc",type:"mcq",step:"Evaluate Outcomes",np:"Evaluation",topic:"Progestin-only pill",
chart:[["Nurses' Notes","Client 6 weeks postpartum, exclusively breastfeeding, started norethindrone 0.35 mg (progestin-only pill) today."]],
stem:`A nurse is providing teaching for a breastfeeding client who started a progestin-only pill today. Which statement indicates to the nurse that the client understands the treatment regimen?`,
opts:[`"I'll take it at the same time daily and use backup if I'm more than 3 hours late."`,`"I can take it any time of day, as long as I take one pill sometime each day."`,`"I'll stop the pills for one week each month so I can have a withdrawal bleed."`,`"If I miss a pill, I'll take two pills the next day, and then I won't need any backup."`],
ans:0,
why:`The norethindrone progestin-only pill depends on consistent same-time dosing; taking it more than 3 hours late requires backup (condoms or abstinence) for 2 days. Every pill is active and taken continuously.`,
best:`Names the key adherence rule and the backup plan.`,
not:[``,`Timing matters more with POPs than with combined pills.`,`Norethindrone POPs are taken continuously with no pill-free week.`,`A late or missed POP requires backup for 2 days.`],
strat:`Combined vs progestin-only: the POP is the "same time every day" method and a no-estrogen option while breastfeeding. Evaluate-outcomes item.`,
pearl:`Mini-pill = progestin only; consistency is everything (3-hour window).`});

add({id:"B12",sec:"bc",type:"match",step:"Analyze Cues",np:"Analysis",topic:"Expected effects vs red flags",
stem:`The nurse is reviewing telephone messages from clients using different contraceptive methods. For each client report, click to specify whether it is an expected side effect or requires immediate follow-up.`,
cols:["Expected side effect","Requires immediate follow-up"],
rows:[[`Copper IUD user: heavier, crampier periods for 2 months after insertion`,0,`Expected with copper IUDs, especially early.`],[`Implant user: irregular spotting`,0,`Irregular bleeding is common with the implant.`],[`Vaginal ring user: one swollen, painful calf`,1,`S in ACHES: possible DVT.`],[`DMPA user: 3-lb weight gain over 6 months`,0,`Weight gain is an expected DMPA effect.`],[`Hormonal IUD user: fever, pelvic pain, and strings feel longer`,1,`PAINS: possible infection or displacement.`],[`Combined pill user: mild nausea in the first pack`,0,`Common early side effect.`],[`Patch user: sudden chest pain with shortness of breath`,1,`C in ACHES: possible PE.`],[`Copper IUD user: no pain or fever, but can no longer feel the strings`,1,`S in PAINS: possible expulsion or perforation even without other symptoms; needs evaluation and backup contraception.`]],
why:`Expected effects (bleeding changes, weight gain, mild nausea) need reassurance and teaching. ACHES symptoms on estrogen and PAINS signs with an IUD, even a single string change without pain, need prompt evaluation.`,
best:`Each row asks: routine or red flag?`,
strat:`Know each method's expected effects so the red flags stand out. A red flag can appear without pain or fever. Analyze-cues matrix.`,
pearl:`ACHES for combined methods. PAINS for IUDs.`});

add({id:"B13",sec:"bc",type:"mcq",step:"Generate Solutions",np:"Planning",topic:"Emergency contraception",
chart:[["Nurses' Notes","Client reports unprotected intercourse 4 days (96 hours) ago. Wants to avoid pregnancy. No contraindications to an IUD. Urine hCG negative."]],
stem:`A client reports unprotected intercourse 4 days ago and requests emergency contraception. Which order should the nurse anticipate as most effective for the client?`,
opts:[`Copper IUD insertion at today's visit`,`Levonorgestrel 1.5 mg orally as one dose`,`Ulipristal acetate 30 mg orally as one dose`,`Combined pills in 2 doses (Yuzpe method)`],
ans:0,
why:`The copper IUD works within 5 days (120 hours), is the most effective emergency contraception, and then provides ongoing contraception. Ulipristal also works up to 120 hours but is less effective than the copper IUD. Levonorgestrel is labeled for 3 days.`,
best:`Most effective, still within its window, and continues working.`,
not:[``,`Past its 72-hour labeled window and less effective as time passes.`,`Still within its 120-hour window and more effective than levonorgestrel, but less effective than the copper IUD and provides no ongoing protection.`,`Older, less effective, more nausea.`],
strat:`Convert 4 days to hours and compare to each method's window. Two options are still in-window; the stem asks for MOST effective. Generate-solutions item.`,
pearl:`EC windows: LNG 3 days · ulipristal 5 days · copper IUD 5 days (most effective).`});

add({id:"B14",sec:"bc",type:"sata",step:"Evaluate Outcomes",np:"Evaluation",topic:"Emergency contraception",
chart:[["Nurses' Notes","22-year-old client took levonorgestrel 1.5 mg 12 hours after a condom broke with a new partner whose STI status is unknown. LMP 10 days ago. Not using another method; wants to start a combined oral contraceptive. Teaching completed."]],
stem:`The nurse provides teaching to a client who took levonorgestrel 1.5 mg emergency contraception after a condom broke. Which statements by the client indicate understanding of the teaching? Select all that apply.`,
opts:[`"This pill mainly delays ovulation; it won't end a pregnancy that has already started."`,`"This pill won't prevent an infection from this exposure, so I should get STI testing."`,`"If my next period is more than 7 days late, I'll take a pregnancy test right away."`,`"I can start my birth control pills now and use condoms for the next 7 days."`,`"This pill will keep protecting me if we have unprotected sex later this month."`,`"Next time I can wait up to a week after sex to take it and get the same effect."`,`"If I have some spotting in the next few days, that means I'm not pregnant."`],
ans:[0,1,2,3],
why:`EC delays ovulation; it isn't an abortion and doesn't prevent STIs. It covers only the past exposure, so a regular method can be started right away with backup for 7 days. A period more than 7 days late needs a pregnancy test. A condom break with a partner of unknown status is also an STI exposure, so STI testing (and PEP assessment) applies.`,
best:`These statements show she knows what EC does, what it doesn't do, and the follow-up plan.`,
not:[`Correct: EC is not an abortifacient.`,`Correct: the partner's status is unknown; EC has no effect on STI transmission.`,`Correct: a period more than 7 days late warrants a pregnancy test.`,`Correct: after levonorgestrel EC, any regular method can be started immediately with 7 days of backup.`,`Needs further teaching: EC covers only the past exposure; ovulation may occur later in the cycle.`,`Needs further teaching: LNG is labeled for 3 days and works best the sooner it is taken.`,`Needs further teaching: spotting can occur after EC and doesn't rule out pregnancy; a normal period or a negative test does.`],
strat:`Condom failure = two problems (pregnancy and STI), two plans. Test each statement against the timing rules: when EC works, how long it covers, and when to test. Evaluate-outcomes item.`,
pearl:`EC ≠ abortion. EC ≠ STI protection. Start a method now + 7 days backup.`});

add({id:"B15",sec:"bc",type:"mcq",step:"Evaluate Outcomes",np:"Evaluation",topic:"Sterilization",
chart:[["Nurses' Notes","Postprocedure day 3: client had a vasectomy. Client and partner previously used condoms."]],
stem:`A nurse is providing teaching for a client who had a vasectomy 3 days ago. Which statement indicates to the nurse that the client understands the treatment regimen?`,
opts:[`"We'll use condoms until a semen analysis confirms there are no sperm."`,`"We'll keep using condoms for 2 weeks, until my incision has healed."`,`"After about 20 ejaculations, we can stop condoms without any testing."`,`"My semen will look the same, but it won't carry any sperm from now on."`],
ans:0,
why:`Sperm remain in the tract until cleared, so backup is needed until semen analysis (usually about 8 to 16 weeks after the procedure) confirms no sperm. Counting ejaculations is not a substitute for testing. Testosterone, erections, orgasm, and most semen volume are unchanged.`,
best:`The only accurate statement.`,
not:[``,`Incision healing doesn't mean sperm have cleared; that takes weeks to months.`,`Ejaculations help clear sperm, but only a semen analysis confirms sterility.`,`Semen appearance is unchanged, but sperm remain in the tract for weeks.`],
strat:`"Immediately effective" is the classic vasectomy trap, and so is any time frame without a confirming test. Evaluate-outcomes item.`,
pearl:`Vasectomy: backup until semen analysis is sperm-free.`});

add({id:"B16",sec:"bc",type:"mcq",step:"Take Action",np:"Implementation",topic:"Sterilization",
chart:[["Preoperative Note","0700: 24-year-old client, G0, scheduled for laparoscopic tubal sterilization. Consent signed yesterday. Client states quietly, \"My boyfriend says this is what I should do.\""]],
stem:`A nurse is caring for a 24-year-old client who is scheduled for laparoscopic tubal sterilization this morning. The nurse should take which priority action?`,
opts:[`Talk with the client privately to confirm the choice is her own, then notify the provider.`,`Continue the preoperative checklist, since consent was signed and witnessed yesterday.`,`Ask the client and her boyfriend together to describe what they understand about the surgery.`,`Give written material on reversible long-acting methods and continue preoperative care.`],
ans:0,
why:`Sterilization tests autonomy. The nurse makes sure the decision is informed and voluntary, explains permanence and alternatives, and protects the client from pressure.`,
best:`Acts on a coercion cue before an irreversible procedure.`,
not:[``,`A signature without voluntary, informed choice isn't valid consent; a new cue requires reassessment.`,`Including the possible source of pressure prevents an honest answer.`,`Information on alternatives is useful but doesn't address possible coercion, and care continues without verifying consent.`],
strat:`Irreversible procedure + coercion cue = stop and verify privately. Ethics/priority item.`,
pearl:`Sterilization is intended to be permanent; consent must be informed and voluntary.`});

add({id:"B17",sec:"bc",type:"sata",fmt:"hl",step:"Recognize Cues",np:"Assessment",topic:"Medication interactions",
chart:[["Nurses' Notes","23-year-old client has taken a combined oral contraceptive (ethinyl estradiol/levonorgestrel) for 1 year without missed pills. Reports new breakthrough bleeding this cycle and asks whether her other medicines could make the pill less effective. Urine hCG negative."]],
stem:`A client taking a combined oral contraceptive reports new breakthrough bleeding. The nurse reviews the client's current medication list. Click to highlight the medications for which the nurse should recommend backup contraception.`,
note:["Current medications: ",0,"; ",1,"; ",2,"; ",3,"; ",4,"; ",5,"."],
opts:[`rifampin 600 mg PO daily for latent TB`,`carbamazepine 200 mg PO BID for seizures`,`amoxicillin 500 mg PO TID × 10 days`,`griseofulvin 500 mg PO daily for tinea capitis`,`ibuprofen 400 mg PO PRN cramps`,`fluconazole 150 mg PO once for yeast infection`],
ans:[0,1,3],
why:`Breakthrough bleeding in a client who hasn't missed pills is a cue to look for enzyme-inducing drugs. Drugs that decrease oral contraceptive effectiveness include anticonvulsants (carbamazepine, phenytoin, phenobarbital, primidone, oxcarbazepine, topiramate), griseofulvin, rifampin/rifabutin, and some anti-HIV protease inhibitors. With these, the nurse recommends backup (condoms) and a discussion with the provider about a method that isn't affected.`,
best:`These three induce liver enzymes and lower hormone levels, so backup is needed.`,
not:[`Correct: rifampin is a potent enzyme inducer.`,`Correct: enzyme-inducing anticonvulsant.`,`Most antibiotics, including amoxicillin, don't reduce combined pill effectiveness; "all antibiotics" is the trap.`,`Correct: griseofulvin is the antifungal that lowers effectiveness.`,`No interaction.`,`A single dose of fluconazole doesn't reduce effectiveness; griseofulvin is the antifungal that interacts, not "all antifungals."`],
strat:`Breakthrough bleeding with perfect adherence points to an interaction. Know the specific enzyme-inducer list; reject blanket "all antibiotics" or "all antifungals" thinking. Recognize-cues highlight item.`,
pearl:`OC interactions: anticonvulsants, griseofulvin, rifampin/rifabutin, some protease inhibitors.`});

add({id:"B18",sec:"bc",type:"mcq",step:"Analyze Cues",np:"Implementation",topic:"Fertility awareness & LAM",
chart:[["Nurses' Notes","Client 4 months postpartum has relied on the lactational amenorrhea method. Breastfeeds exclusively. States, \"My period came back last week.\""]],
stem:`A client who is 4 months postpartum has been relying on the lactational amenorrhea method (LAM). The client states, "My period came back last week." Which response by the nurse would be most helpful?`,
opts:[`"Now that your period is back, LAM no longer protects you; let's choose another method."`,`"LAM still works, because you breastfeed exclusively and your baby is under 6 months."`,`"One period doesn't end LAM; it stops working once your baby starts solids at 6 months."`,`"The first periods after birth are usually without ovulation, so LAM still protects you."`],
ans:0,
why:`LAM works only when exclusive breastfeeding, amenorrhea, and infant <6 months are all true. Return of menses means ovulation may be occurring, and ovulation can precede the first period.`,
best:`Recognizes that one criterion changed.`,
not:[``,`Two criteria are met, but amenorrhea is not; all three are required.`,`Return of menses ends LAM regardless of the infant's age or feeding.`,`Ovulation can occur before or with the first postpartum period, so it can't be assumed absent.`],
strat:`LAM = three conditions, all required. Find which one changed. Analyze-cues item.`,
pearl:`LAM: exclusive breastfeeding + amenorrhea + infant <6 months.`});

add({id:"B20",sec:"bc",type:"mcq",step:"Generate Solutions",np:"Planning",topic:"IUD differences",
chart:[["Nurses' Notes","32-year-old client requests long-acting reversible contraception. Reports heavy periods lasting 7 days with severe cramping. No contraindications to hormones."],["Laboratory Results","Hemoglobin 10.9 g/dL (ref 12.0–15.5)"]],
stem:`A 32-year-old client with heavy menstrual bleeding and a low hemoglobin requests long-acting reversible contraception. Which order should the nurse anticipate for the client?`,
opts:[`Levonorgestrel 52-mg IUD`,`Copper T380A IUD (nonhormonal)`,`Etonogestrel implant`,`DMPA 150 mg IM every 13 weeks`],
ans:0,
why:`The hormonal IUD usually makes periods lighter and may stop them, which treats heavy bleeding. The copper IUD can make bleeding and cramps heavier, which would worsen her low hemoglobin. The implant is long-acting but causes unpredictable bleeding, and DMPA isn't a LARC method.`,
best:`Meets both needs: long-acting and lighter bleeding.`,
not:[``,`Likely to worsen heavy bleeding and anemia.`,`Long-acting, but bleeding is unpredictable and it isn't a treatment for heavy periods.`,`Not a LARC method; irregular bleeding is common in early use.`],
strat:`The low hemoglobin is the cue that makes the copper IUD's side effect dangerous. Two LARC options remain; pick the one that also treats the bleeding. Generate-solutions item.`,
pearl:`Copper IUD = heavier bleeding. LNG IUD = lighter bleeding.`});
/* ===== NGN BANK · part 4: Bowtie (NCSBN layout) & NGN cases ===== */
var BOW_STEM = `Complete the diagram by selecting from the choices below to specify what condition the client is most likely experiencing, 2 actions the nurse should take to address that condition, and 2 parameters the nurse should monitor to assess the client's progress.`;

add({id:"T7",sec:"sti",type:"bowtie",step:"Analyze Cues",np:"Analysis",topic:"Syphilis stages",
chart:[["Nurses' Notes","1000: 25-year-old client reports a painless sore on the penis about 7 weeks ago that \"healed on its own.\" Now has a rash on the trunk, palms, and soles; fatigue; and swollen lymph nodes. Broad, flat, moist, painless gray-pink perianal lesions noted. Three sexual partners in the past 6 months. No known drug allergies."],["Vital Signs","T 37.8 °C · HR 88 · BP 124/78"]],
stem:BOW_STEM,
acts:[`Obtain RPR or VDRL serologic testing as prescribed`,`Administer benzathine penicillin G IM as prescribed`,`Prepare for cryotherapy of the perianal lesions`,`Start oral acyclovir and teach about prodromal signs`,`Start oral doxycycline 100 mg BID for 14 days`],actAns:[0,1],
conds:[`Secondary syphilis`,`Genital warts (HPV)`,`Acute HIV infection`,`Disseminated gonococcal infection`],cAns:0,
mons:[`Nontreponemal (RPR) titers at 6 and 12 months`,`Fever, headache, and myalgia in the first 24 hours`,`Treponemal antibody (FTA-ABS) results over time`,`Liver enzymes during penicillin therapy`,`CD4 count before and after penicillin therapy`],monAns:[0,1],
actNot:[`Correct.`,`Correct: penicillin is the cornerstone; syphilis is reportable.`,`HPV treatment; condylomata lata are syphilis lesions and resolve with penicillin.`,`HSV treatment; wrong condition.`,`An alternative only for nonpregnant clients with penicillin allergy; this client has no allergies, so penicillin is preferred.`],
condNot:[`Correct: healed painless chancre → palms/soles rash + condylomata lata.`,`HPV warts are soft and cauliflower-like; condylomata lata are broad and flat.`,`Acute HIV can cause fever, rash, and lymphadenopathy, but doesn't explain the healed painless chancre or condylomata lata (HIV testing is still recommended).`,`DGI causes joint pain and pustular lesions after gonorrhea.`],
monNot:[`Correct: a fourfold drop in titers shows treatment response.`,`Correct: Jarisch-Herxheimer reaction.`,`Treponemal tests usually stay positive for life and aren't used to track treatment response.`,`Not a routine parameter for penicillin treatment of syphilis.`,`Not indicated by this presentation; HIV testing is reasonable, but CD4 counts don't measure syphilis response.`],
why:`A healed painless chancre followed by a palms/soles rash, lymphadenopathy, and condylomata lata is secondary syphilis. Serology confirms, benzathine penicillin G treats, and it must be reported. Monitor nontreponemal titers for response and watch for a Jarisch-Herxheimer reaction after the first dose.`,
best:`The palms/soles rash and flat, painless condylomata lata separate syphilis from look-alikes.`,
strat:`HPV warts vs condylomata lata is the trap. Parameters to monitor should measure THIS condition's response and complications; know which syphilis test is used for follow-up. Analyze-cues bowtie.`,
pearl:`Primary: painless chancre. Secondary: palms/soles rash + condylomata lata. Latent: silent. Tertiary: neuro/CV.`});

add({id:"T8",sec:"sti",type:"bowtie",step:"Prioritize Hypotheses",np:"Analysis",topic:"PID",
chart:[["Nurses' Notes","1330: 22-year-old client reports lower abdominal pain × 3 days, worse with intercourse. Treated for chlamydia 8 months ago; partner was never treated."],["Vital Signs","T 38.6 °C (101.5 °F) · HR 102 · RR 18 · BP 118/72"],["Exam / Labs","Cervical motion tenderness; adnexal tenderness; mucopurulent cervical discharge. Urine hCG negative. WBC 15,200/mm³ (ref 5,000–10,000)."]],
stem:BOW_STEM,
acts:[`Give prescribed antibiotics without waiting for culture results`,`Arrange evaluation and treatment of the client's partner`,`Hold antibiotics until NAAT results confirm the organism`,`Obtain a pelvic ultrasound before any antibiotics are given`,`Teach that intercourse may resume once pelvic pain resolves`],actAns:[0,1],
conds:[`Pelvic inflammatory disease`,`Uncomplicated chlamydial cervicitis`,`Ectopic pregnancy`,`Acute pyelonephritis`],cAns:0,
mons:[`Temperature and heart rate`,`Pelvic pain and tenderness within 72 hours`,`Serial quantitative serum hCG levels`,`Urine culture and sensitivity results`,`Hemoglobin and hematocrit every 12 hours`],monAns:[0,1],
actNot:[`Correct: prompt empiric treatment protects the tubes.`,`Correct: the untreated partner likely caused reinfection.`,`Delay risks tubal scarring.`,`Imaging may be ordered if an abscess is suspected, but it shouldn't delay empiric antibiotics.`,`Intercourse should wait until treatment is finished, symptoms resolve, and the partner is treated.`],
condNot:[`Correct: upper-tract infection with systemic signs.`,`Cervicitis alone doesn't cause CMT, adnexal tenderness, fever, and leukocytosis.`,`The urine hCG is negative.`,`No flank pain or urinary findings; CMT and adnexal tenderness point to the pelvis.`],
monNot:[`Correct: fever and tachycardia should resolve with treatment.`,`Correct: clinical improvement is expected within 72 hours; if not, reassess.`,`She isn't pregnant.`,`No urinary source is suggested.`,`No bleeding is suggested; not a primary parameter for PID.`],
why:`Fever, leukocytosis, CMT, and adnexal tenderness after a likely reinfection = PID. Prompt broad-spectrum treatment prevents tubal scarring; partner treatment prevents recurrence. Temperature, heart rate, and pelvic pain/tenderness (reassessed within 72 hours) show response.`,
best:`Choose the hypothesis that explains ALL the cues, then actions that prevent long-term damage.`,
strat:`Uncomplicated STI vs PID: CMT + adnexal tenderness + fever means it ascended. Use the negative hCG to rule out ectopic pregnancy. Prioritize-hypotheses bowtie.`,
pearl:`PID → infertility, ectopic pregnancy, chronic pelvic pain. Treat fast; treat partners.`});

add({id:"T9",sec:"sti",type:"bowtie",step:"Take Action",np:"Implementation",topic:"HSV in pregnancy",
chart:[["Labor & Delivery Admission","0600: G2 P1 at 39 weeks in early labor. Cervix 3 cm. Membranes intact. History of recurrent genital herpes; no suppressive therapy this pregnancy."],["Nurses' Notes","0610: Client reports tingling and burning on the labia since last night. Two small vesicles visible on the right labia majora."],["Vital Signs / FHR","T 37.1 °C · BP 120/76 · FHR 140, moderate variability"]],
stem:BOW_STEM,
acts:[`Notify the obstetric provider of the findings promptly`,`Prepare the client for a likely cesarean birth`,`Prepare to rupture membranes to shorten labor`,`Apply a fetal scalp electrode for closer monitoring`,`Start oral acyclovir and plan for a vaginal birth`],actAns:[0,1],
conds:[`Recurrent genital HSV outbreak`,`First-episode (primary) genital HSV`,`Primary syphilis with a labial chancre`,`Vulvovaginal candidiasis in pregnancy`],cAns:0,
mons:[`Membrane status (intact vs ruptured)`,`Newborn for vesicles, lethargy, or poor feeding`,`Maternal type-specific HSV antibody titers`,`Newborn bilirubin level for jaundice at 24 hours`,`Fundal height and fetal position in labor`],monAns:[0,1],
actNot:[`Correct.`,`Correct: lesions or prodrome typically prompt cesarean planning.`,`Rupturing membranes increases neonatal exposure.`,`Invasive fetal monitoring breaks the fetal skin and is avoided with active HSV.`,`Antivirals don't make vaginal birth safe when lesions or prodrome are present.`],
condNot:[`Correct.`,`Her history of recurrent herpes means this isn't a first episode.`,`A chancre is single and painless; these are multiple vesicles with tingling.`,`Yeast causes itch and discharge, not vesicles.`],
monNot:[`Correct: rupture raises exposure risk.`,`Correct: signs of neonatal herpes.`,`Antibody titers don't guide labor management of a recurrent outbreak.`,`Not specific to neonatal HSV.`,`Not related to HSV risk; position is assessed routinely.`],
why:`Course text: if no lesions or prodrome, vaginal birth may be acceptable; active lesions or prodrome typically prompt cesarean planning to reduce neonatal exposure. Notify the provider promptly, protect membranes, avoid invasive fetal monitoring, and watch the newborn.`,
best:`The first labor question with HSV history: lesions or prodrome right now?`,
strat:`The reassuring FHR is a distractor; it doesn't change the HSV plan. Pregnancy changes the priority. Take-action bowtie.`,
pearl:`Neonatal herpes can be devastating. Prodrome counts even without lesions.`});

add({id:"B3",sec:"bc",type:"bowtie",step:"Prioritize Hypotheses",np:"Analysis",topic:"ACHES & VTE",
chart:[["Nurses' Notes","1545: 34-year-old client arrives at the clinic. Started a combined oral contraceptive 2 months ago. Smokes one-half pack daily. Reports left calf pain and swelling × 1 day and sudden sharp chest pain with shortness of breath for the past hour. Also reports mild breast tenderness since starting the pill."],["Vital Signs","HR 118 · RR 26 · BP 108/68 · SpO2 89% on room air · T 37.2 °C"]],
stem:BOW_STEM,
acts:[`Activate the emergency response system for transfer`,`Apply oxygen and report the ACHES findings to the provider`,`Obtain a 12-lead ECG before arranging any transfer`,`Elevate and gently massage the left calf to ease pain`,`Stop the pill and switch the client to the vaginal ring`],actAns:[0,1],
conds:[`Estrogen-related DVT with possible PE`,`Acute coronary syndrome related to smoking`,`Pneumonia with pleuritic chest pain`,`Panic attack with hyperventilation`],cAns:0,
mons:[`Oxygen saturation and respiratory effort`,`Heart rate and blood pressure`,`Temperature trend every 4 hours`,`Serum potassium level`,`Breast tenderness since starting the pill`],monAns:[0,1],
actNot:[`Correct: possible PE is an emergency.`,`Correct.`,`An ECG may be done, but it shouldn't delay emergency transfer for suspected PE.`,`Massaging a possible DVT can dislodge the clot.`,`The ring also contains estrogen.`],
condNot:[`Correct.`,`Smoking raises cardiac risk, but ACS doesn't explain the calf pain and swelling that preceded the chest pain.`,`Pleuritic pain fits, but she is afebrile, and pneumonia doesn't explain the calf findings or the sudden onset.`,`Dangerous to assume with hypoxemia and a swollen calf.`],
monNot:[`Correct: SpO2 89% and RR 26 show respiratory compromise.`,`Correct: tachycardia and lower BP suggest hemodynamic strain.`,`She is afebrile; temperature doesn't track this threat.`,`Not related to the presenting problem.`,`Expected side effect; irrelevant now.`],
why:`Calf pain and swelling followed by sudden chest pain, dyspnea, tachycardia, and SpO2 89% on an estrogen method signals DVT with possible PE. ACHES findings turn routine side-effect teaching into emergency care.`,
best:`Links the leg and chest findings to estrogen-related clotting and separates them from the expected side effect (breast tenderness).`,
strat:`ACHES overrides everything. Choose the condition that explains the leg AND chest findings. Parameters to monitor should track the threat (oxygenation, hemodynamics). Prioritize-hypotheses bowtie.`,
pearl:`ACHES: Abdominal pain · Chest pain/SOB · Headache · Eye problems · Severe leg pain.`});

add({id:"B4",sec:"bc",type:"bowtie",step:"Recognize Cues",np:"Assessment",topic:"PAINS",
chart:[["Telephone Triage Note","0900: 29-year-old client with a copper IUD inserted 3 weeks ago reports fever, chills, lower abdominal pain, and foul-smelling vaginal discharge since yesterday. States, \"I can't feel the strings anymore.\" Also reports her last period was heavier than usual."],["Vital Signs (client-reported)","Oral temperature 38.5 °C (101.3 °F)"]],
stem:BOW_STEM,
acts:[`Arrange an urgent same-day evaluation with the provider`,`Advise backup contraception until IUD position is confirmed`,`Reassure her that heavier bleeding is expected with copper IUDs`,`Teach her to recheck the strings after her next menstrual period`,`Advise acetaminophen for fever and a temperature recheck tomorrow`],actAns:[0,1],
conds:[`Pelvic infection with possible IUD displacement`,`Expected effects of a recently inserted copper IUD`,`Bacterial vaginosis with malodorous discharge`,`Normal cramping and bleeding after insertion`],cAns:0,
mons:[`Temperature and chills`,`Abdominal pain and vaginal discharge`,`Menstrual flow volume over the next cycle`,`Blood pressure at each visit`,`Body weight and appetite changes`],monAns:[0,1],
actNot:[`Correct.`,`Correct: a displaced IUD doesn't protect.`,`Heavy bleeding is expected; fever and missing strings are not.`,`String checks after menses are routine teaching, but missing strings with fever need evaluation now.`,`Treats the symptom and delays evaluation of a possible pelvic infection.`],
condNot:[`Correct.`,`Heavier periods are expected; fever and string changes are not.`,`BV doesn't explain fever, pain, and missing strings.`,`Doesn't explain fever or missing strings.`],
monNot:[`Correct: infection response.`,`Correct: infection response.`,`Heavier flow is expected with copper IUDs; it doesn't track the infection.`,`Not a primary parameter for this problem.`,`Unrelated.`],
why:`Fever/chills (N), abdominal pain (A), foul discharge (I), and missing strings (S) are multiple PAINS signs. The heavier period alone would be expected with a copper IUD.`,
best:`Normal IUD findings vs PAINS: heavier periods are expected; fever and string changes are not.`,
strat:`Multiple PAINS letters = urgent. The heavier period is a planted expected finding. Recognize-cues bowtie.`,
pearl:`PAINS: Period late/abnormal bleeding · Abdominal pain · Infection/discharge · Not well/fever · String changes.`});

add({id:"S8",sec:"sex",type:"case",sub:"sata",fmt:"n",n:3,step:"Take Action",np:"Implementation",topic:"Child sexual abuse",
record:[["Nurses' Notes","1400: 7-year-old client brought in by grandmother for yellow vaginal discharge × 1 week. Vulvar erythema noted. Client is quiet, avoids eye contact, and states, \"I'm not allowed to tell.\"\n1430: Grandmother states the child lives with her, the child's mother, and the mother's boyfriend."],["History and Physical","Born vaginally at term. Mother's prenatal STI screening negative. No chronic illness. Immunizations current."],["Laboratory Results","|Test|Result\n|Vaginal NAAT, N. gonorrhoeae|POSITIVE\n|Vaginal NAAT, C. trachomatis|Negative\n|Urinalysis|Negative for nitrites"],["Orders","Ceftriaxone IM per weight-based protocol\nSocial work consult"]],
stem:`A nurse is caring for a 7-year-old client who is brought to the clinic by her grandmother for vaginal discharge. Select 3 actions the nurse should take.`,
opts:[`Report suspected sexual abuse to child protective services per policy`,`Keep the child in a safe setting until a safety plan is in place`,`Administer the prescribed ceftriaxone intramuscularly`,`Ask the child detailed questions about who touched her and when`,`Teach that gonorrhea can spread through shared towels or bathwater`,`Confirm the NAAT result with a culture before making any report`],
ans:[0,1,2],
why:`The NCLEX map: children with STI signs apart from mother-to-child transmission at birth may indicate sexual abuse. Negative prenatal screening rules out perinatal spread. Report on reasonable suspicion, protect the child, and treat. Detailed questioning is left to trained forensic interviewers.`,
best:`Safety, legal duty, and treatment together.`,
not:[`Correct.`,`Correct.`,`Correct.`,`Repeated or leading questions can harm the child and the investigation; the nurse documents the child's own words and defers to a forensic interviewer.`,`Gonorrhea in a child is not spread by casual household contact; this explanation could delay protection.`,`Mandatory reporting requires reasonable suspicion, not confirmation; waiting delays protection.`],
strat:`The History tab rules out the "innocent" explanation. Child + non-perinatal STI = possible abuse → safety. Take-action item.`,
pearl:`Child with non-perinatal STI → suspect sexual abuse → safety + report.`});

add({id:"T24",sec:"sti",type:"case",sub:"sata",step:"Recognize Cues",np:"Assessment",topic:"GBS",
record:[["Nurses' Notes","0200: G2 P1 at 36 weeks 3 days admitted in active labor. Missed last prenatal visit; GBS culture not done. Membranes ruptured at home at 0600 yesterday; fluid clear.\n0215: Cervix 6 cm. Client reports feeling \"hot.\""],["Vital Signs","|Time|T|HR|BP|FHR\n|0200|38.3 °C|96|122/76|155, moderate variability"],["History and Physical","Previous birth 3 years ago at term; healthy infant. No drug allergies."],["Laboratory Results","|Test|Result|Reference\n|Hemoglobin|11.8 g/dL|11.0–14.0 (pregnancy)\n|WBC|13,500/mm³|5,000–15,000 (labor)"]],
stem:`A client in active labor is admitted to the labor and delivery unit. Which findings indicate to the nurse that the client requires intrapartum group B streptococcus (GBS) prophylaxis? Select all that apply.`,
opts:[`Gestational age of 36 weeks 3 days`,`Membranes ruptured at 0600 yesterday`,`Maternal temperature of 38.3 °C`,`No GBS culture result this pregnancy`,`Previous term birth of a healthy infant`,`Fetal heart rate of 155/min at 0200`,`WBC count of 13,500/mm³ in labor`],
ans:[0,1,2,3],
why:`With unknown GBS status, the course's risk factors for intrapartum prophylaxis are: birth before 37 weeks, ROM over 18 hours, maternal temperature over 38 °C, or a prior infant with early-onset GBS. She has three plus unknown status.`,
best:`These match the course thresholds.`,
not:[`Correct: <37 weeks.`,`Correct: 0600 to 0200 = 20 hours (>18).`,`Correct: >38 °C.`,`Correct: unknown culture triggers risk-based prophylaxis.`,`A prior healthy infant is not a risk factor (a prior infant WITH GBS disease would be).`,`Within the normal range (110 to 160) with moderate variability.`,`Within the expected range in labor.`],
strat:`Calculate the ROM duration from the timestamps; NGN makes you do the math. Normal labs and FHR are planted. Recognize-cues item.`,
pearl:`GBS: screen 35–37 weeks (course); IV antibiotics in labor if positive or risk factors with unknown status.`});

add({id:"T25",sec:"sti",type:"case",sub:"matrix",step:"Evaluate Outcomes",np:"Evaluation",topic:"PID",
record:[["Nurses' Notes","Day 0: 20-year-old client diagnosed with PID; outpatient antibiotics started. Pelvic pain 7/10. Cervical motion tenderness present. Mucopurulent discharge.\nDay 3: Pelvic pain 2/10. Minimal tenderness on exam. Mucopurulent discharge still present. Taking all doses. Partner treated on day 1.\nDay 3: Client states, \"We'll wait to have sex until we're both done with treatment.\""],["Vital Signs","|Day|T|HR\n|0|38.4 °C|104\n|3|37.0 °C|78"],["Laboratory Results","|Day|WBC (ref 5,000–10,000/mm³)\n|0|14,800\n|3|9,100"]],
stem:`The nurse is evaluating a 20-year-old client 3 days after outpatient treatment for pelvic inflammatory disease (PID) was started. For each finding on day 3, click to specify whether it indicates the client's condition has improved, has not changed, or has declined.`,
cols:["Improved","No change","Declined"],
rows:[[`Temperature`,0,`38.4 → 37.0 °C: fever resolved.`],[`Heart rate`,0,`104 → 78: tachycardia resolved.`],[`Pelvic pain`,0,`7/10 → 2/10.`],[`White blood cell count`,0,`14,800 → 9,100: back within range.`],[`Vaginal discharge`,1,`Still mucopurulent; unchanged.`],[`Cervical motion tenderness`,0,`Present → minimal on exam.`]],
why:`Comparing day 0 to day 3 across trends shows improvement in fever, heart rate, pain, tenderness, and WBC, while discharge hasn't changed yet. Overall the client is responding, but she must finish the full regimen.`,
best:`Trend data, not a single value, shows the outcome.`,
strat:`Evaluate-outcomes matrices require you to compare time points across tabs. Judge each row on its own.`,
pearl:`Symptom improvement ≠ cure. Finish the full PID regimen; treat partners.`});

add({id:"T26",sec:"sti",type:"case",sub:"cloze",step:"Prioritize Hypotheses",np:"Analysis",topic:"Gonorrhea complications",
record:[["Nurses' Notes","1100: 27-year-old client reports fever, chills, and pain and swelling in the right knee and left wrist × 2 days. Two weeks ago had dysuria and penile discharge after a new partner; did not seek care.\n1110: Several small pustular lesions noted on the hands and forearms. No genital ulcers or rash on palms or soles."],["Vital Signs","|Time|T|HR|RR|BP\n|1100|38.7 °C|108|20|118/70"],["Laboratory Results","|Test|Result|Reference\n|WBC|16,400/mm³|5,000–10,000\n|Urine NAAT, N. gonorrhoeae|Pending\n|RPR|Nonreactive"]],
stem:`The nurse is caring for a 27-year-old client who reports fever, chills, and joint pain. Complete the following sentence by choosing from the lists of options.`,
sentence:`The client is most likely experiencing {0} as evidenced by {1}.`,
blanks:[
 {opts:[`disseminated gonococcal infection`,`secondary syphilis`,`septic arthritis of the right knee`,`primary genital herpes`],ans:0,not:[``,`RPR is nonreactive and there's no palms/soles rash.`,`A single infected joint doesn't explain the wrist involvement or the pustular skin lesions.`,`HSV causes painful genital vesicles.`]},
 {opts:[`joint pain and pustular skin lesions after untreated urethritis`,`fever and leukocytosis two weeks after a new sexual partner`,`a nonreactive RPR and the absence of a rash on the palms or soles`,`a hot, swollen right knee with a WBC count of 16,400/mm³`],ans:0,not:[``,`True, but fever and leukocytosis point to infection in general, not to dissemination.`,`Rules OUT syphilis; doesn't support DGI.`,`Fits a single septic joint; it leaves out the second joint and skin findings that define DGI.`]}],
why:`Untreated gonorrhea can spread through the bloodstream. Fever, migratory joint pain and swelling, and pustular skin lesions after untreated urethritis suggest disseminated gonococcal infection. A nonreactive RPR helps rule out syphilis.`,
best:`The only hypothesis that explains joints, skin, and systemic signs after untreated discharge.`,
strat:`Drop-down cloze items need the right condition AND the right evidence. Distractor evidence is often true but doesn't support the hypothesis. Prioritize-hypotheses item.`,
pearl:`Gonorrhea complications: PID, infertility, ectopic, disseminated infection, neonatal eye infection.`});

add({id:"B19",sec:"bc",type:"case",sub:"matrix",step:"Generate Solutions",np:"Planning",topic:"Method selection",
record:[["History and Physical","18-year-old college student. Migraines with visual aura since age 15. No other medical history. Nonsmoker."],["Medications","Sumatriptan 50 mg PO PRN migraine. Previously used a combined oral contraceptive; states she \"forgot it all the time.\""],["Nurses' Notes","Sexually active with a new partner × 1 month; uses condoms \"sometimes.\" Wants to avoid pregnancy for at least 4 years. Urine hCG negative. BP 112/70."]],
stem:`The nurse is planning contraceptive care for an 18-year-old client who wants to avoid pregnancy for at least 4 years. For each potential intervention, click to specify whether it is indicated, contraindicated, or non-essential for the client.`,
cols:["Indicated","Contraindicated","Non-essential"],
rows:[[`Levonorgestrel IUD`,0,`LARC without estrogen; user-independent.`],[`Combined vaginal ring`,1,`Contains estrogen: stroke risk with aura.`],[`Condoms with every act`,0,`New partner + inconsistent condoms → dual protection.`],[`Contraceptive implant`,0,`LARC without estrogen; fits her adherence history.`],[`Low-dose combined pill with a phone reminder`,1,`Any estrogen dose is contraindicated with aura, and adherence already failed.`],[`Daily basal body temperature charting`,2,`Not needed with LARC; low effectiveness alone.`]],
why:`Migraine with aura rules out estrogen (pill, patch, ring) at any dose. Poor adherence favors a user-independent LARC method. A new partner and inconsistent condoms call for dual protection.`,
best:`The plan satisfies all three constraints: aura, adherence, STI risk.`,
strat:`List every constraint in the record (aura → no estrogen; forgets pills → LARC; new partner → condoms), then judge each row against all of them. Generate-solutions matrix.`,
pearl:`Adherence problem → LARC. Aura → no estrogen. New partner → add condoms.`});
/* ===== EXPANSION BANK · part 1: Reproduction (8) & Sexuality (16) ===== */
add({id:"R8",sec:"repro",type:"mcq",obj:[1],step:"Analyze Cues",np:"Implementation",topic:"Gametogenesis",
chart:[["Nurses' Notes","34-year-old client, G0, states, \"I'm going to wait until I'm 42 to have kids. My body keeps making new eggs every month anyway, right?\""]],
stem:`The nurse is counseling a 34-year-old client who has never been pregnant. The client states, "I'm going to wait until I'm 42 to have kids. My body keeps making new eggs every month anyway, right?" Which response by the nurse would be most helpful?`,
opts:[`"Your eggs began forming before birth, and that supply drops over time, so fertility declines with age."`,`"Your ovaries do make new eggs each cycle, but egg quality drops after 35, so fertility declines with age."`,`"You're born with a set number of eggs, but fertility stays fairly stable until menopause starts in your 50s."`,`"Fertility depends mostly on your partner, since sperm production slows with age faster than your egg supply."`],
ans:0,
why:`Oogenesis begins before birth; primary oocytes are arrested until puberty, and usually one matures per cycle. The supply is finite, so fertility declines with age. Spermatogenesis, by contrast, begins at puberty and continues through adulthood.`,
best:`It corrects the client's misconception with accurate oogenesis physiology and links it to her plan to wait until 42.`,
not:[``,`The age-related decline is real, but the ovaries do not make new eggs; the oocyte supply is fixed before birth.`,`Correctly states the supply is fixed, but fertility declines well before menopause, especially after 35.`,`Reversed: spermatogenesis continues through adulthood, while the oocyte supply is the finite one.`],
strat:`Compare oogenesis vs spermatogenesis: finite vs continuous. Two options mention declining fertility; only one has the right reason. Analyze-cues item on a reproduction concept.`,
pearl:`Female germ-cell supply is finite → fertility declines with age.`});

add({id:"R9",sec:"repro",type:"mcq",obj:[1],step:"Analyze Cues",np:"Implementation",topic:"Fertilization & implantation",
chart:[["Telephone Note","Client had unprotected intercourse 3 days ago around mid-cycle. Took a home pregnancy test today; it was negative. States, \"So I'm definitely not pregnant.\""]],
stem:`The nurse is speaking by telephone with a client who took a home pregnancy test 3 days after unprotected intercourse. The client states, "It was negative, so I'm definitely not pregnant." Which response by the nurse would be most helpful?`,
opts:[`"It's too early to tell. Implantation occurs about 6 to 10 days after fertilization, so a test now could miss it."`,`"Home tests detect hCG within about 24 hours of fertilization, so a negative result at 3 days is reliable."`,`"Fertilization takes place in the uterus within hours of sex, so hCG would already be detectable if you were pregnant."`,`"It's too early to test, and it's also past the window for emergency contraception, so retest after a missed period."`],
ans:0,
why:`Fertilization usually occurs in the fallopian tube; the blastocyst implants in the endometrium about 6–10 days after fertilization, and hCG is produced only after implantation. A test 3 days after intercourse is too early. (She is also still within the window for emergency contraception.)`,
best:`Applies implantation timing to the client's situation.`,
not:[``,`hCG is made by the trophoblast after implantation, not within 24 hours of fertilization.`,`Fertilization occurs in the fallopian tube, and implantation takes about 6 to 10 days.`,`The first half is right, but at 3 days (72 hours) she is still within the window for levonorgestrel, and ulipristal or a copper IUD works up to 5 days.`],
strat:`Sequence the events: ovulation → fertilization (tube) → morula ~day 3 → implantation 6–10 days → hCG. Check every clause of a partly correct option. Reproduction-concept item.`,
pearl:`Implantation = uterus, about 6–10 days after fertilization.`});

add({id:"R10",sec:"repro",type:"match",obj:[1],step:"Analyze Cues",np:"Analysis",topic:"Reproductive anatomy & physiology",
stem:`The nurse is reviewing findings for several clients seen in a reproductive health clinic. For each client finding, click to specify the structure where the underlying process or problem most likely occurs.`,
cols:["Ovary","Fallopian tube","Uterus","Testes / epididymis"],
rows:[[`Positive hCG at 7 weeks, one-sided pelvic pain, and no intrauterine sac; history of PID`,1,`Fertilization occurs in the ampulla of the tube; scarring from PID can trap the embryo there, causing an ectopic pregnancy.`],[`Sharp one-sided pelvic pain on day 14 of a regular 28-day cycle that resolves in a day`,0,`Mittelschmerz: the LH surge ruptures the ovarian follicle and releases the ovum at ovulation.`],[`Recurrent losses at 6 to 8 weeks; imaging shows a septum dividing the endometrial cavity`,2,`The blastocyst implants in the endometrium; a septum gives a poorly vascularized implantation site.`],[`Luteal phase of only 8 days with a low midluteal progesterone in a client trying to conceive`,0,`The corpus luteum forms in the ovary after ovulation and secretes progesterone; a short luteal phase reflects poor corpus luteum function.`],[`Low serum testosterone and decreased libido in a male client after radiation to the scrotum`,3,`Leydig (interstitial) cells of the testes produce testosterone.`],[`Normal sperm count but poor sperm motility in a male client who uses a hot tub nightly`,3,`Sperm are made in the testes and gain motility as they mature in the epididymis; scrotal heat impairs both.`]],
why:`Each finding points to the structure where a normal event happens: ovulation and corpus luteum function (ovary), fertilization (tube), implantation (uterus), and testosterone production and sperm maturation (testes/epididymis). Locating the event explains the problem: tubal scarring → ectopic pregnancy; uterine septum → failed implantation; short luteal phase → low progesterone; scrotal heat → poor motility.`,
best:`Linking each finding to the site of the normal event identifies where the problem lies.`,
strat:`For each row, ask which normal event the finding disrupts, then where that event happens. Judge each row on its own. Analyze-cues matrix.`,
pearl:`Tube = fertilization. Uterus = implantation. Ovary = ovulation + corpus luteum.`});

add({id:"R11",sec:"repro",type:"mcq",obj:[1,10],step:"Analyze Cues",np:"Implementation",topic:"Menstrual cycle & ovulation",
chart:[["Nurses' Notes","Client starting a combined oral contraceptive asks, \"How does this actually keep me from getting pregnant?\""]],
stem:`The nurse is providing teaching for a client who is starting a combined oral contraceptive. The client asks, "How does this actually keep me from getting pregnant?" Which explanation by the nurse is most complete?`,
opts:[`"It stops ovulation, thickens cervical mucus so sperm can't pass, and thins the uterine lining."`,`"It thickens cervical mucus so sperm can't pass; you may still ovulate, so timing sex still matters."`,`"It suppresses FSH and LH so that no egg is released; your mucus and uterine lining stay the same."`,`"It thins the uterine lining so an egg can't implant, and the monthly bleed shows that it worked."`],
ans:0,
why:`Combined hormonal contraception works in layers: suppresses ovulation (no LH surge), thickens cervical mucus, and alters the endometrium.`,
best:`Names all three mechanisms.`,
not:[``,`Mucus thickening is one mechanism (and the main one for some progestin-only pills), but a combined pill reliably suppresses ovulation.`,`Ovulation suppression is the primary mechanism, but the progestin also thickens mucus and thins the endometrium; stating they stay the same is inaccurate.`,`Endometrial change is only one layer, and the withdrawal bleed does not confirm effectiveness.`],
strat:`When asked WHY a hormonal method works, think in layers. "Most complete" means the option naming every mechanism. Reproduction-concept item.`,
pearl:`Hormonal methods: no ovulation + thick mucus + altered endometrium.`});

add({id:"R12",sec:"repro",type:"sata",fmt:"n",n:3,obj:[3],step:"Recognize Cues",np:"Assessment",topic:"Reproductive risk factors",
chart:[["Nurses' Notes","17-year-old client at a school-based clinic. Sexually active × 6 months with one partner; uses condoms \"if we remember.\" Reports drinking alcohol before sex \"most weekends.\" Lives 50 miles from the nearest clinic; no transportation. Regular 29-day cycles with mild cramping on day 1. Trains for varsity soccer 5 days a week. Takes a daily multivitamin with iron and folic acid."]],
stem:`The nurse is assessing a 17-year-old client at a school-based clinic. Select 3 findings that indicate the client is at greatest risk for reproductive health problems.`,
opts:[`Uses condoms "if we remember" with her partner`,`Drinks alcohol before sex most weekends`,`Lives 50 miles from a clinic, no transportation`,`Regular 29-day cycles with day-1 cramping`,`Trains for varsity soccer 5 days a week`,`Daily multivitamin with iron and folic acid`],
ans:[0,1,2],
why:`Adolescents are vulnerable when sex occurs without adequate knowledge or protection. Inconsistent barrier use (behavioral), alcohol use (psychosocial), and poor access to care (sociodemographic) all raise risk for unintended pregnancy and STIs.`,
best:`Each choice maps to a different risk category.`,
not:[`Correct: inconsistent barrier use (behavioral risk).`,`Correct: alcohol impairs decisions about protection (psychosocial risk).`,`Correct: access to care is a sociodemographic risk.`,`Regular cycles with mild day-1 cramping are normal; primary dysmenorrhea is common in adolescents.`,`Intense training can disrupt cycles, but her cycles are regular, so there is no cue of the female athlete triad.`,`Folic acid and iron are protective for a teen who could become pregnant.`],
strat:`"Select 3" tells you the number; choose the three with the most impact. Check the chart before flagging athletics: are the cycles actually affected? Recognize-cues item.`,
pearl:`Adolescents + no protection/knowledge = higher reproductive risk.`});

add({id:"R13",sec:"repro",type:"mcq",obj:[3,1],step:"Recognize Cues",np:"Assessment",topic:"Reproductive risk factors",
chart:[["Nurses' Notes","Couple requests a fertility evaluation and states, \"We've been trying to get pregnant, and it isn't happening.\" Female partner, 36, has regular 28-day cycles and a normal pelvic exam. Male partner, 37, works as a commercial welder; uses a hot tub nightly; applies agricultural pesticides on weekends."]],
stem:`The nurse is completing an intake assessment for a couple who report difficulty conceiving. To help establish a diagnosis of infertility, the nurse should ask the couple which question?`,
opts:[`"How long have you been having regular sex without using birth control?"`,`"How often does your partner use the hot tub, and how long does he stay in?"`,`"Has either of you ever had a pregnancy with a previous partner?"`,`"Do you use ovulation test kits to time sex for your most fertile days?"`],
ans:0,
why:`Infertility is defined by duration: no conception after 12 months of regular unprotected intercourse, or after 6 months when the female partner is 35 or older (ACOG/ASRM). At 36, this couple qualifies for evaluation after 6 months. Once duration is established, the history looks for causes, such as the male partner's heat and pesticide exposure, which can impair spermatogenesis.`,
best:`Duration of regular unprotected intercourse is what defines infertility.`,
not:[``,`Heat exposure may point to male-factor infertility, but it identifies a possible cause, not whether infertility is present.`,`Distinguishes primary from secondary infertility, but does not establish the diagnosis itself.`,`Timing can help conception, but the diagnosis rests on how long they have tried, not how sex is timed.`],
strat:`"Establish a diagnosis" asks for the defining criterion, not a cause or contributing factor. Note the female partner's age: 35 or older shortens the threshold to 6 months. Recognize-cues item.`,
pearl:`Infertility: no conception after 12 months of unprotected sex (6 months if the female partner is 35 or older).`});

add({id:"R14",sec:"repro",type:"sata",obj:[3],step:"Recognize Cues",np:"Assessment",topic:"Reproductive risk factors",
chart:[["History and Physical","38-year-old client planning pregnancy. Type 2 diabetes; A1C 8.9% (ref <5.7%). BMI 36. One prior pregnancy ended in stillbirth at 30 weeks. Takes lisinopril for hypertension."],["Social","Married; works from home as an accountant; nonsmoker; no alcohol. Lives near a hospital."]],
stem:`The nurse is assessing a 38-year-old client who is planning a pregnancy. Which findings indicate that the client is at increased reproductive risk? Select all that apply.`,
opts:[`Age of 38 at planned conception`,`A1C of 8.9% with type 2 diabetes`,`BMI of 36 (class II obesity)`,`Prior stillbirth at 30 weeks`,`Daily lisinopril for hypertension`,`Works from home as an accountant`,`Nonsmoker who avoids alcohol`],
ans:[0,1,2,3,4],
why:`Biophysical risks include age over 35, chronic disease (uncontrolled diabetes, hypertension), obesity, and prior pregnancy complications. Medications are an environmental exposure; ACE inhibitors such as lisinopril are teratogenic and need review before conception.`,
best:`All five need preconception follow-up.`,
not:[`Correct: age over 35.`,`Correct: poor glucose control raises anomaly and stillbirth risk.`,`Correct: obesity.`,`Correct: prior pregnancy complication.`,`Correct: ACE inhibitors are fetotoxic and need preconception review.`,`A desk job at home carries no specific reproductive exposure.`,`Avoiding tobacco and alcohol is protective, not a risk.`],
strat:`Some items need follow-up because of what they imply (a medication, a lab value). Recognize-cues item.`,
pearl:`Biophysical risks: chronic disease, obesity, age, prior pregnancy complications.`});

add({id:"R15",sec:"repro",type:"mcq",obj:[1],step:"Generate Solutions",np:"Implementation",topic:"Gametogenesis",
chart:[["Nurses' Notes","Client with three daughters is tearful at her 20-week ultrasound and says, \"Another girl. It's my fault I can't give him a son.\""]],
stem:`A client who has three daughters is tearful at her 20-week ultrasound. The client states, "Another girl. It's my fault I can't give him a son." Which response by the nurse would be most helpful?`,
opts:[`"This seems hard for you. The sperm carries the X or Y chromosome that sets the baby's sex, so it isn't your fault."`,`"This seems hard for you. Many parents feel this way at first, and what matters most is that the baby is healthy."`,`"This seems hard for you. The egg's chromosome sets the baby's sex, but which one you release is random, not your fault."`,`"The sperm's X or Y chromosome sets the sex. Would you like information on sex-selection options for a future pregnancy?"`],
ans:0,
why:`Oocytes carry an X chromosome; sperm carry X or Y, so the sperm determines chromosomal sex. The nurse acknowledges feelings and corrects the misconception.`,
best:`Therapeutic and accurate.`,
not:[``,`Acknowledges the feeling but minimizes it and leaves the self-blame uncorrected.`,`Therapeutic opening, but inaccurate: every oocyte carries an X chromosome.`,`Accurate physiology, but skips her feelings and shifts to a future pregnancy she did not ask about.`],
strat:`Two filters: therapeutic AND factually correct. Three options open the same way; read past the first sentence. Reproduction-concept item.`,
pearl:`Oocytes carry X; sperm carry X or Y.`});

/* ---------------- SEXUALITY (16) ---------------- */
add({id:"S9",sec:"sex",type:"mcq",obj:[2],step:"Generate Solutions",np:"Implementation",topic:"Concept of sexuality",
chart:[["Nurses' Notes","32-year-old client with a T10 spinal cord injury 6 months ago states, \"I guess that part of my life is over. My wife and I just don't touch anymore.\""]],
stem:`A nurse is caring for a 32-year-old client who had a T10 spinal cord injury 6 months ago. The client states, "I guess that part of my life is over. My wife and I just don't touch anymore." Which response by the nurse would be most helpful?`,
opts:[`"Sexuality is more than intercourse; it includes touch and closeness. What would you like intimacy to look like now?"`,`"Many men with a T10 injury can still have reflex erections. Would you like information on sexual function after an SCI?"`,`"Grieving these changes is common in the first year. Let's focus on your rehab goals for now and come back to this later."`,`"I can ask the provider about a medication for erectile function so that you and your wife can resume intercourse."`],
ans:0,
why:`Sexuality is a central aspect of being human across the lifespan: identity, intimacy, pleasure, connection, and reproduction. It does not end with disability. The nurse normalizes and explores.`,
best:`Broad definition + open exploration of the client's goals.`,
not:[``,`Accurate and possibly useful later, but it narrows sexuality to erectile function when his concern is lost closeness.`,`Validates grief but defers the concern the client raised now.`,`Jumps to a fix and assumes intercourse is the goal without assessing what he wants.`],
strat:`The best answer reflects sexuality as broader than intercourse and asks what matters to the client. Sexuality-concept item.`,
pearl:`Sexuality does not end with aging or disability.`});

add({id:"S10",sec:"sex",type:"match",obj:[2],step:"Generate Solutions",np:"Planning",topic:"Dimensions of sexuality",
stem:`The nurse is reviewing sexual health concerns reported by several clients. For each concern, click to specify the nursing approach that most directly addresses the source of the concern.`,
cols:["Biological: medication or disease review","Psychological: counseling","Relational: couples support","Cultural: accommodation"],
