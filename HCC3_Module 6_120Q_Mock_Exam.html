not:[`Correct.`,`Correct.`,`Correct.`,`The grace period extends only to 15 weeks; at 16 weeks pregnancy must be ruled out first.`,`Don't massage the DMPA site; it can speed absorption and shorten duration.`,`When she is late, backup is needed for 7 days after the injection.`],
strat:`Late injection = verify pregnancy status first. Take-action item.`,
pearl:`DMPA: every 3 months; verify pregnancy status if late.`});

add({id:"B30",sec:"bc",type:"mcq",obj:[10],step:"Evaluate Outcomes",np:"Evaluation",topic:"Implant",
chart:[["Nurses' Notes","1000: 22-year-old client had a single-rod etonogestrel implant placed in the inner nondominant upper arm. Pressure bandage in place; site dry. Client plans to rely on the implant for the next 3 years and has heard it \"messes up your periods.\""]],
stem:`A nurse is providing teaching for a client who had a contraceptive implant placed today. Which comment by the client indicates the client needs further instruction?`,
opts:[`"Irregular bleeding would mean the implant has stopped working for me."`,`"I should be able to feel the rod under my skin with my fingertips."`,`"I'll keep the pressure bandage on for 24 hours, then a small one for 3 to 5 days."`,`"I'll call if the insertion site gets red, warm, or starts draining."`],
ans:0,
why:`Irregular bleeding is common with the implant and doesn't mean it has failed (<1 pregnancy per 100). The other statements are correct.`,
best:`The only incorrect statement.`,
not:[``,`Correct: she should be able to palpate the rod.`,`Correct: pressure bandage for 24 hours, then a small bandage for 3 to 5 days.`,`Correct: signs of infection.`],
strat:`Know expected side effects so you don't mistake them for failure. Evaluate-outcomes item.`,
pearl:`Implant: irregular bleeding is common; feel the rod; no STI protection.`});

add({id:"B31",sec:"bc",type:"mcq",obj:[6,10],step:"Take Action",np:"Implementation",topic:"Sterilization",
chart:[["Nurses' Notes","Mother of a 32-year-old client with a mild intellectual disability requests tubal sterilization for her daughter \"so she won't get pregnant.\" Client is present and says, \"I don't know what that is.\""]],
stem:`The nurse is caring for a 32-year-old client with a mild intellectual disability whose mother requests tubal sterilization for her. Which action would be most appropriate for the nurse to take at this time?`,
opts:[`Explain the procedure to the client in plain language and explore her understanding and wishes.`,`Ask the mother for guardianship papers so she can sign the consent on her daughter's behalf.`,`Give the mother written information about tubal ligation to review together with her daughter at home.`,`Notify the provider that the family is requesting sterilization so it can be scheduled.`],
ans:0,
why:`Sterilization requires informed, voluntary consent and protection from pressure by family or clinicians. People with disabilities have a right to sexual health decisions; capacity and understanding must be assessed.`,
best:`Protects the client's autonomy by starting with her own understanding.`,
not:[``,`Bypasses the client's own informed consent; a guardian generally can't consent to sterilization without court review.`,`Routes the decision through the mother instead of the client.`,`Treats the family's request as the client's decision; the client's understanding and wishes come first.`],
strat:`Autonomy item: the client's understanding and choice come first. Ethics/legal item.`,
pearl:`Sterilization: informed, voluntary, no coercion; assess capacity.`});

add({id:"B32",sec:"bc",type:"sata",obj:[10],step:"Analyze Cues",np:"Assessment",topic:"IUD differences",
chart:[["Nurses' Notes","0900: 28-year-old client scheduled for copper IUD insertion today. LMP 5 weeks ago; cycles usually 28 days. Reports unprotected intercourse 3 weeks ago. Periods soak a pad every hour for the first 2 days, with severe cramping. Smokes ½ pack per day. Migraine with aura."],["Vital Signs","T 37.0 °C · HR 78 · BP 138/86 (124/80 one year ago)"],["Exam / Imaging","Mucopurulent cervical discharge noted on speculum exam; gonorrhea/chlamydia NAAT pending.\nPelvic ultrasound last year: 4-cm submucosal fibroid distorting the uterine cavity."]],
stem:`The nurse reviews the client's record before the scheduled insertion. Which findings should the nurse report to the provider before the copper IUD is inserted? Select all that apply.`,
opts:[`Last menstrual period 5 weeks ago with unprotected sex 3 weeks ago`,`Mucopurulent cervical discharge with NAAT results still pending`,`Heavy menstrual bleeding with severe cramping each cycle`,`A submucosal fibroid that distorts the uterine cavity`,`Migraine with aura and smoking ½ pack of cigarettes per day`,`Blood pressure of 138/86 mm Hg, up from 124/80 last year`],
ans:[0,1,2,3],
why:`Before a copper IUD, pregnancy and current cervical infection must be ruled out, and the uterine cavity must accommodate the device. A late period after unprotected sex means possible pregnancy. Mucopurulent discharge suggests cervicitis, which delays insertion. A cavity-distorting fibroid prevents proper placement. Copper often worsens heavy, painful periods, so her bleeding history changes counseling. Migraine with aura, smoking, and mild BP elevation are estrogen concerns and don't affect a nonhormonal IUD.`,
best:`These findings affect copper IUD safety, placement, or tolerance.`,
not:[`Correct: pregnancy must be ruled out before insertion.`,`Correct: purulent cervicitis is a reason to delay insertion until treated.`,`Correct: copper can worsen heavy bleeding and cramping; a hormonal option may suit her better.`,`Correct: a distorted uterine cavity prevents proper placement.`,`These are estrogen contraindications; they don't affect copper IUD eligibility.`,`Blood pressure matters for estrogen methods, not for a nonhormonal IUD.`],
strat:`Ask which findings make THIS method unsafe or a poor fit; set aside cues that matter only for estrogen. Analyze-cues item.`,
pearl:`Copper IUD: hormone-free, heavier bleeding, no STI protection.`});

add({id:"B33",sec:"bc",type:"case",sub:"cloze",obj:[10],step:"Generate Solutions",np:"Planning",topic:"Medication interactions",
record:[["History and Physical","24-year-old client with a seizure disorder; seizure-free × 2 years. Using a combined oral contraceptive × 1 year."],["Medications","Combined oral contraceptive daily\nPhenytoin 300 mg PO daily (started 3 weeks ago, replacing levetiracetam)"],["Nurses' Notes","Client reports breakthrough bleeding × 2 weeks. Had unprotected intercourse last week. Urine hCG negative today."]],
stem:`The nurse is caring for a client with a seizure disorder who takes a combined oral contraceptive. Complete the following sentence by choosing from the lists of options.`,
sentence:`The nurse should recommend {0} because {1}.`,
blanks:[
 {opts:[`discussing an IUD or DMPA with the provider and using condoms as backup now`,`taking each pill at exactly the same time daily until the spotting resolves`,`asking the provider to switch phenytoin back to levetiracetam`,`continuing the current pill, since spotting often settles within 3 months`],ans:0,not:[``,`Good general advice, but timing doesn't overcome an enzyme-inducing drug interaction.`,`Anticonvulsant choice is driven by seizure control; changing it to fit a contraceptive isn't the nurse's recommendation.`,`Early-use spotting settles, but she has used the pill for a year; the new bleeding started with phenytoin.`]},
 {opts:[`phenytoin can decrease oral contraceptive effectiveness`,`breakthrough bleeding is common in the first months of use`,`her negative hCG shows the pill is still working well`,`progestin-only pills are unaffected by phenytoin`],ans:0,not:[``,`True for new users, but she has used the pill for 1 year.`,`A negative test today doesn't rule out a pregnancy from last week or confirm efficacy.`,`Progestin-only pills are also affected by enzyme inducers.`]}],
why:`Enzyme-inducing anticonvulsants (phenytoin, carbamazepine, phenobarbital, primidone, oxcarbazepine, topiramate) can decrease oral contraceptive effectiveness. The new drug and breakthrough bleeding are cues. Methods unaffected by the interaction (IUD, DMPA) plus backup are appropriate.`,
best:`Fixes the interaction without touching the anticonvulsant.`,
strat:`Look in the Medications tab for what changed recently. Generate-solutions cloze.`,
pearl:`OC interactions: anticonvulsants, griseofulvin, rifampin/rifabutin, some protease inhibitors.`});

add({id:"B34",sec:"bc",type:"mcq",obj:[10],step:"Evaluate Outcomes",np:"Evaluation",topic:"Combined hormonal contraception",
chart:[["Nurses' Notes","24-year-old nonsmoker starting the contraceptive patch today, the first day of her menses. Works as a lifeguard and swims daily. BP 112/70; weight 68 kg."]],
stem:`The nurse is teaching a client who is starting the contraceptive patch today. Which statement indicates to the nurse that the client understands the treatment regimen?`,
opts:[`"I'll put on a new patch each week for 3 weeks, then go 1 week without one."`,`"If a patch falls off for 2 days, I'll put on a new one and skip backup."`,`"I'll put each new patch on the same spot on my lower abdomen every week so I remember."`,`"I'll place the patch on my breast, where the skin is smooth and clean."`],
ans:0,
why:`The patch is applied weekly for 3 weeks, typically with a patch-free fourth week. Check adhesion daily; apply to clean, dry skin, rotating sites, and avoid the breasts.`,
best:`Accurate schedule.`,
not:[``,`Detachment for more than 24 hours requires starting a new cycle and using backup for 7 days.`,`The lower abdomen is an acceptable site, but sites should be rotated to prevent irritation.`,`Avoid applying to the breasts.`],
strat:`Know each method's schedule: pill daily, patch weekly, ring 3 weeks in, DMPA every 3 months. Evaluate-outcomes item.`,
pearl:`Patch: weekly × 3, then patch-free week; estrogen → ACHES.`});

 or adnexal tenderness"], "ans": [0, 1, 3, 6], "not": ["Correct: inconsistent condom use is a key risk factor for STIs and unintended pregnancy.", "Correct: postcoital bleeding reflects an inflamed, friable cervix, a common sign of cervicitis.", "A reassuring negative; pelvic pain would raise concern for PID.", "Correct: a late period in a client with regular cycles requires a pregnancy test before treatment and contraception.", "Protective against HPV; does not require follow-up for this visit.", "Afebrile; does not require follow-up.", "Correct: a friable cervix that bleeds on contact is a hallmark of chlamydial or gonococcal cervicitis.", "Absence of cervical motion tenderness argues against PID; no follow-up needed.", "Absence of uterine or adnexal tenderness argues against PID; no follow-up needed."], "why": "Inconsistent condom use, postcoital spotting, and a friable cervix with mucopurulent discharge are classic cues of chlamydial cervicitis, which is often silent in young women. A period that is 6 weeks late in a client with regular cycles requires a pregnancy test before contraception and before choosing an antibiotic. Normal temperature, absent pelvic pain, and absent cervical motion tenderness argue against PID and do not need follow-up.", "best": "These four cues point to an STI and a possible pregnancy, both of which change the plan of care.", "strat": "Recognize Cues: scan the note for findings that are abnormal or that change the plan, and ignore reassuring negatives even if they are about the same body system.", "pearl": "CDC recommends annual chlamydia and gonorrhea screening for all sexually active women younger than 25."});

iagnosis."], ["Mucopurulent discharge with a friable cervix", 0, "Classic exam findings of cervicitis."], ["Urine hCG negative", 1, "Excludes pregnancy as the cause of the late period and spotting."], ["Wet mount: no clue cells or trichomonads", 1, "Argues against bacterial vaginosis and trichomoniasis."], ["No cervical motion, uterine, or adnexal tenderness", 1, "CDC minimum criteria for PID are not met."], ["Completed HPV vaccine series at age 12", 2, "Does not help diagnose or exclude this infection."]], "why": "The positive NAAT and the mucopurulent, friable cervix confirm chlamydial cervicitis. A negative hCG excludes pregnancy as the cause of the late period, a normal wet mount and pH argue against bacterial vaginosis and trichomoniasis, and the absence of cervical motion, uterine, or adnexal tenderness means CDC minimum criteria for PID are not met. HPV vaccination status does not help diagnose this infection.", "best": "Sorting each cue by what it proves or excludes shows the diagnosis is uncomplicated chlamydial cervicitis.", "strat": "Analyze Cues: link each finding to a hypothesis, including findings that rule other conditions out.", "pearl": "NAAT is the most sensitive test for chlamydia; a vaginal swab is the preferred specimen for women."});

 mg IM once for the chlamydia", "Abstain until the course is done and partner treated", "Expedited partner therapy for her partner of 2 months", "Test of cure with a repeat NAAT in 2 weeks", "Repeat chlamydia testing in about 3 months", "Delay oral contraceptives until infection clears", "Condom use with every act of intercourse"], "ans": [0, 2, 3, 5, 7], "not": ["Correct: CDC first-line regimen for nonpregnant adults.", "Ceftriaxone treats gonorrhea; the gonorrhea NAAT is negative.", "Correct: prevents reinfection and transmission.", "Correct: partners from the past 60 days should be treated; EPT is used where legal.", "Not routine outside pregnancy; NAAT may stay positive from dead organisms for up to 3 weeks.", "Correct: reinfection is common, so retest at about 3 months.", "Chlamydia without PID is not a contraindication to starting a combined pill.", "Correct: the pill does not prevent STIs; dual protection is recommended."], "why": "For a nonpregnant client, CDC recommends doxycycline 100 mg orally twice daily for 7 days. The client should abstain until the 7-day course is finished, symptoms resolve, and partners are treated; EPT for partners from the last 60 days is appropriate where legal; and retesting at about 3 months detects frequent reinfection. Ceftriaxone treats gonorrhea, not chlamydia; a 2-week test of cure is not needed outside pregnancy; and chlamydia is not a reason to delay combined oral contraceptives (US MEC category 1).", "best": "These options reflect the full CDC regimen: correct drug, abstinence, partner treatment, and retesting.", "strat": "Generate Solutions: build the plan from the confirmed diagnosis and the client's status (not pregnant), and screen out regimens meant for other infections.", "pearl": "Test of cure is not routine for chlamydia except in pregnancy; retest everyone about 3 months after treatment."});

etal compromise.", "Not related to this condition."], "why": "Fever, chills, headache, myalgia, and a brighter rash within 24 hours of treating early syphilis is the Jarisch-Herxheimer reaction, caused by cytokines released as spirochetes die. In the second half of pregnancy it can trigger contractions and fetal tachycardia, so the nurse gives the prescribed antipyretic, notifies the obstetric provider, and monitors maternal temperature plus FHR and uterine activity. Anaphylaxis would occur within minutes with airway or skin findings, which are absent.", "best": "Treating the fever and escalating the contractions and fetal tachycardia protects both the client and the fetus.", "strat": "Take Action: identify the condition from the timing and cluster of findings, then choose actions and monitors that address both maternal and fetal effects.", "pearl": "The Jarisch-Herxheimer reaction is not a penicillin allergy: do not stop treatment or label the client allergic."});

BANK.push({"id": "UC-HV6", "sec": "sti", "type": "case", "sub": "matrix", "uc": "HV", "ucn": "HIV: 26-year-old client at 12 weeks' gestation", "uci": 6, "step": "Evaluate Outcomes", "np": "Evaluation", "topic": "HIV", "obj": [9, 6, 8], "record": [["Nurses' Notes", "0900: 26-year-old G2P1 at 12 weeks' gestation for first prenatal visit. Reports fatigue, nausea each morning that improves by noon, breast tenderness and fullness, and urinary frequency without dysuria. Also reports unintended 4.5-kg weight loss in 3 months and night sweats for 1 month. Oral exam: white plaques on tongue that scrape off. Palpation: enlarged cervical and axillary nodes. States her partner of 3 years injects drugs; she denies drug use herself. Screened for intimate partner violence privately: denies. Fetal heart rate 158/min by Doppler. Nurse explained that HIV, syphilis, and hepatitis B testing are part of the routine prenatal panel unless she declines; client agreed to testing.\nDay 3: Returns to clinic for results at 13 weeks. Provider disclosed HIV diagnosis in a private room. Client cries and says, \"I can't tell him yet. He'll leave me. I'm scared to take pills that could hurt the baby.\"\nDay 3: Client agrees to start treatment today. Requests that no one at her job or in her family be told.\nWeek 20: Viral load 2,100 copies/mL. Taking ART daily.\nWeek 36: Partner left 6 weeks ago. Client tearful, reports missing ART doses \"most days\" for about 2 weeks before restarting. Viral load at 36 weeks 1,450 copies/mL. Plans formula feeding. Not in labor; membranes intact.\nWeek 38: Cesarean birth after 3 hours of IV zidovudine. Newborn started on presumptive HIV therapy.\nPostpartum week 6: Viral load undetectable (less than 50 copies/mL). CD4 410 cells/mm3. Uses a pillbox and phone alarm; reports no missed doses. States, \"When formula runs out at night, I sometimes breastfeed.\" New partner tested HIV-negative 4 weeks ago and was referred for PrEP but has not started it. Reports low mood and has stopped attending her support group."], ["Vital Signs", "|Time|T|HR|RR|BP|SpO2|Wt\n|0900|37.2 °C|88|16|108/68|99%|56 kg\n|Week 36|36.9 °C|84|16|112/70|99%|68 kg"], ["Laboratory Results", "|Test|Result|Reference\n|HIV-1/2 antigen/antibody immunoassay|Reactive|Nonreactive\n|HIV-1/HIV-2 antibody differentiation assay|HIV-1 positive|Negative\n|HIV-1 RNA viral load|85,000 copies/mL|Undetectable\n|CD4 count|180 cells/mm3|500 to 1,500\n|HIV genotype resistance|Pending|\n|HBsAg|Negative|Negative\n|RPR|Nonreactive|Nonreactive\n|Hemoglobin|10.8 g/dL|11 to 16\n|Viral load, week 20|2,100 copies/mL|Undetectable\n|Viral load, week 36|1,450 copies/mL|Undetectable\n|CD4, week 36|310 cells/mm3|500 to 1,500\n|Infant HIV NAT, 14 days|Not detected|Not detected\n|Viral load, postpartum week 6|Less than 50 copies/mL|Undetectable\n|CD4, postpartum week 6|410 cells/mm3|500 to 1,500"], ["Provider Orders", "Day 3: Dolutegravir 50 mg PO daily plus tenofovir disoproxil fumarate/emtricitabine 1 tablet PO daily, start today.\nTrimethoprim-sulfamethoxazole DS 1 tablet PO daily.\nReport to state health department; refer to partner services.\nViral load in 2 to 4 weeks, then monthly until undetectable, then every 3 months; viral load at 34 to 36 weeks.\nReferral to HIV case manager and support group.\nWeek 36: Scheduled cesarean birth at 38 weeks. Zidovudine IV loading dose 2 mg/kg over 1 hour, then 1 mg/kg/hr, starting 3 hours before surgery. Continue oral ART without interruption. Newborn presumptive HIV therapy per pediatric HIV consultant. Formula feeding."]], "scene": "Six weeks after a cesarean birth, the client returns to the clinic.", "stem": "For each finding, click to specify whether it indicates the client's condition has improved, has not changed, or has declined.", "why": "An undetectable viral load and a rising CD4 count show that ART is working. Occasional breastfeeding is a decline because US guidance recommends formula when viral suppression is not sustained, and mixed feeding carries higher transmission risk. A partner referred for PrEP who has not started it is unchanged, and low mood with withdrawal from support is a decline that needs depression screening and case management.", "best": "Each row is judged against the 36-week baseline and the feeding plan.", "strat": "Evaluate Outcomes: lab values, behaviors, and psychosocial findings can each improve or decline independently.", "pearl": "US guidance recommends formula feeding for people with HIV; 2023 updates allow supported breastfeeding only with sustained viral suppression after shared decision-making.", "cols": ["Improved", "No change", "Declined"], "rows": [["Viral load less than 50 copies/mL", 0, "Down from 1,450 copies/mL at 36 weeks."], ["CD4 count 410 cells/mm3", 0, "Up from 310 at 36 weeks and 180 at diagnosis."], ["Breastfeeds at night when formula runs out", 2, "Deviates from the formula feeding plan and exposes the infant."], ["HIV-negative partner referred but not started on PrEP", 1, "Referral made, but no protective action yet."], ["Low mood and stopped attending support group", 2, "New psychosocial decline that threatens adherence."]]});

BANK.push({"id": "UC-HB6", "sec": "sti", "type": "case", "sub": "matrix", "uc": "HB", "ucn": "Hepatitis B: 27-year-old at first prenatal visit", "uci": 6, "step": "Evaluate Outcomes", "np": "Evaluation", "topic": "Hepatitis B", "obj": [9, 6], "record": [["Nurses' Notes", "0915: 27-year-old G2P1 at 10 weeks gestation presents for first prenatal visit. Born in Vietnam; moved to the United States at age 15. Reports no record of hepatitis B vaccination. Mother died of liver cancer at 52. Reports mild nausea in the mornings. Lives with husband and 3-year-old son; husband not tested for hepatitis B. Son's immunization record is not available (born at another facility). Denies alcohol, tobacco, or drug use. Sclera anicteric, abdomen nontender. Prenatal panel drawn at pregnancy confirmation visit 1 week ago reviewed with client.\n0940: Provider notified of reactive HBsAg. Hepatitis B panel, HBV DNA, and hepatic function panel drawn. Client informed results will be discussed at next visit.\nDay 5: Results reviewed by provider. Client called back to clinic.\nDay 5, 1015: Results reviewed with client in her preferred language. Client asks, \"Can I give this to my baby?\" Client tearful; states she did not know she had hepatitis.\nDay 5, 1030: Referred to hepatology. Perinatal Hepatitis B Prevention Program case report submitted to health department per state requirement.\n26 weeks: Seen by hepatology. Client asks about breastfeeding and whether she will need a cesarean birth. Husband and son attend visit; neither has been tested.\n28 wk: Tenofovir disoproxil fumarate started. Husband and son tested (results pending); husband started hepatitis B vaccine.\n39 wk, 0412: Spontaneous vaginal birth of a male newborn. Apgar 8 and 9. Client plans to breastfeed.\n0450: Newborn skin-to-skin with mother; first bath given to remove maternal blood and secretions.\n0505: HBIG given IM right thigh and hepatitis B vaccine given IM left thigh.\n6 wk postpartum: Client and infant seen together. BANK.push({"id": "UC-HC1", "sec": "sti", "type": "case", "sub": "sata", "uc": "HC", "ucn": "Hepatitis C: 29-year-old with injection drug use", "uci": 1, "step": "Recognize Cues", "np": "Assessment", "topic": "Hepatitis C", "obj": [7, 8, 4], "record": [["Nurses' Notes", "1030: 29-year-old male presents to community health clinic requesting STI testing. Sexual history obtained privately: one female partner for 2 years, condoms used sometimes. Reports injecting heroin for 4 years; states he shares syringes \"when I run out.\" Received a tattoo from a friend at home last year. No record of hepatitis A or B vaccination. Reports 1 to 2 beers per month. Reports mild fatigue. Sclera anicteric, no abdominal tenderness, no spider angiomas.\n1100: Point-of-care tests completed."], ["Vital Signs", "|Time|T|HR|RR|BP|SpO2\n|1030|36.9 °C|78|16|122/76|98%"], ["Laboratory Results", "Point-of-care (1100):\n|Test|Result\n|Rapid HCV antibody|Reactive\n|Rapid HIV-1/2 Ag/Ab|Nonreactive\n|Urine NAAT chlamydia/gonorrhea|Pending\n|RPR|Pending"]], "scene": "A client comes to a community health clinic requesting STI testing. The nurse completes the intake and point-of-care tests.", "stem": "Which findings require follow-up by the nurse? Select all that apply.", "opts": ["Shares syringes when his supply runs out", "Temperature 36.9 °C and BP 122/76", "Received a tattoo from a friend at home", "Reports 1 to 2 beers per month", "Reactive rapid HCV antibody test", "No record of hepatitis A or B vaccines", "Sclera anicteric, abdomen nontender"], "ans": [0, 2, 4, 5], "not": ["Correct: shared syringes are the most efficient route of HCV transmission.", "Normal vital signs.", "Correct: tattoos done with unsterile equipment outside licensed settings can transmit HCV.", "Minimal alcohol use; still teach avoidance if HCV is confirmed, but no immediate follow-up.", "Correct: a reactive antibody must be followed by HCV RNA testing.", "Correct: hepatitis A and B vaccination is recommended for people who inject drugs and those with HCV.", "Normal findings; chronic HCV is usually silent."], "why": "Sharing injection equipment and unregulated tattooing are the major bloodborne routes for hepatitis C, and a reactive HCV antibody needs confirmation. People who inject drugs should be vaccinated against hepatitis A and B, which would be especially dangerous with HCV liver disease. The client's vital signs, minimal alcohol use, and normal abdominal examination do not require follow-up.", "best": "Each selected finding is either a transmission risk, an abnormal result, or a gap in prevention.", "strat": "Recognize Cues: in an STI intake, look beyond sexual risk to bloodborne risks such as shared needles and home tattoos.", "pearl": "CDC recommends one-time HCV screening for all adults and regular testing for people who inject drugs."});

t's findings, which complication is the priority for the nurse to address at this time?", "opts": ["Hepatic encephalopathy related to rising ammonia", "Fulminant hepatic failure within the next month", "Sexual transmission of HCV to the client's partner", "Spread of HCV through shared injection equipment"], "ans": 3, "not": ["No confusion is reported and liver synthetic function is normal.", "Fulminant failure from HCV is rare, and his INR, bilirubin, and albumin are normal.", "Sexual transmission is possible but much less efficient than sharing syringes and cookers.", ""], "why": "The client has confirmed HCV and continues to share syringes and cookers with an untested partner, so ongoing transmission (and reinfection after treatment) is the most likely harm. His albumin, bilirubin, INR, and platelets are normal and he has no confusion, which makes encephalopathy and liver failure unsupported. Sexual transmission of HCV is uncommon between monogamous heterosexual partners compared with shared injection equipment.", "best": "The client's own words describe an active, efficient route of transmission happening now.", "strat": "Prioritize Hypotheses: rank the problem with the strongest current evidence above serious problems with no supporting cues.", "pearl": "HCV can survive on syringes and drug preparation equipment for days, which is why cookers, cotton, and water must not be shared either."});

n, and transmission.", "strat": "Generate Solutions: watch for outdated or stigmatizing practices; nonjudgmental, evidence-based care treats active drug use as a reason for harm reduction, not denial of treatment.", "pearl": "Direct-acting antivirals cure more than 95% of people in 8 to 12 weeks of oral therapy."});

.0 °C or higher, status unknown", 0, "Fever with unknown status is an indication; suspected infection needs broader therapy."], ["GBS bacteriuria at any time during this pregnancy", 0, "Bacteriuria indicates heavy colonization and always warrants prophylaxis."], ["Planned cesarean before labor with intact membranes", 1, "Without labor or rupture, transmission risk is very low."]], "why": "Prophylaxis is given to clients with a positive GBS culture, GBS bacteriuria in the current pregnancy, or a previous infant with GBS disease, and to clients with unknown status who have preterm labor, ROM of 18 hours or more, or intrapartum fever. A negative culture collected at 36 to 37 weeks in this pregnancy means no prophylaxis. A planned cesarean before labor with intact membranes does not require prophylaxis regardless of GBS status.", "best": "Indications are either known colonization or unknown status combined with a specific risk factor.", "strat": "Analyze Cues: sort findings by rule; the key words are current pregnancy, unknown status, and intact membranes.", "pearl": "GBS bacteriuria at any count during pregnancy means heavy colonization, so prophylaxis is given without repeating the culture."});

ses shivering and is not first-line for intrapartum fever."], "mons": ["Maternal temperature every 1 hour", "Deep tendon reflexes every 1 hour", "Fetal heart rate baseline and variability", "Fundal height every 2 hours", "Capillary blood glucose every 2 hours"], "monAns": [0, 2], "monNot": ["Correct: a falling temperature shows response to antipyretic and antibiotics.", "Reflexes are monitored with magnesium sulfate, which is not ordered.", "Correct: return of the FHR baseline to 110 to 160 with improved variability shows fetal response.", "Fundal height is not measured during active labor.", "There is no diabetes or hypoglycemia risk documented."], "why": "Maternal fever of 38.4 °C with fetal tachycardia, maternal tachycardia, uterine tenderness, foul cloudy fluid, and leukocytosis after prolonged rupture indicates intraamniotic infection. GBS prophylaxis alone is not adequate treatment; broad-spectrum therapy is needed, and for a low-risk penicillin allergy ACOG lists cefazolin plus gentamicin. Acetaminophen treats fever, which also reduces fetal tachycardia and newborn risk. Maternal temperature and fetal heart rate show whether treatment is working; intraamniotic infection alone is not an indication for cesarean birth.", "best": "The cluster of fever, fetal tachycardia, and purulent fluid defines intraamniotic infection, which needs broader antibiotics and antipyretics.", "strat": "Take Action: when findings change, re-identify the condition before choosing actions; the original plan (GBS prophylaxis) may no longer be enough.", "pearl": "Intraamniotic infection is treated with antibiotics and acetaminophen during labor and is not by itself an indication for cesarean birth."});

fter 24 hours is common and is not a measure of sepsis.", "Correct: a normal respiratory rate without grunting shows no respiratory distress.", "This shows prophylaxis was adequate (4 hours or more) but is not a newborn outcome.", "Correct: effective feeding is a sign of wellness; poor feeding is an early sepsis sign.", "Up to 7% to 10% weight loss is expected and is not related to infection."], "why": "Signs of early-onset sepsis include temperature instability, tachypnea, grunting, poor feeding, and lethargy, so a stable temperature, a normal respiratory rate without distress, effective feeding, and a negative blood culture at 36 hours all indicate the newborn is doing well. Mild facial jaundice after 24 hours and a 4% weight loss are normal newborn findings but do not reflect infection status. The timing of the mother's cefazolin describes prophylaxis adequacy, not the newborn's outcome.", "best": "Only newborn findings that would be abnormal in sepsis, and are now normal, demonstrate the desired outcome.", "strat": "Evaluate Outcomes: select findings that measure the stated goal (no sepsis); true but unrelated findings are distractors.", "pearl": "Most early-onset GBS disease appears within 24 to 48 hours of birth, and respiratory distress is the most common first sign."});

ssic presentation of trichomoniasis and must be evaluated.", "Correct: Dysuria is a common symptom of trichomoniasis because the organism also infects the urethra.", "Correct: Dyspareunia reflects vaginal and vulvar inflammation and requires evaluation.", "Denying bleeding is an expected, reassuring finding at 20 weeks; it does not require follow-up.", "Active fetal movement at 20 weeks is reassuring and expected.", "Correct: Inconsistent condom use is a modifiable STI risk factor that requires counseling.", "Correct: Punctate cervical hemorrhages (\"strawberry cervix\") are highly suggestive of trichomoniasis.", "Fundal height in centimeters approximates gestational age between 20 and 36 weeks; 20 cm is expected.", "A fetal heart rate of 110 to 160/min is normal; 148/min is reassuring."], "why": "Trichomoniasis classically causes frothy yellow-green malodorous discharge, vulvar irritation, dysuria, dyspareunia, and sometimes a strawberry cervix. Inconsistent condom use is a risk factor that requires education. The fetal findings, fundal height, and absence of bleeding are expected for 20 weeks and are reassuring.", "best": "These five findings point to an active vaginal infection plus a modifiable risk behavior, while the obstetric findings are normal.", "strat": "Recognize Cues: sort each finding as expected or unexpected for this client at this gestational age before deciding what needs follow-up.", "pearl": "Many people with trichomoniasis, especially men, are asymptomatic, so a partner with \"no symptoms\" can still be infected."});

  S.phase = "entrance"; header();
  var counts = ZONES.map(function(z){ return BANK.filter(z.test).length; });
  var objCounts = {}; BASE.forEach(function(q){ q.obj.forEach(function(o){ objCounts[o] = (objCounts[o] || 0) + 1; }); });
  var resumable = saved && saved.phase === "exam" && !saved.done;
  $("#app").innerHTML =
  '<section class="card fade"><div class="hero">' +
   '' +
   '<div class="eye">Healthcare of the Client III · Module 6</div>' +
   '<h1>Module 6 Mock Exam</h1>' +
   '<p>A bank of ' + BASE.length + ' NGN-style questions on reproduction, sexuality, STIs, and contraception, plus ' + UCASES.length + ' STI unfolding case studies (' + (BANK.length - BASE.length) + ' items): client records, highlight, matrix, drop-down cloze, bowtie, and unfolding cases. Questions are grouped by content area, followed by a detailed results report.</p>' +
   '<div class="think"><span>What cues matter?</span><em>→</em><span>Priority problem?</span><em>→</em><span>What makes it dangerous?</span><em>→</em><span>What changes with pregnancy, meds, risk?</span><em>→</em><span>What first?</span><em>→</em><span>How do I know it worked?</span></div>' +
  '</div>' +
  '<div class="zones">' + ZONES.map(function(z, i){ return '<div class="zone"><svg aria-hidden="true"><use href="#' + z.icon + '"/></svg><b>' + z.name + '</b><small>' + counts[i] + ' in the bank</small></div>'; }).join("") +
   '<div class="zone"><svg aria-hidden="true"><use href="#g-key"/></svg><b>Results</b><small>Score report & review</small></div></div>' +
  '<div class="setup">' +
   '<div><span class="lbl">Mode</span><div class="toggle" id="modeT"><button data-m="study" aria-pressed="' + (S.mode === "study") + '">Study mode</button><button data-m="exam" aria-pressed="' + (S.mode === "exam") + '">Exam mode</button></div>' +
   '<p class="note" style="margin-top:.5rem" id="modeNote"></p></div>' +
   '<div><span class="lbl">Exam length</span><div class="toggle" id="lenT">' + [[120,"Full 120"],[60,"Balanced 60"],[30,"Quick 30"],[-1,"STI Cases"]].map(function(x){ return '<button data-l="' + x[0] + '" aria-pressed="' + (S.len === x[0] && !S.focus && !S.ucf) + '">' + x[1] + '</button>'; }).join("") + '</div>' +
   '<p class="note" style="margin-top:.5rem">60 and 30 are drawn in proportion to every course objective. STI Cases runs all ' + UCASES.length + ' unfolding case studies (6 items each, in order).</p>' +
   '<label class="lbl" for="focusSel" style="margin-top:.8rem">Or practice one objective</label><select id="focusSel" class="passin" style="width:100%"><option value="0">All objectives</option>' +
   Object.keys(OBJ).map(function(k){ return '<option value="' + k + '"' + (+S.focus === +k ? " selected" : "") + '>' + k + '. ' + esc(OBJ[k]) + ' (' + objCounts[k] + ' questions)</option>'; }).join("") + '</select>' +
   '<label class="lbl" for="ucSel" style="margin-top:.8rem">Or work one STI unfolding case</label><select id="ucSel" class="passin" style="width:100%"><option value="">Choose a case</option>' + UCASES.map(function(c){ return '<option value="' + c.code + '"' + (S.ucf === c.code ? " selected" : "") + '>' + esc(c.name) + ' (6 items)</option>'; }).join("") + '</select></div>' +
   '<div><span class="lbl">Scoring</span><p class="note">1 point per question. SATA, matching, and bowtie are all-or-nothing, like most NCLEX-style scoring in nursing programs. Answers and options are reshuffled every attempt.</p>' +
   '<p class="note" style="margin-top:.5rem"><label for="passIn">Passing benchmark</label> <input class="passin" id="passIn" type="number" min="50" max="100" value="' + S.pass + '">% <span style="color:var(--dim)">(set to your program\'s)</span></p></div>' +
  '</div>' +
  '<div class="actions" style="justify-content:center;margin-top:1.4rem">' +
   (resumable ? '<button class="btn pur" id="resumeBtn">Resume attempt (Q ' + (saved.cur + 1) + ')</button>' : '') +
   '<button class="btn go" id="startBtn"><svg class="i" aria-hidden="true"><use href="#g-door"/></svg>Start exam</button></div>' +
  '</section>';
  function note(){ $("#modeNote").textContent = S.mode === "study" ? "Submit each answer to see the correct answer, rationale, NGN test strategy, and high-yield pearl right away." : "No feedback until you submit the whole exam. Your score and every rationale appear at the end."; }
  note();
  document.querySelectorAll("#modeT button").forEach(function(b){ b.onclick = function(){ S.mode = b.dataset.m; document.querySelectorAll("#modeT button").forEach(function(x){ x.setAttribute("aria-pressed", x === b); }); note(); }; });
  document.querySelectorAll("#lenT button").forEach(function(b){ b.onclick = function(){ S.len = +b.dataset.l; S.focus = 0; S.ucf = ""; $("#focusSel").value = "0"; $("#ucSel").value = ""; document.querySelectorAll("#lenT button").forEach(function(x){ x.setAttribute("aria-pressed", x === b); }); }; });
  $("#focusSel").onchange = function(){ S.focus = +this.value; S.ucf = ""; $("#ucSel").value = ""; if (S.len === -1) S.len = 120; document.querySelectorAll("#lenT button").forEach(function(x){ x.setAttribute("aria-pressed", !S.focus && +x.dataset.l === S.len); }); };
  $("#ucSel").onchange = function(){ S.ucf = this.value; if (S.ucf) { S.focus = 0; $("#focusSel").value = "0"; } document.querySelectorAll("#lenT button").forEach(function(x){ x.setAttribute("aria-pressed", !S.ucf && !S.focus && +x.dataset.l === S.len); }); };
  $("#passIn").onchange = function(){ var v = parseInt(this.value, 10); if (v >= 50 && v <= 100) S.pass = v; else this.value = S.pass; };
  $("#startBtn").onclick = function(){ newAttempt(); saved = null; render(); };
  if (resumable) $("#resumeBtn").onclick = function(){ var m = S.mode, p = S.pass; S = saved; saved = null; render(); };
}

/* ----- question view ----- */
function tabBody(text){
  var lines = String(text).split("\n"), out = "", tbl = [];
  function flush(){ if (!tbl.length) return; out += '<div class="rtw"><table class="rt"><thead><tr>' + tbl[0].map(function(c){ return '<th>' + esc(c) + '</th>'; }).join("") + '</tr></thead><tbody>' +
    tbl.slice(1).map(function(r){ return '<tr>' + r.map(function(c){ return '<td>' + esc(c) + '</td>'; }).join("") + '</tr>'; }).join("") + '</tbody></table></div>'; tbl = []; }
  lines.forEach(function(l){ if (l.charAt(0) === "|") tbl.push(l.slice(1).split("|")); else { flush(); out += '<p class="rl">' + esc(l).replace(/^(\d{4}:|(?:Day|Week|Month) \d+(?:, \d{4})?:)/, '<b>$1</b>') + '</p>'; } });
  flush(); return out;
}
function recordHTML(tabs){
  return '<div class="record"><div class="rhead">Client medical record</div><div class="rtabs" role="tablist">' +
    tabs.map(function(t, i){ return '<button role="tab" data-tab="' + i + '" aria-selected="' + (i === 0) + '">' + esc(t[0]) + '</button>'; }).join("") +
    '</div><div class="rbody" id="rbody">' + tabBody(tabs[0][1]) + '</div></div>';
}
function typeLabel(q){
  if (q.type === "case") return "NGN case · " + ({mcq:"Multiple choice", sata:(q.fmt === "hl" ? "Highlight" : q.fmt === "n" ? "Select " + q.n : "Multiple response"), matrix:"Matrix", cloze:"Drop-down cloze", bowtie:"Bowtie"})[q.sub];
  if (q.type === "sata") return q.fmt === "hl" ? "Highlight" : q.fmt === "n" ? "Multiple response · Select " + q.n : "Multiple response · SATA";
  return ({mcq:"Multiple choice", match:"Matrix (matching)", bowtie:"Bowtie"})[q.type];
}
function mark(fb, isA, on, multi){
  if (!fb) return "";
  if (isA && on) return " right"; if (on) return " wrong"; if (isA) return multi ? " missed" : " right"; return "";
}
function qHTML(id, ro){
  var q = BY[id], p = S.perm[id], r = S.resp[id], fb = showFeedback(id), z = zoneOf(q), k = kind(q);
  var h = '<div class="qtop"><span class="zone-tag"><svg class="i" aria-hidden="true"><use href="#' + z.icon + '"/></svg>' + z.name + '</span>' +
    '<span class="tag">' + esc(typeLabel(q)) + '</span>' + (S.flags[id] ? '<span class="tag o">Flagged</span>' : '') +
    '<span class="qnum">' + (S.order.indexOf(id) + 1) + ' / ' + S.order.length + '</span></div>';
  if (q.uc) h += '<div class="ucban"><div class="uct"><b>Unfolding case · ' + esc(q.ucn) + '</b><span>Item ' + q.uci + ' of 6 · ' + esc(q.step) + '</span></div><div class="ucsteps">' + STEPS.map(function(s, i){ return '<i class="' + (i + 1 < q.uci ? "d" : i + 1 === q.uci ? "c" : "") + '" title="' + esc(s) + '"></i>'; }).join("") + '</div>' + (q.scene ? '<p class="ucscene">' + esc(q.scene) + '</p>' : '') + '</div>' + recordHTML(q.record);
  else if (q.type === "case") h += '<p class="stem">The nurse is caring for the client described in the medical record. Review every tab before answering.</p>' + recordHTML(q.record);
  else if (q.chart) h += recordHTML(q.chart);
  if (k === "cloze") {
    r = r || {};
    var sent = esc(q.sentence).replace(/\{(\d)\}/g, function(_, n){ n = +n; var b = q.blanks[n], cls = "";
      if (fb) cls = r[n] === b.ans ? " right" : " wrong";
      return '<select class="cz' + cls + '" data-blank="' + n + '" aria-label="Drop-down ' + (n + 1) + '"' + (ro ? " disabled" : "") + '><option value="">Select…</option>' +
        p.blanks[n].map(function(oi){ return '<option value="' + oi + '"' + (r[n] === oi ? " selected" : "") + '>' + esc(b.opts[oi]) + '</option>'; }).join("") + '</select>'; });
    h += '<p class="prompt">' + esc(q.stem) + '</p><p class="cloze">' + sent + '</p>';
  } else {
    h += '<p class="prompt">' + esc(q.stem) + '</p>';
  }
  if (k === "mcq") {
    h += '<p class="hint">Choose the one best answer.</p><div class="opts">' + p.opts.map(function(oi, d){
      var on = r === oi;
      return '<button class="opt' + mark(fb, q.ans === oi, on, false) + '" data-o="' + oi + '" aria-pressed="' + on + '"' + (ro ? " disabled" : "") + '><span class="k">' + L[d] + '</span><span>' + esc(q.opts[oi]) + '</span></button>';
    }).join("") + '</div>';
  } else if (k === "sata" && q.fmt === "hl") {
    var sel = r || [];
    h += '<p class="hint">Click each phrase to highlight it; click again to remove. Scored all-or-nothing.</p><div class="hlnote">' + q.note.map(function(part){
      if (typeof part === "number") { var on = sel.indexOf(part) > -1;
        return '<button class="hl' + mark(fb, q.ans.indexOf(part) > -1, on, true) + '" data-o="' + part + '" aria-pressed="' + on + '"' + (ro ? " disabled" : "") + '>' + esc(q.opts[part]) + '</button>'; }
      return esc(part);
    }).join("") + '</div>';
  } else if (k === "sata") {
    var s2 = r || [];
    h += '<p class="hint">' + (q.fmt === "n" ? "Select exactly " + q.n + "." : "Select all that apply.") + ' Scored all-or-nothing.</p><div class="opts">' + p.opts.map(function(oi, d){
      var on = s2.indexOf(oi) > -1;
      return '<button class="opt sata' + mark(fb, q.ans.indexOf(oi) > -1, on, true) + '" data-o="' + oi + '" aria-pressed="' + on + '"' + (ro ? " disabled" : "") + '><span class="k">' + L[d] + '</span><span>' + esc(q.opts[oi]) + '</span></button>';
    }).join("") + '</div>';
  } else if (k === "matrix") {
    r = r || {};
    h += '<p class="hint">Select one option in each row. All rows must be correct for the point.</p><div class="rtw"><table class="mx"><thead><tr><th scope="col">' + (q.type === "case" ? "Finding / intervention" : "Item") + '</th>' + q.cols.map(function(c){ return '<th scope="col">' + esc(c) + '</th>'; }).join("") + '</tr></thead><tbody>' +
      p.rows.map(function(ri){ var row = q.rows[ri];
        return '<tr' + (fb ? ' class="' + (r[ri] === row[1] ? "right" : "wrong") + '"' : '') + '><th scope="row">' + esc(row[0]) + (fb && r[ri] !== row[1] ? '<span class="fix">Correct: ' + esc(q.cols[row[1]]) + '</span>' : '') + '</th>' +
          q.cols.map(function(c, ci){ var on = r[ri] === ci, cls = fb ? (ci === row[1] ? " ok" : (on ? " no" : "")) : "";
            return '<td class="mxc' + cls + '"><button class="mxb" data-row="' + ri + '" data-col="' + ci + '" role="radio" aria-checked="' + on + '" aria-label="' + esc(row[0]) + ': ' + esc(c) + '"' + (ro ? " disabled" : "") + '><span></span></button></td>'; }).join("") + '</tr>'; }).join("") +
      '</tbody></table></div>';
  } else if (k === "bowtie") {
    r = r || {};
    function col(key, list, perm, chosen, correct, title, cls){
      return '<div class="bcol ' + cls + '"><h4>' + title + '</h4>' + perm.map(function(i){
        var on = Array.isArray(chosen) ? chosen.indexOf(i) > -1 : chosen === i;
        return '<button class="bopt' + mark(fb, Array.isArray(correct) ? correct.indexOf(i) > -1 : correct === i, on, true) + '" data-b="' + key + '" data-i="' + i + '" aria-pressed="' + on + '"' + (ro ? " disabled" : "") + '>' + esc(list[i]) + '</button>';
      }).join("") + '</div>';
    }
    h += '<div class="bow">' +
      col("acts", q.acts, p.acts, r.acts || [], q.actAns, "Actions to take · select 2", "") +
      col("c", q.conds, p.conds, r.c, q.cAns, "Potential condition · select 1", "center") +
      col("mons", q.mons, p.mons, r.mons || [], q.monAns, "Parameters to monitor · select 2", "") +
      '</div><div class="bowshape">actions to take ▸ ◀ condition ▶ ◂ parameters to monitor</div>';
  }
  if (fb) h += feedbackHTML(q, S.resp[id]);
  return h;
}

function feedbackHTML(q, r){
  var ok = grade(q, r), p = S.perm[q.id], k = kind(q), pc = partial(q, r);
  var h = '<div class="fb ' + (ok ? "ok" : "no") + '" role="status"><div class="verdict">' + (complete(q, r) ? (ok ? pick(GOOD) : pick(BAD)) : "Not answered. Counted as incorrect.") + '</div>';
  if (pc) h += '<p class="pc">NGN-style partial score: <b>' + pc[0] + ' / ' + pc[1] + '</b> <span>(' + pc[2] + '). This exam awards 1 point only when the whole item is correct.</span></p>';
  var ca = "", wrongs = [];
  if (k === "matrix") {
    ca = '<ul>' + q.rows.map(function(row){ return '<li><b>' + esc(row[0]) + '</b> → ' + esc(q.cols[row[1]]) + '. <span class="dimt">' + esc(row[2]) + '</span></li>'; }).join("") + '</ul>';
  } else if (k === "cloze") {
    ca = '<p>' + esc(q.sentence).replace(/\{(\d)\}/g, function(_, n){ return '<b>' + esc(q.blanks[+n].opts[q.blanks[+n].ans]) + '</b>'; }) + '</p>';
    q.blanks.forEach(function(b, bi){ p.blanks[bi].forEach(function(oi){ if (oi !== b.ans) wrongs.push('<li><b>Drop-down ' + (bi + 1) + ': ' + esc(b.opts[oi]) + '.</b> ' + esc(b.not[oi]) + '</li>'); }); });
  } else if (k === "bowtie") {
    ca = '<ul><li><b>Condition:</b> ' + esc(q.conds[q.cAns]) + '</li><li><b>Actions to take:</b> ' + q.actAns.map(function(i){ return esc(q.acts[i]); }).join("; ") + '</li><li><b>Parameters to monitor:</b> ' + q.monAns.map(function(i){ return esc(q.mons[i]); }).join("; ") + '</li></ul>';
    p.acts.forEach(function(i){ if (q.actAns.indexOf(i) < 0) wrongs.push('<li><b>Action: ' + esc(q.acts[i]) + '.</b> ' + esc(q.actNot[i]) + '</li>'); });
    p.conds.forEach(function(i){ if (i !== q.cAns) wrongs.push('<li><b>Condition: ' + esc(q.conds[i]) + '.</b> ' + esc(q.condNot[i]) + '</li>'); });
    p.mons.forEach(function(i){ if (q.monAns.indexOf(i) < 0) wrongs.push('<li><b>Parameter: ' + esc(q.mons[i]) + '.</b> ' + esc(q.monNot[i]) + '</li>'); });
    r = r || {};
    var comp = [["Actions", sameSet(r.acts, q.actAns)], ["Condition", r.c === q.cAns], ["Parameters", sameSet(r.mons, q.monAns)]];
    ca += '<p class="dimt">Your bowtie: ' + comp.map(function(c){ return c[0] + ' <b style="color:' + (c[1] ? "var(--ok)" : "var(--bad)") + '">' + (c[1] ? "correct" : "incorrect") + '</b>'; }).join(" · ") + '</p>';
  } else if (q.fmt === "hl") {
    ca = '<ul>' + q.ans.map(function(i){ return '<li>' + esc(q.opts[i]) + '</li>'; }).join("") + '</ul>';
    q.opts.forEach(function(o, i){ if (q.ans.indexOf(i) < 0) wrongs.push('<li><b>"' + esc(o) + '."</b> ' + esc(q.not[i]) + '</li>'); });
  } else {
    var A = k === "sata" ? q.ans : [q.ans];
    ca = p.opts.map(function(oi, d){ return A.indexOf(oi) > -1 ? L[d] : null; }).filter(Boolean).join(", ") + '<ul>' + p.opts.filter(function(oi){ return A.indexOf(oi) > -1; }).map(function(oi){ return '<li>' + esc(q.opts[oi]) + '</li>'; }).join("") + '</ul>';
    p.opts.forEach(function(oi, d){ if (A.indexOf(oi) < 0) wrongs.push('<li><b>' + L[d] + '.</b> ' + esc(q.not[oi]) + '</li>'); });
  }
  h += '<div class="fsec"><h5>Correct answer</h5>' + ca + '</div>';
  h += '<div class="fsec"><h5>Rationale</h5><p>' + esc(q.why) + '</p></div>';
  h += '<div class="fsec"><h5>Why the correct answer is best</h5><p>' + esc(q.best) + '</p></div>';
  if (wrongs.length) h += '<div class="fsec"><h5>Why the other options are wrong</h5><ul>' + wrongs.join("") + '</ul></div>';
  h += '<div class="stepline"><span class="fsec"><h5 style="display:inline;margin-right:.4rem">NGN clinical judgment step</h5></span><span class="tag">' + esc(q.step) + '</span>' + (q.np ? '<span class="tag">Nursing process: ' + esc(q.np) + '</span>' : '') + '<span class="tag o">' + esc(SEC[q.sec]) + ' · ' + esc(q.topic) + '</span>' + q.obj.map(function(o){ return '<span class="tag" title="' + esc(OBJ[o]) + '">Objective ' + o + '</span>'; }).join('') + '</div>';
  h += '<div class="strat fsec"><h5>NGN test strategy</h5><p>' + esc(q.strat) + '</p></div>';
  h += '<div class="pearl fsec"><h5>High-yield pearl</h5><p>' + esc(q.pearl) + '</p></div></div>';
  return h;
}

function wire(id, ro){
  var q = BY[id], tabs = q.record || q.chart;
  document.querySelectorAll(".rtabs button").forEach(function(b){ b.onclick = function(){
    document.querySelectorAll(".rtabs button").forEach(function(x){ x.setAttribute("aria-selected", x === b); });
    $("#rbody").innerHTML = tabBody(tabs[+b.dataset.tab][1]);
  }; });
  if (ro) return;
  document.querySelectorAll(".opt,.hl").forEach(function(b){ b.onclick = function(){
    var oi = +b.dataset.o;
    if (isSata(q)) {
      var a = (S.resp[id] || []).slice(), i = a.indexOf(oi);
      if (i > -1) a.splice(i, 1);
      else { if (q.fmt === "n" && a.length >= q.n) { $("#needMsg").textContent = "You can select only " + q.n + ". Deselect one first."; return; } a.push(oi); }
      S.resp[id] = a;
    } else S.resp[id] = oi;
    changed(id);
  }; });
  document.querySelectorAll(".mxb").forEach(function(b){ b.onclick = function(){
    var r = Object.assign({}, S.resp[id] || {}); r[+b.dataset.row] = +b.dataset.col; S.resp[id] = r; changed(id);
  }; });
  document.querySelectorAll("select.cz").forEach(function(s){ s.onchange = function(){
    var r = Object.assign({}, S.resp[id] || {}); if (s.value === "") delete r[+s.dataset.blank]; else r[+s.dataset.blank] = +s.value; S.resp[id] = r; changed(id, true);
  }; });
  document.querySelectorAll(".bopt").forEach(function(b){ b.onclick = function(){
    var r = Object.assign({acts:[], mons:[]}, S.resp[id] || {}), key = b.dataset.b, i = +b.dataset.i;
    if (key === "c") r.c = r.c === i ? null : i;
    else { var arr = (r[key] || []).slice(), k2 = arr.indexOf(i); if (k2 > -1) arr.splice(k2, 1); else { if (arr.length >= 2) arr.shift(); arr.push(i); } r[key] = arr; }
    S.resp[id] = r; changed(id);
  }; });
}
function changed(id, noRerender){
  save();
  if (!noRerender) { var y = window.scrollY; examView(true); window.scrollTo(0, y); }
  else { header(); var s = $("#savedMsg"); if (s) s.textContent = S.mode === "exam" ? (answered(id) ? "Answer saved" : "") : ""; }
}

function examView(keepPos){
  S.phase = "exam"; header();
  var id = S.order[S.cur], q = BY[id], ro = S.done || (S.mode === "study" && !!S.locked[id]);
  var last = S.cur === S.order.length - 1;
  var h = '<section class="card qcard' + (keepPos ? "" : " fade") + '">' + qHTML(id, ro) +
    '<div class="actions"><button class="btn" id="prevBtn"' + (S.cur === 0 ? " disabled" : "") + '>← Previous</button>' +
    '<button class="btn" id="flagBtn" aria-pressed="' + !!S.flags[id] + '"><svg class="i" aria-hidden="true"><use href="#g-flag"/></svg>' + (S.flags[id] ? "Flagged" : "Flag") + '</button>' +
    '<span class="sp"></span><span class="saved" id="savedMsg">' + (S.mode === "exam" && answered(id) ? "Answer saved" : "") + '</span>' +
    (S.mode === "study" && !S.locked[id] ? '<button class="btn pur" id="subBtn">Submit answer</button>' : '') +
    (last ? '<button class="btn go" id="endBtn">Finish exam →</button>' : '<button class="btn go" id="nextBtn">Next →</button>') +
    '</div><p class="hint" id="needMsg" role="status"></p></section>';
  $("#app").innerHTML = h;
  wire(id, ro);
  $("#prevBtn").onclick = function(){ go(S.cur - 1); };
  $("#flagBtn").onclick = function(){ S.flags[id] = !S.flags[id]; if (!S.flags[id]) delete S.flags[id]; save(); var y = window.scrollY; examView(true); window.scrollTo(0, y); };
  if ($("#nextBtn")) $("#nextBtn").onclick = function(){ go(S.cur + 1); };
  if ($("#endBtn")) $("#endBtn").onclick = confirmFinish;
  if ($("#subBtn")) $("#subBtn").onclick = function(){
    if (!complete(q, S.resp[id])) { var kk = kind(q); $("#needMsg").textContent = kk === "bowtie" ? "Select 2 actions, 1 condition, and 2 parameters before submitting." : kk === "matrix" ? "Select an option in every row before submitting." : kk === "cloze" ? "Choose an option in every drop-down before submitting." : (q.fmt === "n" ? "Select exactly " + q.n + " before submitting." : "Select an answer before submitting."); return; }
    S.locked[id] = true; save(); var y = window.scrollY; examView(true); window.scrollTo(0, y);
    var f = document.querySelector(".fb"); if (f) f.scrollIntoView({behavior:"smooth", block:"nearest"});
  };
}
function go(i){ if (i < 0 || i >= S.order.length) return; S.cur = i; save(); examView(); window.scrollTo({top:0}); }

/* ----- map drawer ----- */
var mapF = "all";
function mapView(){
  var h = "";
  ZONES.forEach(function(z){
    var ids = S.order.filter(function(id){ return zoneOf(BY[id]) === z; });
    var cells = ids.map(function(id){
      var n = S.order.indexOf(id);
      if (mapF === "flag" && !S.flags[id]) return "";
      if (mapF === "open" && answered(id)) return "";
      var cls = "cell";
      if (showFeedback(id)) cls += grade(BY[id], S.resp[id]) ? " ok" : " no"; else if (answered(id)) cls += " ans";
      if (S.flags[id]) cls += " fl"; if (n === S.cur) cls += " cur";
      return '<button class="' + cls + '" data-n="' + n + '" aria-label="Question ' + (n + 1) + (S.flags[id] ? ", flagged" : "") + '">' + (n + 1) + '</button>';
    }).join("");
    if (cells) h += '<div class="zgrp"><h6>' + z.name + '</h6><div class="cells">' + cells + '</div></div>';
  });
  $("#mapBody").innerHTML = h || '<p class="empty">' + (mapF === "flag" ? "No flagged questions." : "Every question has an answer.") + '</p>';
  document.querySelectorAll("#mapBody .cell").forEach(function(b){ b.onclick = function(){ $("#drawer").hidden = true; go(+b.dataset.n); }; });
  $("#finishBtn").hidden = S.done;
}
$("#mapBtn").onclick = function(){ mapView(); $("#drawer").hidden = false; $("#drawerX").focus(); };
$("#drawerX").onclick = function(){ $("#drawer").hidden = true; };
$("#drawer").addEventListener("click", function(e){ if (e.target.id === "drawer") $("#drawer").hidden = true; });
document.querySelectorAll("#mapFilter button").forEach(function(b){ b.onclick = function(){ mapF = b.dataset.f; document.querySelectorAll("#mapFilter button").forEach(function(x){ x.setAttribute("aria-pressed", x === b); }); mapView(); }; });
$("#finishBtn").onclick = function(){ $("#drawer").hidden = true; confirmFinish(); };
document.addEventListener("keydown", function(e){ if (e.key === "Escape") { $("#drawer").hidden = true; $("#modal").hidden = true; } });

/* ----- finish ----- */
function confirmFinish(){
  var open = S.order.filter(function(id){ return !answered(id); }).length, fl = Object.keys(S.flags).length;
  var unchecked = S.mode === "study" ? S.order.filter(function(id){ return answered(id) && !S.locked[id]; }).length : 0;
  $("#mcard").innerHTML = '<h3>Submit the whole exam?</h3><p class="note">' +
    (open ? '<b style="color:var(--orange-l)">' + open + ' unanswered</b> question' + (open === 1 ? "" : "s") + ' will count as incorrect. ' : 'Every question has an answer. ') +
    (fl ? 'You have <b>' + fl + ' flagged</b>. ' : '') + (unchecked ? unchecked + ' answered but not yet submitted will be graded now. ' : '') +
    'After submitting you can review every rationale.</p><div class="actions"><button class="btn" id="mNo">Keep working</button><span class="sp"></span><button class="btn go" id="mYes">Submit exam</button></div>';
  $("#modal").hidden = false; $("#mNo").focus();
  $("#mNo").onclick = function(){ $("#modal").hidden = true; };
  $("#mYes").onclick = function(){ $("#modal").hidden = true; S.done = true; S.phase = "results"; save(); results(); window.scrollTo({top:0}); };
}

/* ----- results ----- */
function tally(keyFn, keys){
  var m = {}; keys.forEach(function(k){ m[k] = {c:0, t:0}; });
  S.order.forEach(function(id){ var q = BY[id], k = keyFn(q); m[k] = m[k] || {c:0, t:0}; m[k].t++; if (grade(q, S.resp[id])) m[k].c++; });
  return m;
}
function bars(m, labels){
  return Object.keys(m).map(function(k){ var x = m[k], pct = x.t ? Math.round(x.c / x.t * 100) : 0, col = pct >= 80 ? "var(--ok)" : pct >= 70 ? "var(--orange-l)" : "var(--bad)";
    return '<div class="brow"><span>' + esc(labels ? labels[k] : k) + '</span><span class="tr"><i style="width:' + pct + '%;background:' + col + '"></i></span><b>' + x.c + '/' + x.t + '</b></div>'; }).join("");
}
function objBars(){
  var m = {}; Object.keys(OBJ).forEach(function(k){ m[k] = {c:0, t:0}; });
  S.order.forEach(function(id){ var q = BY[id], ok = grade(q, S.resp[id]); q.obj.forEach(function(o){ m[o].t++; if (ok) m[o].c++; }); });
  var labels = {}; Object.keys(OBJ).forEach(function(k){ labels[k] = k + ". " + OBJ[k]; });
  Object.keys(m).forEach(function(k){ if (!m[k].t) delete m[k]; });
  return '<div class="objbars">' + bars(m, labels) + '</div><p class="hint">Questions can count toward more than one objective.</p>';
}
function results(){
  S.phase = "results"; header();
  var n = S.order.length, c = S.order.filter(function(id){ return grade(BY[id], S.resp[id]); }).length, pct = Math.round(c / n * 100);
  var tier = pct >= 90 ? "Excellent performance" : pct >= 80 ? "Proficient" : pct >= 70 ? "Approaching benchmark" : "Needs review";
  var pass = pct >= S.pass;
  var R = 62, C = 2 * Math.PI * R;
  var ring = '<svg class="ring" viewBox="0 0 150 150" role="img" aria-label="' + pct + ' percent"><circle cx="75" cy="75" r="' + R + '" fill="none" stroke="#e3e8ee" stroke-width="12"/><circle cx="75" cy="75" r="' + R + '" fill="none" stroke="' + (pass ? "#0f766e" : "#c2410c") + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (C * pct / 100) + ' ' + C + '" transform="rotate(-90 75 75)"/><text x="75" y="72" text-anchor="middle" fill="#17375e" font-size="32" font-weight="700">' + pct + '%</text><text x="75" y="96" text-anchor="middle" fill="#6b7480" font-size="14">' + c + ' / ' + n + '</text></svg>';
  var topics = tally(function(q){ return q.topic; }, []);
  var weak = Object.keys(topics).map(function(k){ return {k:k, c:topics[k].c, t:topics[k].t, p:topics[k].c / topics[k].t}; }).filter(function(x){ return x.c < x.t; })
    .sort(function(a, b){ return a.p - b.p || (b.t - b.c) - (a.t - a.c); }).slice(0, 3);
  var stepM = tally(function(q){ return q.step; }, STEPS);
  $("#app").innerHTML = '<section class="card fade"><div class="zone-tag" style="margin-bottom:.6rem"><svg class="i" aria-hidden="true"><use href="#g-key"/></svg>Exam results</div><div class="score">' + ring +
    '<div><div class="tier">' + tier + '</div><p class="note" style="margin-top:.3rem">Score <b>' + c + '/' + n + '</b> · <b>' + pct + '%</b> · ' + (S.mode === "study" ? "Study mode" : "Exam mode") + '</p>' +
    '<span class="pf ' + (pass ? "pass" : "fail") + '">' + (pass ? "PASS" : "BELOW BENCHMARK") + ' · benchmark ' + S.pass + '%</span></div></div>' +
    '<div class="grid2">' +
     '<div class="panel"><h3><svg class="i" aria-hidden="true"><use href="#g-pumpkin"/></svg>Performance by topic</h3>' + bars(tally(function(q){ return q.sec; }, ["repro","sex","sti","bc"]), SEC) + '</div>' +
     '<div class="panel" style="grid-column:1/-1"><h3><svg class="i" aria-hidden="true"><use href="#g-key"/></svg>Course objectives</h3>' + objBars() + '</div>' +
     '<div class="panel"><h3><svg class="i" aria-hidden="true"><use href="#g-door"/></svg>By question type</h3>' + bars(tally(function(q){ return q.type; }, ["mcq","sata","match","bowtie","case"]), TYPES) + '</div>' +
     '<div class="panel"><h3><svg class="i" aria-hidden="true"><use href="#g-lantern"/></svg>Clinical judgment steps</h3>' + bars(stepM) + '</div>' +
     '<div class="panel"><h3><svg class="i" aria-hidden="true"><use href="#g-grave"/></svg>Nursing process</h3>' + bars(tally(function(q){ return q.np; }, ["Assessment","Analysis","Planning","Implementation","Evaluation"])) + '</div>' +
     '<div class="panel"><h3><svg class="i" aria-hidden="true"><use href="#g-web"/></svg>Weakest areas</h3>' + (weak.length ? '<ol class="weak">' + weak.map(function(w){ return '<li><b>' + esc(w.k) + '</b> · ' + w.c + '/' + w.t + ' correct <button class="btn sm" data-topic="' + esc(w.k) + '">Review</button></li>'; }).join("") + '</ol>' : '<p class="empty">No missed topics.</p>') + '</div>' +
    '</div>' +
    '<div class="panel" style="margin-top:1rem"><h3><svg class="i" aria-hidden="true"><use href="#g-map"/></svg>Review your answers</h3>' +
     '<div class="toggle" id="rf"><button data-f="all" aria-pressed="' + (S.rf === "all") + '">All</button><button data-f="wrong" aria-pressed="' + (S.rf === "wrong") + '">Incorrect only</button><button data-f="flag" aria-pressed="' + (S.rf === "flag") + '">Flagged only</button></div><div class="rlist" id="rlist"></div></div>' +
    '<div class="actions" style="margin-top:1.2rem"><button class="btn" id="homeBtn">Back to start</button><span class="sp"></span><button class="btn go" id="againBtn">New attempt (reshuffled)</button></div></section>';
  function list(filter, topic){
    var ids = S.order.filter(function(id){ var q = BY[id];
      if (topic) return q.topic === topic;
      if (filter === "wrong") return !grade(q, S.resp[id]);
      if (filter === "flag") return !!S.flags[id]; return true; });
    $("#rlist").innerHTML = ids.length ? ids.map(function(id){ var q = BY[id], ok = grade(q, S.resp[id]);
      return '<button class="ritem" data-id="' + id + '"><span class="m" style="color:' + (ok ? "var(--ok)" : "var(--bad)") + '">' + (ok ? "✓" : "✗") + '</span><span><b>Q' + (S.order.indexOf(id) + 1) + ' · ' + TYPES[q.type] + '</b>' + (S.flags[id] ? ' <span class="flagged">· flagged</span>' : '') + '<small>' + esc((q.type === "case" ? q.record[0][1] : (q.chart ? q.chart[0][1] + ' ' : '') + q.stem).slice(0, 120)) + '…</small></span></button>'; }).join("")
      : '<p class="empty">' + (filter === "flag" ? "You didn't flag any questions." : "No incorrect answers. Nothing to review here.") + '</p>';
    document.querySelectorAll(".ritem").forEach(function(b){ b.onclick = function(){ S.rlist = ids; S.ri = ids.indexOf(b.dataset.id); reviewView(); window.scrollTo({top:0}); }; });
  }
  list(S.rf);
  document.querySelectorAll("#rf button").forEach(function(b){ b.onclick = function(){ S.rf = b.dataset.f; document.querySelectorAll("#rf button").forEach(function(x){ x.setAttribute("aria-pressed", x === b); }); list(S.rf); save(); }; });
  document.querySelectorAll("[data-topic]").forEach(function(b){ b.onclick = function(){ list(null, b.dataset.topic); $("#rlist").scrollIntoView({behavior:"smooth", block:"start"}); }; });
  $("#homeBtn").onclick = function(){ entrance(); window.scrollTo({top:0}); };
  $("#againBtn").onclick = function(){ newAttempt(); render(); window.scrollTo({top:0}); };
}
function reviewView(){
  S.phase = "review"; header();
  var id = S.rlist[S.ri];
  $("#app").innerHTML = '<section class="card qcard fade">' + qHTML(id, true) + '<div class="actions"><button class="btn" id="rPrev"' + (S.ri === 0 ? " disabled" : "") + '>← Previous</button><span class="saved">' + (S.ri + 1) + ' of ' + S.rlist.length + ' in this list</span><span class="sp"></span><button class="btn" id="rBack">Back to results</button><button class="btn go" id="rNext"' + (S.ri === S.rlist.length - 1 ? " disabled" : "") + '>Next →</button></div></section>';
  wire(id, true);
  $("#rPrev").onclick = function(){ S.ri--; reviewView(); window.scrollTo({top:0}); };
  $("#rNext").onclick = function(){ S.ri++; reviewView(); window.scrollTo({top:0}); };
  $("#rBack").onclick = function(){ results(); window.scrollTo({top:0}); };
}

function render(){
  if (S.phase === "exam") examView();
  else if (S.phase === "results" || S.phase === "review") results();
  else entrance();
}
entrance();
})();
</script></body></html>
