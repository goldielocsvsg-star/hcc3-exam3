rows:[[`Client started sertraline 6 weeks ago and states, "I just don't want sex anymore."`,0,`A new SSRI is a likely medication cause of low desire; the prescriber can adjust the dose or agent.`],[`Client 4 months after a mastectomy undresses only in the dark and avoids her partner's touch`,1,`Body image and self-concept are psychological; counseling addresses them.`],[`Client states, "We argue every week because he wants sex more often than I do."`,2,`Mismatched desire that causes conflict is relational; couples communication support fits.`],[`Client declines a pelvic exam by a male nurse practitioner, citing her faith's modesty rules`,3,`Modesty values are cultural/religious; arrange a female clinician when possible.`],[`Client with type 2 diabetes for 12 years (A1C 9.4%) can no longer maintain an erection`,0,`Vascular and neuropathic effects of poorly controlled diabetes are biological; medical evaluation and glycemic control are indicated.`],[`Client states, "Ever since I couldn't finish last time, I get so nervous that I avoid sex."`,1,`Performance anxiety is psychological; counseling addresses the anxiety-avoidance cycle.`]],
why:`Sexuality spans biological, psychological, social/relational, cultural/religious, legal/ethical, and lifespan dimensions. The cue in each concern (a new medication, a body change, partner conflict, a faith-based value, a chronic disease, anxiety) identifies its source, and the source determines the intervention: medication or disease review, counseling, couples support, or accommodation.`,
best:`Each row's cue identifies the source of the concern, which determines the nursing approach.`,
strat:`For each row, find the cue that explains the concern (drug, disease, self-image, partner, faith, fear), then choose the approach that targets that source. Sexuality-concept matrix.`,
pearl:`Assess how meds and disease affect desire, arousal, pain, and function.`});

add({id:"S11",sec:"sex",type:"mcq",obj:[2],step:"Analyze Cues",np:"Analysis",topic:"Sexual response",
chart:[["Medications","Metoprolol 50 mg PO daily (started 2 months ago)"],["Nurses' Notes","58-year-old client states, \"I still want to be with my wife, but I can't get or keep an erection since starting my new blood pressure pill.\""]],
stem:`The nurse is caring for a 58-year-old client who started metoprolol 2 months ago and now reports trouble getting or keeping an erection. Which conclusion by the nurse about the client's concern is most accurate?`,
opts:[`Desire is intact, and the beta-blocker is most likely impairing genital vascular congestion.`,`Desire is reduced by the beta-blocker, so too little motivation is present to set off an erection.`,`Desire is intact, but the beta-blocker is most likely blunting the mental arousal that comes first.`,`Erection is achieved, but the beta-blocker is most likely delaying orgasm, so the erection is lost.`],
ans:0,
why:`The sexual response sequence is motivation (desire) → arousal → genital congestion → orgasm → resolution. The client says he still wants to be with his wife, so motivation is intact. Erection is the vascular genital-congestion response, which beta-blockers can impair, and the problem began after the drug was started. Locating the phase guides the plan: report the timing to the primary health care provider, who may consider a different antihypertensive.`,
best:`Uses the client's own words (desire intact) and the drug timing to locate the problem in the congestion phase.`,
not:[``,`He reports desire is intact ("I still want to be with my wife").`,`Arousal is the subjective sense of excitement; erection itself is the vascular genital-congestion response.`,`He reports trouble getting an erection, not only keeping it, so the problem occurs before orgasm.`],
strat:`Locate the dysfunction in the sequence by what the client says still works. Separate the mental phase (arousal) from the physical vascular phase (congestion). Sexuality-concept item.`,
pearl:`Motivation → Arousal → Genital congestion → Orgasm → Resolution.`});

add({id:"S12",sec:"sex",type:"sata",obj:[2],step:"Evaluate Outcomes",np:"Evaluation",topic:"Positive sexual attitudes",
chart:[["Nurses' Notes","Couple completed 6 weeks of counseling after the client's treatment for breast cancer. Counseling goals: open communication about needs, mutual consent, emotional closeness, and shared decisions about contraception and STI testing."]],
stem:`The nurse is evaluating outcomes for a couple who completed counseling after the client's treatment for breast cancer. Which client statements indicate that the counseling goals have been met? Select all that apply.`,
opts:[`"We talk openly about what each of us wants, and either of us can say no."`,`"I feel like I can be fully myself with my partner, without pretending."`,`"Our closeness feels meaningful to us, beyond just the physical part."`,`"When he wants to and I don't, I usually go along so it won't turn into a fight."`,`"Since treatment ended I've avoided touching, and we don't talk about it."`,`"We haven't talked about birth control or testing; it just works out."`,`"Some weeks we aren't sexual at all, and we've talked and are both fine with that."`],
ans:[0,1,2,6],
why:`Positive sexuality includes being present, authenticity, emotional connection, intimacy, communication, consent, and transcendence. Statements showing open communication, consent, authenticity, and shared meaning meet the goals. "Going along so it won't turn into a fight" suggests coercion; avoidance without discussion and no shared decision about contraception show unmet goals. Contraception matters here because hormonal methods are generally avoided after breast cancer. Frequency matters less than shared, communicated satisfaction.`,
best:`These reflect communication, authenticity, transcendence, and mutual agreement.`,
not:[`Correct: communication and consent goals met.`,`Correct: authenticity.`,`Correct: emotional closeness (transcendence).`,`Suggests coercion; consent goal not met and requires safety assessment.`,`Avoidance without communication; closeness and communication goals not met.`,`No shared decision about contraception or STI testing; important after breast cancer, when hormonal methods are generally avoided.`,`Correct: openly communicated, mutual agreement; low frequency alone is not a problem.`],
strat:`Compare each statement with the stated goals in the chart. Judge communication and consent, not how often sex occurs. Statements that hint at coercion are red flags. Evaluate-outcomes item.`,
pearl:`Positive sexuality: presence, authenticity, connection, intimacy, communication, transcendence.`});

add({id:"S13",sec:"sex",type:"mcq",obj:[2,9],step:"Generate Solutions",np:"Implementation",topic:"Sexuality across the lifespan",
chart:[["Nurses' Notes","72-year-old widowed client, postmenopausal, states she has a new partner and has \"pain and dryness with sex.\" Asks if she still needs to worry about infections."]],
stem:`A 72-year-old postmenopausal client who has a new partner reports pain and dryness with sex. The client asks, "Do I still need to worry about infections?" Which response by the nurse would be most helpful?`,
opts:[`"Dryness is common after menopause, and a water-based lubricant helps. You can still get STIs, so use condoms with a new partner."`,`"Dryness is common after menopause, and petroleum jelly lasts longest as a lubricant. Condoms are still wise with any new partner."`,`"Dryness is common after menopause, and a lubricant can help. Since pregnancy is no longer possible, condoms aren't needed."`,`"Vaginal estrogen is the first step for dryness, and STI risk is low after age 65, so routine testing isn't usually needed."`],
ans:0,
why:`Sexuality continues across the lifespan, and menopause teaching includes managing vaginal dryness. Newly partnered adults have new STI risk at any age. Water-based lubricant is compatible with latex condoms.`,
best:`Addresses both concerns accurately and without ageism.`,
not:[``,`Condom advice is correct, but oil-based products such as petroleum jelly weaken latex condoms.`,`Condoms prevent STIs, not only pregnancy; she has a new partner.`,`Lubricants and moisturizers are usually tried first, and a new partner creates STI risk at any age.`],
strat:`Older adult + new partner = STI teaching. Watch for condom-lube compatibility. Every option starts plausibly; find the one wrong detail. Sexuality-concept item.`,
pearl:`Never assume older adults aren't sexually active.`});

add({id:"S14",sec:"sex",type:"mcq",obj:[2,8],step:"Take Action",np:"Implementation",topic:"Medications & sexuality",
chart:[["Medications","Sertraline 100 mg PO daily, started 3 months ago for depression"],["Nurses' Notes","Client states, \"I stopped my antidepressant last week because I couldn't have an orgasm. I didn't want to tell the doctor.\""]],
stem:`A nurse is caring for a client who has depression and was prescribed sertraline 3 months ago. The client reports stopping the medication last week because of sexual side effects. Which action would be most appropriate for the nurse to take at this time?`,
opts:[`Acknowledge the concern and notify the primary health care provider so alternatives can be discussed.`,`Advise restarting sertraline at the prior dose and reporting side effects at the next scheduled visit.`,`Explain that SSRI sexual effects usually lessen after 6 to 8 weeks, and encourage restarting it today.`,`Ask about discontinuation symptoms such as dizziness, and document them for review at the next visit.`],
ans:0,
why:`Nurses review medications for effects on sexuality. Stopping an antidepressant abruptly is a safety concern (discontinuation symptoms, relapse of depression), and sexual side effects are a common reason for nonadherence. The primary health care provider needs to know now to adjust therapy, for example by changing the dose or agent.`,
best:`Validates the concern and gets a safe medication plan.`,
not:[``,`Restarting or changing a dose needs provider direction, and it ignores the reason she stopped.`,`She has taken it for 3 months, so the effect has not lessened; this also bypasses the provider.`,`Assessing withdrawal is reasonable, but waiting for the next visit delays a needed medication plan.`],
strat:`Sexuality problems often hide behind medication nonadherence. Use the start date in the chart. Take-action item.`,
pearl:`Ask about sexual side effects; they drive nonadherence.`});

add({id:"S15",sec:"sex",type:"mcq",obj:[4,6],step:"Recognize Cues",np:"Assessment",topic:"Five Ps",
chart:[["Nurses' Notes","1000: 25-year-old client at an annual exam, interviewed alone after confidentiality was explained.\nPartners: one male partner × 2 years; states he had another partner last year.\nPractices: vaginal and oral sex.\nProtection: does not use condoms.\nPregnancy: hormonal IUD placed 2 years ago; does not want children for at least 5 years."]],
stem:`The nurse is taking a sexual history from a 25-year-old client during an annual exam using the Five Ps framework. Which question should the nurse ask next?`,
opts:[`"Has either you or a partner ever been treated for an STI before?"`,`"How many sexual partners have you had over your lifetime so far?"`,`"Would you like to hear about birth control options besides the IUD?"`,`"Do you ever have pain, bleeding, or discharge after you have sex?"`],
ans:0,
why:`The Five Ps (Partners, Practices, Protection from STIs, Past history of STIs, and Pregnancy intention/prevention) are the CDC framework for a complete, nonjudgmental sexual history. The notes cover partners, practices, protection, and pregnancy, but not past STI history. A prior STI raises reinfection risk and, with no condom use and a partner who had another partner, guides which tests, sites, and counseling she needs.`,
best:`Fills the one missing P, which directly affects her STI risk and testing plan.`,
not:[``,`Partners are already assessed; recent partners guide risk more than a lifetime count.`,`Pregnancy prevention is addressed; she is satisfied with her IUD and has stated her intention.`,`Symptom review belongs in the exam and review of systems; it is not the missing part of the history.`],
strat:`Check the chart against each of the Five Ps and find the gap. Options that repeat a P already covered add little. Recognize-cues item.`,
pearl:`Five Ps: Partners, Practices, Protection, Past STIs, Pregnancy intention.`});

add({id:"S16",sec:"sex",type:"sata",fmt:"hl",obj:[4,8],step:"Recognize Cues",np:"Assessment",topic:"Five Ps",
stem:`The nurse is taking a sexual history from a 28-year-old client during a routine visit. Click to highlight the client responses that require follow-up.`,
note:["Client states: \"",0,". ",1,". ",2,". ",3,". ",4,". ",5,". ",6,".\""],
opts:[`I've been married to my husband for 2 years`,`Sometimes my husband makes me have sex when I don't want to`,`We use condoms for vaginal sex but not for oral sex`,`I had sex at a party and don't remember most of it`,`I've been treated for gonorrhea twice in the past year`,`I track my periods and ovulation with an app on my phone`,`I finished my HPV vaccine series back in high school`],
ans:[1,2,3,4],
why:`Coercion and possible assault require safety assessment. Barrier use only for some practices affects testing sites and prevention. Repeat gonorrhea suggests reinfection or untreated partners.`,
best:`Each highlight is a safety, practice, or past-history cue.`,
not:[`Marital status alone isn't a risk.`,`Correct: possible sexual coercion; safety assessment.`,`Correct: Practices gap; oral exposure.`,`Correct: possible assault; safety and STI/pregnancy evaluation.`,`Correct: Past STI history; reinfection risk.`,`Healthy self-monitoring.`,`Completed HPV vaccination is protective and needs no follow-up.`],
strat:`Read the Five Ps into each statement. Safety cues outrank everything. Recognize-cues highlight item.`,
pearl:`Assess IPV and sexual violence when indicated; safety first.`});

add({id:"S17",sec:"sex",type:"mcq",obj:[5],step:"Take Action",np:"Implementation",topic:"Implicit bias",
chart:[["Documentation Audit","Completed by the nurse after an in-service on implicit bias. Past month: sexual history documented for 9 of 10 clients younger than 40 and for 1 of 10 clients older than 65. No older client declined the questions."]],
stem:`After an in-service on implicit bias in sexual health care, a nurse audits personal documentation from the past month. Based on the audit results, which action by the nurse best demonstrates effective self-reflection?`,
opts:[`Begin asking older clients the same sexual history questions asked of younger adults.`,`Accept that the pattern reflects unconscious bias that can't be changed, and stay aware of it.`,`Refer older clients to a colleague who is more comfortable discussing sexual health.`,`Take an implicit association test to confirm whether an age-related bias is present.`],
ans:0,
why:`Implicit biases are unconscious, so they show up as patterns in behavior. The audit already reveals one: older clients are rarely asked about sexual health, and none declined. Effective reflection means recognizing the pattern in one's own practice and changing the behavior. Nurses assess their own beliefs and prejudices and keep them from shaping care.`,
best:`Acts on the evidence of bias with a concrete change in practice.`,
not:[``,`Awareness without changing behavior is not reflection; unconscious bias can be identified and addressed.`,`Avoids rather than addresses the bias, and older clients still depend on the nurse's own assessment.`,`The audit already shows the biased pattern; more testing delays a needed change in practice.`],
strat:`Use the audit data: the bias is already demonstrated. The best action shows insight AND changed behavior. Bias item.`,
pearl:`Nurses must assess their own beliefs and prejudices.`});

add({id:"S18",sec:"sex",type:"sata",fmt:"n",n:3,obj:[5,6],step:"Take Action",np:"Implementation",topic:"Nurse values & bias",
chart:[["Nurses' Notes","Client requests information about emergency contraception. The assigned nurse personally believes emergency contraception is morally wrong."]],
stem:`A client asks the nurse for information about emergency contraception (EC). The nurse personally believes EC is morally wrong. Select 3 actions the nurse should take that are consistent with professional nursing ethics.`,
opts:[`Recognize that personal beliefs should not direct the client's decision`,`Ensure the client gets complete information, arranging another nurse if needed`,`Avoid sharing personal opinions about EC while caring for the client`,`Explain that EC mainly prevents implantation so the client can weigh it morally`,`Hand the request to the oncoming nurse to avoid a conflict of conscience`,`Disclose the personal objection so the client understands the referral`],
ans:[0,1,2],
why:`Professional ethics: recognize personal beliefs, keep them from directing client decisions, and refer appropriately if necessary. Steering, delaying, or withholding options is unethical, and EC is time-sensitive.`,
best:`Protects the client's autonomy while respecting the nurse's limits.`,
not:[`Correct.`,`Correct: timely referral protects access.`,`Correct.`,`Inaccurate: levonorgestrel EC works mainly by delaying ovulation, and framing it morally steers the client.`,`Waiting until shift change delays a time-sensitive medication; arrange a timely handoff instead.`,`Sharing the objection introduces the nurse's values into the client's decision.`],
strat:`Nurse-values questions: self-awareness → no opinions → client gets full, timely information. Bias/ethics item.`,
pearl:`Keep personal values from directing client decisions; refer if needed.`});

add({id:"S19",sec:"sex",type:"match",obj:[6],step:"Take Action",np:"Evaluation",topic:"Confidentiality & legal",
stem:`The charge nurse is evaluating how staff handle the information of clients being seen for STIs. For each action, click to specify whether it is appropriate or inappropriate.`,
cols:["Appropriate","Inappropriate"],
rows:[[`Reporting a confirmed syphilis case to the local health department`,0,`Syphilis is reportable.`],[`Leaving a gonorrhea result on the voicemail of the client's shared home phone`,1,`Breach of confidentiality; others may hear the message.`],[`Obtaining written consent before STI testing per facility policy`,0,`Following facility consent policy before testing is appropriate.`],[`Confirming to a client's mother, who calls, that the client kept an STI visit`,1,`Breach of privacy; the mother is not authorized.`],[`Allowing a 16-year-old to consent to STI testing without a parent`,0,`All US states allow minors to consent to STI services.`],[`Telling the client the health department may contact them about partners`,0,`Clients should be informed about reporting and partner services.`]],
why:`Nurses maintain privacy, avoid discussing STIs with anyone who isn't a direct caregiver or client family as authorized, report STIs only to appropriate authorities, obtain written consent for testing, and inform the client about reporting.`,
best:`Each row tests one confidentiality or legal rule.`,
strat:`Ask: does this protect the client's information while meeting legal duties? Legal/ethics matrix.`,
pearl:`Report to public health; protect privacy from everyone else.`});

add({id:"S20",sec:"sex",type:"mcq",obj:[6],step:"Prioritize Hypotheses",np:"Analysis",topic:"Culture & religion",
chart:[["Nurses' Notes","20-year-old client raised in a strict religious community recently came out as gay. Tearful; states, \"My family and church say I'm going to hell. Maybe they're right.\" Sleeping poorly; skipping classes."]],
stem:`The nurse is caring for a 20-year-old client who was raised in a strict religious community and recently came out as gay. The client states, "My family and church say I'm going to hell. Maybe they're right." The nurse should give immediate consideration to which client problem?`,
opts:[`Spiritual distress from conflict between sexual identity and religion`,`Disturbed sleep pattern related to stress, resulting in missed classes`,`Interrupted family processes related to the family's rejection of the client`,`Need for STI screening and safer-sex teaching as a newly out young adult`],
ans:0,
why:`The nurse identifies ethical and psychological stress from conflict between sexual identity and religion or culture, and refer to counseling and resources. Hopeless statements, poor sleep, and withdrawal need follow-up, including safety assessment.`,
best:`Addresses the distress the cues describe.`,
not:[``,`Poor sleep is real but is a symptom of the underlying distress, not the root problem.`,`Family conflict is present, but the client's own distress ("Maybe they're right") is the priority.`,`Assumes risk based on identity; nothing in the note suggests a sexual health need now.`],
strat:`Choose the hypothesis that explains the most cues (the root problem), not a symptom or an assumption. Ethics/culture item.`,
pearl:`Identify stress from identity-religion conflict; refer to counseling.`});

add({id:"S21",sec:"sex",type:"mcq",obj:[6],step:"Take Action",np:"Implementation",topic:"Culture & religion",
chart:[["Nurses' Notes","0215: Client in the ED with severe right lower quadrant pain, positive pregnancy test, and BP 92/58, HR 118. Client requests a female provider for the pelvic exam. The only provider in the ED is male; a female OB on call is about 45 minutes away."]],
stem:`A nurse is caring for a client in the emergency department who has severe right lower quadrant pain and a positive pregnancy test. The client requests a female provider for the pelvic exam. The nurse should take which priority action?`,
opts:[`Explain the urgency, offer a female chaperone, and have the male provider examine her now.`,`Start a large-bore IV and call in the female OB on call, who can arrive in about 45 minutes.`,`Respect her preference, document that she declined the exam, and keep monitoring vital signs.`,`Ask the client's husband to help persuade her to accept the male provider's exam now.`],
ans:0,
why:`Cultural and religious preferences are accommodated when possible without delaying urgent care. Hypotension and tachycardia with a possible ectopic pregnancy are emergencies.`,
best:`Respects her preferences as much as possible without delaying lifesaving care.`,
not:[``,`IV access is appropriate, but a 45-minute delay in evaluation is unsafe with signs of hemorrhage.`,`She requested a female provider; she has not refused care, and monitoring alone delays treatment.`,`Pressure through a family member undermines her autonomy; the nurse explains the urgency to her directly.`],
strat:`Accommodation never outranks a life-threatening condition. Read the vital signs and the timing. Ethics/culture item.`,
pearl:`Accommodate preferences without delaying urgent care.`});

add({id:"S22",sec:"sex",type:"sata",obj:[8,2],step:"Recognize Cues",np:"Assessment",topic:"Medications & sexuality",
stem:`The nurse is assessing a 55-year-old client who reports decreased sexual desire and satisfaction. Which findings may be contributing to the client's concern? Select all that apply.`,
opts:[`Takes metoprolol daily for hypertension`,`Type 2 diabetes diagnosed 10 years ago`,`Mastectomy 4 months ago; avoids mirrors`,`Started treatment for depression this year`,`History of sexual assault in her twenties`,`Walks 30 minutes most days with a friend`,`Takes calcium with vitamin D each morning`],
ans:[0,1,2,3,4],
why:`Problems with sexuality can stem from medications, chronic illness, body-image changes, mental health conditions, and trauma, all of which can alter response.`,
best:`Each correct item is a biological or psychological factor that can lower desire or satisfaction.`,
not:[`Correct: beta-blocker effect.`,`Correct: chronic illness (vascular and neuropathic effects).`,`Correct: body image.`,`Correct: depression and many antidepressants reduce desire.`,`Correct: trauma history.`,`Regular activity is protective.`,`Calcium and vitamin D supplements do not affect sexual response.`],
strat:`Risk factors for sexuality problems span biology and psychology. Recognize-cues item.`,
pearl:`Illness, fatigue, meds, pain, stress, anxiety, conflict, and body-image changes all alter sexual response.`});

add({id:"S23",sec:"sex",type:"case",sub:"matrix",obj:[3,6],step:"Generate Solutions",np:"Planning",topic:"Psychosocial risk & IPV",
record:[["Nurses' Notes","1000: 27-year-old client requests birth control. Partner waited in the car.\n1010: Client states, \"He pokes holes in condoms and throws out my pills. He says I'll never leave if we have a baby.\" Client reports he checks her phone daily."],["Vital Signs","T 36.8 °C · HR 92 · BP 118/76"],["History","G1 P1. No chronic illness. Urine hCG negative."]],
stem:`The nurse is caring for a 27-year-old client who requests birth control and reports that her partner interferes with her contraception. For each potential intervention, click to specify whether it is indicated, contraindicated, or non-essential for the client's care.`,
cols:["Indicated","Contraindicated","Non-essential"],
rows:[[`Continue the interview privately and assess immediate safety`,0,`Reproductive coercion is a form of IPV; safety first.`],[`Discuss methods the partner can't easily detect or interfere with, such as an implant or IUD`,0,`Client-controlled LARC protects against coercion.`],[`Give the client printed pamphlets about abuse to take home`,1,`May be discovered by the partner and increase danger.`],[`Ask the partner to come in to discuss the relationship`,1,`Can escalate danger.`],[`Provide IPV hotline information in a safe way the client chooses`,0,`Supports safety planning.`],[`Draw a serum hCG to confirm the negative urine test`,2,`Urine hCG is negative and nothing suggests early pregnancy; it adds nothing to today's plan.`]],
why:`Sabotaging contraception is reproductive coercion, a psychosocial risk and form of IPV. Private assessment, safety planning, and client-controlled methods are indicated; anything the partner could discover or confront is unsafe.`,
best:`Each row is judged against safety and autonomy.`,
strat:`Generate solutions with the safety lens: "Could this make her less safe?" Ethics/risk matrix.`,
pearl:`Reproductive coercion → private screening + client-controlled methods.`});

add({id:"S24",sec:"sex",type:"mcq",obj:[2,5],step:"Take Action",np:"Implementation",topic:"Implicit bias",
chart:[["Nurses' Notes","Group home staff accompanying a 24-year-old client with an intellectual disability state, \"She doesn't need any sexual health counseling. She isn't sexual.\" The client is her own legal decision-maker."]],
stem:`A nurse is caring for a 24-year-old client who has an intellectual disability and is her own legal decision-maker. Group home staff accompanying the client state, "She doesn't need any sexual health counseling. She isn't sexual." Which response by the nurse would be most appropriate?`,
opts:[`"All adults need a sexual health assessment. I'll speak with her privately about her health and safety."`,`"I'll include you in the discussion, since she may need help understanding the information I give."`,`"Before I discuss sexual health with her, I'll need written consent from her guardian or the group home."`,`"I'll give you written materials on puberty and hygiene to review with her when you get home."`],
ans:0,
why:`People with cognitive or developmental disabilities should not be assumed to be asexual. The nurse assesses capacity, safety, consent, and access, ideally privately.`,
best:`Rejects the assumption and protects privacy and safety.`,
not:[``,`Support may help later, but including staff first bypasses privacy and the safety screening she needs.`,`She is her own legal decision-maker; no guardian consent is needed.`,`Routes care through staff and still accepts the assumption that she isn't sexual.`],
strat:`The bias here comes from a third party; the nurse still advocates. Check the chart for decision-making capacity. Bias item.`,
pearl:`Don't assume asexuality with disability; assess capacity, safety, consent.`});
/* ===== EXPANSION BANK · part 2: STIs (22) ===== */
add({id:"T28",sec:"sti",type:"mcq",obj:[7],step:"Recognize Cues",np:"Assessment",topic:"Chlamydia & gonorrhea",
chart:[["Nurses' Notes","1400: 24-year-old male client requests STI testing. Had sex with a new partner 2 weeks ago; the partner was diagnosed with gonorrhea yesterday. Reports penile discharge and burning with urination × 10 days and right scrotal pain × 2 days. Has taken no medication."],["Vital Signs","T 37.4 °C (99.3 °F) · HR 84 · BP 124/78"],["Laboratory Results","NAAT results: pending"]],
stem:`The nurse is assessing a 24-year-old male client whose sexual partner was diagnosed with gonorrhea. Which finding should the nurse recognize as a complication that requires prompt follow-up?`,
opts:[`Thick yellow discharge from the urethral meatus`,`Right testicular pain with scrotal swelling`,`Burning with urination and urinary frequency`,`Temperature of 37.4 °C (99.3 °F) orally`],
ans:1,
why:`In men, gonococcal urethritis usually appears within about 2 to 7 days of exposure, with purulent urethral discharge and dysuria; these are expected early findings. This client has gone 10 days untreated, and new one-sided testicular pain with swelling indicates epididymitis, an ascending complication. It needs prompt evaluation (testicular torsion must be ruled out) and a longer regimen than uncomplicated urethritis (CDC 2021: ceftriaxone 500 mg IM once plus doxycycline for 10 days).`,
best:`Epididymitis is a complication of untreated urethritis; the other findings are expected early or normal.`,
not:[`Purulent urethral discharge is the expected early finding of gonococcal urethritis in men.`,``,`Dysuria and frequency are expected early findings of urethritis, not a complication.`,`37.4 °C is within the normal range and does not by itself indicate a complication.`],
strat:`Separate expected early findings (discharge, dysuria) from signs that the infection has spread. Use the timeline in the chart: 10 days untreated, with a newer scrotal complaint. Recognize-cues item.`,
pearl:`Gonorrhea in men: purulent discharge + dysuria within days; one-sided testicular pain and swelling = epididymitis, a complication.`});

add({id:"T29",sec:"sti",type:"mcq",obj:[7,9],step:"Prioritize Hypotheses",np:"Analysis",topic:"HSV in pregnancy",
stem:`The nurse receives report on four clients who have genital lesions. Which client should the nurse see first?`,
opts:[`A client at 38 weeks' gestation with new painful grouped vesicles and fever`,`A client at 22 weeks' gestation with a painless vulvar ulcer and reactive RPR`,`A client at 36 weeks' gestation with recurrent HSV on suppressive acyclovir`,`A nonpregnant client with cauliflower-like vulvar growths that bleed with wiping`],
ans:0,
why:`A primary HSV episode near term carries the highest risk of neonatal infection, and labor is imminent. Birth planning may change (cesarean if lesions or prodrome present). The other clients need care, but none face harm in the next hours.`,
best:`Pregnancy + near term + active primary HSV = highest urgency.`,
not:[``,`Likely primary syphilis in pregnancy: needs penicillin promptly, but she is stable and far from delivery.`,`Suppressive therapy from 36 weeks is standard, and no active lesions are described.`,`Likely HPV warts with minor bleeding: not urgent.`],
strat:`When several clients have STIs, weigh timing to delivery and active vs suppressed disease. Prioritization item.`,
pearl:`Primary HSV in pregnancy can harm the fetus/newborn; check lesions and prodrome in labor.`});

add({id:"T30",sec:"sti",type:"sata",fmt:"hl",obj:[7,9],step:"Recognize Cues",np:"Assessment",topic:"HSV",
stem:`The nurse is caring for a client who is having a first episode of genital herpes and reviews the nurses' notes. Click to highlight the findings that require immediate follow-up.`,
note:["1500: Client has ",0," on the labia and reports ",1,". ",2,". Temperature ",3,". ",4,". Client is ",5,". Client states, \"",6,".\""],
opts:[`multiple grouped vesicles and shallow, painful ulcers`,`tender, enlarged inguinal lymph nodes on both sides`,`Has not voided in 11 hours; suprapubic fullness noted`,`38.0 °C (100.4 °F) orally`,`Reports malaise, body aches, and fatigue since yesterday`,`30 weeks pregnant with her first baby`,`If my boyfriend finds out, I'd rather be dead`],
ans:[2,5,6],
why:`Fever, malaise, tender nodes, and painful vesicles are expected in a primary HSV episode. Urinary retention is a known complication needing intervention. Pregnancy changes the plan (fetal/newborn risk). A statement about being "better off dead" requires safety assessment.`,
best:`These three are complications or risk modifiers, not expected findings.`,
not:[`Expected with primary HSV.`,`Expected with primary HSV.`,`Correct: urinary retention.`,`Expected low-grade fever with primary HSV.`,`Expected systemic symptoms.`,`Correct: pregnancy changes priorities.`,`Correct: requires safety assessment.`],
strat:`Separate expected findings from complications. Expected findings don't need "immediate follow-up." Recognize-cues highlight.`,
pearl:`Primary HSV: painful lesions, fever, malaise, severe dysuria; watch for urinary retention.`});

add({id:"T31",sec:"sti",type:"match",obj:[7],step:"Analyze Cues",np:"Analysis",topic:"Syphilis stages",
stem:`The nurse is reviewing data for several clients who have reactive syphilis serology. For each client, click to specify the stage of syphilis that the findings indicate.`,
cols:["Primary","Secondary","Latent","Tertiary"],
rows:[[`Painless, firm, clean-based penile ulcer noticed 3 weeks after a new partner`,0,`A single painless chancre at the site of inoculation is primary syphilis.`],[`Nonpruritic copper-colored rash on the palms and soles with patchy hair loss`,1,`Palmar-plantar rash and patchy alopecia are secondary syphilis.`],[`Moist, flat, gray perianal plaques with fever and generalized lymphadenopathy`,1,`Condylomata lata with systemic signs are secondary syphilis.`],[`Reactive prenatal screen at 12 weeks; no lesions, rash, or symptoms on exam`,2,`Positive serology without signs or symptoms is latent syphilis.`],[`Wide-based gait, positive Romberg sign, and an aortic regurgitation murmur`,3,`Late neurologic (tabes dorsalis) and cardiovascular disease are tertiary syphilis.`],[`Untreated ulcer healed 6 weeks ago; now has fever, malaise, and a diffuse rash`,1,`Secondary signs typically appear weeks after the chancre heals.`]],
why:`Primary = painless chancre (incubation roughly 10–90 days). Secondary = rash including palms/soles, alopecia, generalized lymphadenopathy, fever, condylomata lata, usually weeks after the chancre. Latent = reactive serology without symptoms. Tertiary = late neurologic, cardiovascular, or gummatous disease. Staging matters because it sets treatment: primary, secondary, and early latent syphilis get benzathine penicillin G 2.4 million units IM once; late latent or unknown duration gets 3 weekly doses; neurosyphilis needs IV aqueous penicillin G.`,
best:`Each client's data match one stage-defining pattern, which then determines the treatment regimen.`,
strat:`Anchor each stage on one signature: chancre → palms/soles or flat plaques → no findings → organ damage. Use timing clues (weeks after a healed ulcer). Analyze-cues matrix.`,
pearl:`Syphilis treatment depends on stage; penicillin G is the cornerstone.`});

add({id:"T32",sec:"sti",type:"mcq",obj:[7],step:"Analyze Cues",np:"Analysis",topic:"HPV",
chart:[["Nurses' Notes","26-year-old client reports painless \"bumps\" on the vulva × 2 months. Soft, flesh-colored, papillary growths clustered in a cauliflower pattern; no central umbilication. No rash elsewhere."],["Laboratory Results","RPR: nonreactive"]],
stem:`The nurse is assessing a 26-year-old client who reports painless vulvar "bumps" for 2 months. The nurse recognizes that the findings indicate which condition?`,
opts:[`Condylomata acuminata from HPV`,`Condylomata lata from secondary syphilis`,`Molluscum contagiosum from a poxvirus`,`Recurrent genital herpes (HSV-2)`],
ans:0,
why:`Soft, painless, papillary, cauliflower-like growths are HPV warts (condylomata acuminata). Condylomata lata are broad and flat with other secondary signs, and the RPR is nonreactive. Molluscum papules are smooth and dome-shaped with central umbilication. HSV lesions are painful vesicles and ulcers.`,
best:`Morphology plus a nonreactive RPR points to HPV.`,
not:[``,`Broad and flat, and the RPR is nonreactive.`,`Painless and flesh-colored, but molluscum papules are smooth, dome-shaped, and umbilicated, not papillary.`,`HSV lesions are painful vesicles and ulcers that heal, not persistent growths.`],
strat:`Painless genital papules: cauliflower (HPV) vs flat (syphilis) vs umbilicated (molluscum). Check serology and morphology. Analyze-cues item.`,
pearl:`HPV warts: soft, painless, cauliflower-like.`});

add({id:"T33",sec:"sti",type:"bowtie",obj:[7,9],step:"Take Action",np:"Implementation",topic:"BV vs Candida vs Trich",
chart:[["Nurses' Notes","1100: 23-year-old client reports a \"frothy, smelly\" discharge, vulvar itching, and painful intercourse × 1 week. New partner × 3 months; partner has no symptoms."],["Exam / Labs","Yellow-green frothy discharge; punctate red lesions on the cervix. Vaginal pH 6.0. Wet mount: motile flagellated organisms. Whiff test negative."]],
stem:BOW_STEM,
acts:[`Administer metronidazole as prescribed`,`Arrange treatment for the client's partner`,`Recommend an over-the-counter antifungal cream`,`Administer ceftriaxone IM as a single dose`,`Defer partner treatment until the partner tests positive`],actAns:[0,1],
conds:[`Trichomoniasis`,`Bacterial vaginosis`,`Vulvovaginal candidiasis`,`Gonococcal cervicitis`],cAns:0,
mons:[`Resolution of discharge and itching`,`Recurrence of symptoms suggesting reinfection`,`Fasting blood glucose to screen for diabetes`,`Test of cure by wet mount 1 week after therapy`,`RPR titers at 6 and 12 months after therapy`],monAns:[0,1],
actNot:[`Correct: nitroimidazole therapy.`,`Correct: untreated partners cause reinfection.`,`Wrong organism; antifungals treat candidiasis.`,`Treats gonorrhea; the wet mount shows trichomonads, not diplococci.`,`Partners are treated regardless of symptoms or test results; asymptomatic partners still transmit.`],
condNot:[`Correct: frothy green, strawberry cervix, pH >5, motile trichomonads.`,`BV has a positive whiff test and clue cells.`,`Candida keeps a normal pH and has pseudohyphae.`,`Gonorrhea causes mucopurulent cervicitis and gram-negative diplococci.`],
monNot:[`Correct.`,`Correct.`,`Relevant to recurrent candidiasis, not trich.`,`An early wet mount is not recommended; women are retested by NAAT within 3 months.`,`Syphilis monitoring, not trich.`],
why:`Frothy yellow-green discharge, strawberry cervix (punctate red lesions), pH >5, and motile organisms define trichomoniasis. It's an STI: treat the client and partners and monitor for recurrence (retest within 3 months).`,
best:`Signature findings + partner treatment.`,
strat:`The negative whiff test rules out BV. Partner treatment is the most-tested action. Bowtie.`,
pearl:`Trich: frothy green, strawberry cervix, pH >5 → treat partners.`});
add({id:"T34",sec:"sti",type:"bowtie",obj:[7,9],step:"Prioritize Hypotheses",np:"Analysis",topic:"HIV",
chart:[["Nurses' Notes","0930: 29-year-old client reports fever, sore throat, night sweats, a fine rash on the trunk, and muscle aches × 5 days. Three weeks ago had unprotected sex with a partner who injects drugs."],["Vital Signs","T 38.4 °C · HR 96 · BP 118/74"],["Exam","Generalized lymphadenopathy. No genital lesions. No palms/soles involvement."]],
stem:BOW_STEM,
acts:[`Obtain HIV antigen/antibody testing per current algorithm with counseling`,`Teach condom use and not sharing needles while results are pending`,`Defer HIV testing until 3 months after exposure to avoid a false negative`,`Start oseltamivir and droplet precautions for presumed influenza`,`Administer penicillin G benzathine IM for presumed secondary syphilis`],actAns:[0,1],
conds:[`Acute HIV infection`,`Influenza`,`Secondary syphilis`,`Infectious mononucleosis`],cAns:0,
mons:[`HIV test results and viral load`,`Emotional response, including depression and suicide risk`,`Rapid influenza antigen result`,`RPR titer trend over the next 6 months`,`Throat culture for group A strep`],monAns:[0,1],
actNot:[`Correct.`,`Correct: prevents transmission during the window.`,`Antigen/antibody and RNA tests can detect acute infection now; waiting delays diagnosis while viral load and transmission risk are highest.`,`The flu-like picture fits, but the high-risk exposure 3 weeks ago plus lymphadenopathy and rash point to acute HIV, not influenza.`,`Penicillin treats syphilis, but there are no palms/soles lesions or chancre history to support it here.`],
condNot:[`Correct: flu-like illness with rash and lymphadenopathy weeks after a high-risk exposure.`,`Doesn't account for the exposure history, rash, and generalized lymphadenopathy.`,`No palms/soles rash or chancre history.`,`Mono can cause fever, sore throat, and lymphadenopathy, but the high-risk exposure 3 weeks ago makes acute HIV the hypothesis to prioritize.`],
monNot:[`Correct.`,`Correct: the course stresses assessing depression/suicide risk.`,`Influenza is not the priority hypothesis given the exposure history.`,`Syphilis is not supported by the findings; titers track syphilis treatment, not HIV.`,`Strep pharyngitis doesn't explain rash, night sweats, and generalized lymphadenopathy after this exposure.`],
why:`Acute HIV infection can resemble viral illness: fever, sore throat, night sweats, rash, myalgias, and generalized lymphadenopathy. The exposure history (partner who injects drugs) raises suspicion. Test with counseling, teach prevention, and monitor results and emotional response.`,
best:`Exposure history + acute viral syndrome = test, don't reassure.`,
strat:`Never delay indicated HIV testing because a client "looks like the flu." Prioritize-hypotheses bowtie.`,
pearl:`Acute HIV: fever, sore throat, night sweats, rash, lymphadenopathy.`});

add({id:"T35",sec:"sti",type:"bowtie",obj:[7,9],step:"Generate Solutions",np:"Planning",topic:"BV vs Candida vs Trich",
chart:[["Nurses' Notes","1400: 46-year-old client with type 2 diabetes reports intense vulvar itching and burning × 5 days; third episode this year. Completed a course of amoxicillin 1 week ago."],["Exam / Labs","Thick, white, curd-like discharge; no odor. Vaginal pH 4.0. KOH prep: pseudohyphae. Fingerstick glucose 286 mg/dL (ref 70–140)."]],
stem:BOW_STEM,
acts:[`Administer the prescribed azole antifungal and teach completion of the full course`,`Notify the provider about the elevated glucose and recurrent infections`,`Arrange expedited partner therapy so the sexual partner is treated as well`,`Administer oral metronidazole and teach avoiding alcohol during therapy`,`Teach the client to use a mild vinegar douche after intercourse to restore pH`],actAns:[0,1],
conds:[`Vulvovaginal candidiasis`,`Bacterial vaginosis`,`Trichomoniasis`,`Primary herpes simplex virus`],cAns:0,
mons:[`Blood glucose and HbA1c control`,`Resolution of itching and discharge`,`Clue cells on repeat wet mount`,`Vaginal pH rising above 4.5`,`Partner's urethral symptoms`],monAns:[0,1],
actNot:[`Correct.`,`Correct: diabetes drives recurrence.`,`Candidiasis is not an STI; partner treatment isn't routine.`,`Metronidazole treats BV and trichomoniasis, not candidiasis.`,`Douching disrupts normal flora and increases infection risk.`],
condNot:[`Correct: curd-like discharge, itch, normal pH, pseudohyphae.`,`BV: thin gray, fishy, pH ≥4.5, clue cells.`,`Trich: frothy green, pH >5.`,`HSV causes painful vesicles.`],
monNot:[`Correct.`,`Correct.`,`Clue cells are a BV finding, not a candidiasis outcome.`,`Her pH is normal; a rise above 4.5 suggests BV or trich, not improvement.`,`Candidiasis isn't sexually transmitted; partner symptoms aren't the outcome to track.`],
why:`Thick curd-like discharge, intense itching, normal pH, and pseudohyphae = candidiasis. Recent antibiotics and uncontrolled diabetes are risk factors for recurrence, so glucose control is part of the plan.`,
best:`Treats the infection AND its driver.`,
strat:`Recurrent candidiasis → look for the trigger (diabetes, antibiotics, steroids, immunosuppression). Generate-solutions bowtie.`,
pearl:`Candida risk: antibiotics, diabetes, pregnancy, obesity, steroids, immunosuppression.`});

add({id:"T36",sec:"sti",type:"mcq",obj:[9,6],step:"Take Action",np:"Implementation",topic:"Partner management",
chart:[["Nurses' Notes","Client diagnosed with chlamydia states, \"Please don't tell my girlfriend. I'll just take the pills and she'll never know.\""]],
stem:`The nurse is caring for a client diagnosed with chlamydia who does not want his partner to know about the infection. Which response by the nurse would be most helpful?`,
opts:[`"What you tell me stays confidential, but she needs testing and treatment too, or you can be reinfected. Let's plan how to tell her."`,`"Chlamydia is reportable, so the health department will contact her this week, and your name won't be shared with her."`,`"If you take every dose and avoid sex for 7 days, the infection is cleared, so she won't need treatment unless she develops symptoms."`,`"Because chlamydia often causes no symptoms in women, she can be tested at her next routine checkup instead of right away."`],
ans:0,
why:`Confidentiality is protected; reporting goes to public health, which offers partner services. Partner evaluation and treatment are essential to prevent reinfection.`,
best:`Balances confidentiality with partner management.`,
not:[``,`Chlamydia is reportable to public health, but that doesn't guarantee the health department will notify partners; the client is usually responsible, with help, and the nurse shouldn't promise that.`,`Treating only the client leaves an untreated partner who can reinfect him once they resume sex.`,`Being asymptomatic doesn't mean uninfected; delaying her evaluation risks PID and reinfection.`],
strat:`Partner management + confidentiality: both matter. Take-action item.`,
pearl:`Treat the client AND partners; abstain until both are treated.`});

add({id:"T37",sec:"sti",type:"sata",fmt:"n",n:4,obj:[9],step:"Generate Solutions",np:"Implementation",topic:"Syphilis",
chart:[["Nurses' Notes","1030: Nonpregnant 30-year-old client with a painless ulcer on the left labium × 10 days. Reports two male partners in the past 6 weeks and one partner 8 months ago. No known drug allergies."],["Laboratory Results","RPR: reactive, titer 1:32\nTreponemal antibody: positive"],["Medication Administration Record","Penicillin G benzathine 2.4 million units IM × 1 dose, given at 1100"]],
stem:`The nurse is preparing discharge instructions for the client after the 1100 injection. Select 4 instructions the nurse should include for this client.`,
opts:[`Avoid sexual contact until the labial ulcer heals and for 7 days after today`,`Return for repeat RPR titers at 6 and 12 months to confirm a falling titer`,`Both partners from the past 6 weeks need evaluation and presumptive treatment`,`Report fever, headache, or muscle aches that develop over the next 24 hours`,`Today's injection is curative, so titers are rechecked only if an ulcer returns`,`A rash on the palms and soles in a few weeks is an expected penicillin effect`],
ans:[0,1,2,3],
why:`This client has primary syphilis (painless ulcer, reactive RPR, positive treponemal test) and received the single recommended dose of penicillin G benzathine. Instructions must prevent transmission (abstain until the lesion heals and 7 days after treatment), confirm response (RPR at 6 and 12 months), interrupt reinfection (partners within the 90 days before diagnosis are treated presumptively), and catch the Jarisch-Herxheimer reaction (fever, headache, myalgias within 24 hours).`,
best:`Each instruction is tied to a cue in this client's record.`,
not:[`Correct: the lesion is infectious until healed, and abstinence continues 7 days after treatment.`,`Correct: a fourfold drop in titer confirms response to treatment.`,`Correct: partners within 90 days of a primary syphilis diagnosis are treated even if their tests are negative.`,`Correct: Jarisch-Herxheimer reaction is expected after treatment but should be reported and monitored.`,`One dose usually cures primary syphilis, but scheduled titers are still needed to confirm the response.`,`A palms/soles rash would suggest secondary syphilis (treatment failure or reinfection), not a drug effect.`],
strat:`Match each instruction to a cue in the chart: open lesion, titer, recent partners, today's dose. Generate-solutions item.`,
pearl:`Jarisch-Herxheimer: fever, headache, myalgias within ~24 h of treatment.`});

add({id:"T38",sec:"sti",type:"mcq",obj:[9],step:"Evaluate Outcomes",np:"Evaluation",topic:"HPV",
chart:[["Nurses' Notes","Well-child visit for a healthy 11-year-old. Tdap and MenACWY given today. No HPV vaccine doses on record. Parent asks to talk about the HPV vaccine before deciding."]],
stem:`A nurse is providing teaching about the HPV vaccine for the parent of an 11-year-old client. Which comment by the parent indicates the parent needs further instruction?`,
opts:[`"I'll wait to vaccinate until my child starts dating or becomes sexually active."`,`"Because my child is starting before age 15, the series is two doses instead of three."`,`"The vaccine helps prevent several cancers, including throat and anal cancer."`,`"Getting the vaccine now won't replace routine cervical screening later on."`],
ans:0,
why:`HPV vaccination is primary prevention and works best before any exposure, so it is routinely given at age 11 or 12. This child is 11 with no doses, so the series should start now. Waiting until sexual activity reduces its benefit.`,
best:`The only incorrect statement.`,
not:[``,`Correct: a series started before the 15th birthday is two doses.`,`Correct: high-risk types are linked to several cancers.`,`Correct: screening is still recommended per guidelines.`],
strat:`"Further teaching" = find the wrong statement. Prevention item.`,
pearl:`HPV vaccine at 11–12; best before exposure.`});

add({id:"T39",sec:"sti",type:"sata",obj:[8],step:"Recognize Cues",np:"Assessment",topic:"STI risk factors",
chart:[["Nurses' Notes","17-year-old client at a youth clinic. Has sex with men; uses condoms \"rarely.\" Three partners in the past 2 months. Drinks alcohol before sex. Reports sharing needles with a friend once last month. Completed the hepatitis B vaccine series in infancy. Negative STI panel 1 year ago."]],
stem:`The nurse is assessing a 17-year-old client at a youth clinic. Which findings by the nurse indicate that the client is at increased risk for STIs? Select all that apply.`,
opts:[`Rare condom use`,`Three partners in 2 months`,`Alcohol use before sex`,`Shared needles last month`,`Adolescent who has sex with men`,`Negative STI panel 1 year ago`,`Hepatitis B vaccine in infancy`],
ans:[0,1,2,3,4],
why:`The NCLEX map notes LGBT youth are at higher STI risk and that substance use and IV drug use increase risk. Inconsistent barriers and multiple partners are also risk factors. Assessment is behavior-based, not an assumption from identity.`,
best:`Five course risk factors are present.`,
not:[`Correct.`,`Correct.`,`Correct: substance use.`,`Correct: IV drug use/needle sharing (HIV, HBV, HCV).`,`Correct: course map risk group, combined with his behaviors.`,`A past negative result doesn't add risk; it's outdated given new partners, so he needs retesting, but it isn't a risk factor.`,`Vaccination lowers his hepatitis B risk; it isn't a risk factor.`],
strat:`Count risk factors from the record; NGN SATA can have up to 5 correct. Recognize-cues item.`,
pearl:`Substance use and IV drug use increase STI risk.`});

add({id:"T40",sec:"sti",type:"mcq",obj:[8],step:"Prioritize Hypotheses",np:"Analysis",topic:"Hepatitis",
chart:[["Clinic Intake","Four adult clients at a sexual health clinic. Each had a negative one-time hepatitis C screening 2 years ago. None has a history of blood transfusion."]],
stem:`The nurse reviews the intake histories of four clients at a sexual health clinic. Which client should the nurse identify as having the highest current risk for hepatitis C infection?`,
opts:[`A 34-year-old who injects heroin and reuses syringes with a roommate`,`A 22-year-old with four sex partners this year and rare condom use`,`A 28-year-old who got a tattoo at a licensed studio last month`,`A 40-year-old who drank tap water on a trip to an area with poor sanitation`],
ans:0,
why:`HCV is primarily bloodborne, and sharing injection equipment is the most efficient route of transmission. All four had a negative screen 2 years ago, so the question is which new exposure carries the most risk. Ongoing injection drug use with shared syringes outweighs sexual exposure, a regulated tattoo, or a fecal-oral exposure, and it is an indication for repeat periodic HCV testing. There's no HCV vaccine.`,
best:`Ongoing percutaneous blood exposure is the highest HCV risk.`,
not:[``,`Raises HIV, HBV, and bacterial STI risk more than HCV; sexual HCV transmission is inefficient.`,`Tattoos transmit HCV mainly in unregulated settings with reused equipment; a licensed studio is lower risk than shared syringes.`,`Fecal-oral exposure suggests hepatitis A (or E), not C.`],
strat:`Match the route to the virus: A food/water, B blood/sex/perinatal, C blood. Then pick the client with the most direct blood exposure. Prioritize-hypotheses item.`,
pearl:`HCV: bloodborne, IV drug use, no vaccine.`});

add({id:"T41",sec:"sti",type:"mcq",obj:[9],step:"Generate Solutions",np:"Implementation",topic:"GBS",
chart:[["Laboratory Results","36 weeks: rectovaginal culture POSITIVE for group B Streptococcus"],["Nurses' Notes","Client asks, \"Do I need to take antibiotics now?\""]],
stem:`The nurse is caring for a client at 36 weeks' gestation who asks about a positive group B Streptococcus culture. Which response by the nurse would be most helpful?`,
opts:[`"Not now. You'll get IV antibiotics once labor starts or your water breaks, so come in promptly."`,`"Yes. You'll take oral penicillin starting now so your culture is negative by the time you deliver."`,`"Only if you get a fever in labor; otherwise this result doesn't change your labor care."`,`"No. Your baby will get IV antibiotics right after birth instead, so you won't need any."`],
ans:0,
why:`GBS can be normal flora but can infect the newborn at birth. Intrapartum IV antibiotic prophylaxis prevents early-onset neonatal infection.`,
best:`Correct timing and route, plus when to come in.`,
not:[``,`Treatment weeks early doesn't prevent recolonization before birth.`,`A positive culture is itself the indication for intrapartum prophylaxis; fever isn't required.`,`Prophylaxis is given to the mother in labor; it isn't replaced by treating the newborn.`],
strat:`GBS is about preventing newborn infection at BIRTH. Generate-solutions item.`,
pearl:`GBS: screen 35–37 weeks (course); IV antibiotics in labor.`});

add({id:"T42",sec:"sti",type:"mcq",obj:[9],step:"Generate Solutions",np:"Planning",topic:"HSV in pregnancy",
chart:[["History","G2 P1 at 35 weeks. Recurrent genital herpes; last outbreak 2 months ago."],["Nurses' Notes","Client asks, \"Is there anything I can do so I don't have an outbreak when I go into labor?\""]],
stem:`The nurse is caring for a client at 35 weeks' gestation with recurrent genital herpes who asks how to avoid an outbreak during labor. Which order should the nurse anticipate for this client?`,
opts:[`Suppressive acyclovir or valacyclovir starting at 36 weeks`,`A scheduled cesarean birth at 39 weeks due to her history`,`Episodic acyclovir started only if prodrome occurs in labor`,`Weekly cervical viral cultures from now until delivery`],
ans:0,
why:`Suppressive antiviral therapy beginning at 36 weeks reduces recurrence at delivery. Vaginal birth may be acceptable if no lesions or prodrome are present at labor.`,
best:`Reduces the chance of lesions at birth.`,
not:[``,`Cesarean is planned when lesions or prodrome are present at labor, not for history alone.`,`Starting treatment at labor is too late to prevent the lesions or shedding that would change the birth plan.`,`Serial antepartum cultures don't predict shedding at birth and are no longer recommended.`],
strat:`Prevention vs treatment: suppression prevents the problem that would change the birth plan. Generate-solutions item.`,
pearl:`HSV in late pregnancy: suppression from 36 weeks; assess lesions/prodrome in labor.`});

add({id:"T43",sec:"sti",type:"sata",obj:[9],step:"Evaluate Outcomes",np:"Evaluation",topic:"Partner management",
chart:[["Nurses' Notes","Client treated for chlamydia with doxycycline. Teaching provided about medication, partners, and prevention."]],
stem:`The nurse is evaluating teaching for a client treated with doxycycline for chlamydia. Which statements indicate to the nurse that the client understands the treatment regimen? Select all that apply.`,
opts:[`"I'll take all 7 days of doxycycline even if I feel better sooner."`,`"My partner needs to be tested and treated before we have sex again."`,`"I'll come back for retesting in about 3 months since reinfection is common."`,`"We can have sex again as soon as my symptoms have gone away."`,`"Using two condoms at once will give us extra protection next time."`,`"I'll come back in 1 week for a test of cure to make sure it worked."`],
ans:[0,1,2],
why:`Full adherence, partner treatment, and retesting at about 3 months prevent persistence and reinfection. Sex should wait until treatment is complete and partners are treated, not just symptom relief. Two condoms increase breakage. A test of cure isn't routine outside pregnancy, and testing too soon can detect nonviable organisms.`,
best:`These three prevent reinfection.`,
not:[`Correct.`,`Correct.`,`Correct.`,`Wait until treatment is complete and partners are treated.`,`Friction → breakage.`,`A test of cure isn't routine for nonpregnant clients, and a NAAT within 3–4 weeks can be falsely positive; retest at about 3 months.`],
strat:`Evaluate-outcomes: choose statements that would actually prevent reinfection. Teaching item.`,
pearl:`Chlamydia: often silent; treat partners; retest.`});

add({id:"T44",sec:"sti",type:"mcq",obj:[9],step:"Evaluate Outcomes",np:"Evaluation",topic:"PID",
chart:[["Nurses' Notes","Client with pelvic inflammatory disease started oral outpatient antibiotic therapy 72 hours ago and returns today for a scheduled follow-up visit."]],
stem:`The nurse is assessing the client at the 72-hour follow-up visit. Which finding indicates to the nurse that the antibiotic therapy is effective?`,
opts:[`Decreased pelvic pain and less cervical motion tenderness`,`Less vaginal discharge, with a temperature of 38.5 °C`,`Lower abdominal pain that is unchanged from the first visit`,`Resolved fever, with new right upper quadrant pain`],
ans:0,
why:`Clients treated for PID should show substantial clinical improvement within 72 hours: defervescence and decreased abdominal, uterine, adnexal, and cervical motion tenderness (CDC). No improvement means reevaluation, often hospitalization and parenteral therapy. The course: fever, severe pelvic pain, vomiting, pregnancy, or systemic illness → prompt escalation.`,
best:`The only finding that shows the expected improvement at 72 hours.`,
not:[``,`Persistent fever at 72 hours means the regimen isn't working, even if discharge has lessened; the client needs reevaluation.`,`Improvement is expected within 72 hours; unchanged pain needs reevaluation, often for parenteral therapy.`,`New RUQ pain can signal perihepatitis (Fitz-Hugh-Curtis syndrome), a complication that needs evaluation.`],
strat:`"Treatment is effective" = pick the finding that matches the expected outcome; every other option hides a cue that the plan is failing. Evaluate-outcomes item.`,
pearl:`PID: expect improvement within 72 h; if none, reevaluate and escalate.`});

add({id:"T45",sec:"sti",type:"mcq",obj:[9],step:"Evaluate Outcomes",np:"Evaluation",topic:"Infection control",
chart:[["Nurses' Notes","Women's health clinic. 27-year-old client with secondary syphilis; moist, raised lesions on the vulva and a rash on the trunk and palms. AP assigned to room the client and assist with the exam."]],
stem:`The nurse is caring for a client with active syphilis lesions at a women's health clinic. The nurse delegates care to assistive personnel (AP). Which action by the AP requires the nurse to intervene?`,
opts:[`Performs hand hygiene before and after helping the client`,`Rooms the client in a standard exam room with the door closed`,`Helps the client undress without gloves, touching lesions`,`Wipes the exam table with the standard disinfectant afterward`],
ans:2,
why:`Syphilis spreads by direct contact with active lesions. The NCLEX map: hand hygiene, standard precautions with gloves for lesions, contact precautions for active infection (example: syphilis lesions), and teaching about transmission. Bare-hand contact with lesions is unsafe and requires the nurse to intervene. Syphilis isn't airborne, and standard surface cleaning is enough.`,
best:`The only unsafe AP action: bare-hand contact with infectious lesions.`,
not:[`Safe: hand hygiene before and after contact is required, so no intervention is needed.`,`Safe: syphilis isn't airborne, so a standard room is appropriate; negative pressure isn't indicated.`,``,`Safe: syphilis spreads by direct contact with lesions, not objects; standard cleaning is enough.`],
strat:`"Requires the nurse to intervene" = find the unsafe action. Match precautions to the route: contact, not airborne. Delegation/safety item.`,
pearl:`Standard precautions + gloves for lesions; contact precautions for active syphilis lesions (course map).`});

add({id:"T46",sec:"sti",type:"sata",obj:[9],step:"Generate Solutions",np:"Implementation",topic:"Hepatitis",

not:[`Correct.`,`Correct.`,`Correct.`,`Mainly fecal-oral; blood exposure is the HBV/HCV route.`,`HAV is self-limited; care is supportive, not antiviral.`,`HBV vaccine doesn't protect against hepatitis A; contacts need HAV vaccine or immune globulin.`],
strat:`Route drives teaching: fecal-oral → hand hygiene, especially for a food worker. Teaching item.`,
pearl:`HAV: fecal-oral, self-limited, vaccine-preventable.`});

add({id:"T47",sec:"sti",type:"case",sub:"cloze",obj:[7,9],step:"Prioritize Hypotheses",np:"Analysis",topic:"STI pregnancy complications",

 {opts:[`ruptured membranes and contractions at 30 weeks with untreated chlamydia`,`a positive chlamydia NAAT at 12 weeks that was never treated or retested`,`a temperature of 37.6 °C and an FHR of 150 with moderate variability`,`positive nitrazine and fern tests confirming ruptured membranes`]

add({id:"T48",sec:"sti",type:"case",sub:"matrix",obj:[9],step:"Evaluate Outcomes",np:"Evaluation",topic:"Syphilis",
record:[["Nurses' Notes","Baseline: 31-year-old client with secondary syphilis; rash on palms/soles, generalized lymphadenopathy, fatigue. Treated with penicillin G.\n6 months: Rash resolved; lymph nodes no longer palpable; still reports fatigue. New painless ulcer on the penis noted today. Reports a new partner 2 months ago; no condom use."],["Laboratory Results","|Time|RPR titer\n|Baseline|1:64\n|6 months|1:8"]],
stem:`The nurse is evaluating a client at a 6-month follow-up visit after treatment for secondary syphilis. For each finding at 6 months, click to specify whether it indicates the client's condition has improved, not changed, or declined.`,
cols:["Improved","No change","Declined"],
rows:[[`RPR titer`,0,`A fourfold or greater drop (1:64 → 1:8) indicates response.`],[`Palms/soles rash`,0,`Resolved.`],[`Lymphadenopathy`,0,`Resolved.`],[`Fatigue`,1,`Still present.`],[`Genital findings`,2,`A new painless ulcer after a new exposure suggests possible reinfection.`]],

add({id:"T49",sec:"sti",type:"case",sub:"sata",fmt:"n",n:3,obj:[9],step:"Take Action",np:"Implementation",topic:"HSV",
record:[["Nurses' Notes","1600: 22-year-old client with first-episode genital herpes; painful vesicles and ulcers on the labia. Reports severe burning with urination and has not voided since 0500. Suprapubic fullness on palpation. Pain 8/10."],["Vital Signs","T 38.1 °C · HR 98 · BP 122/78"],["Orders","Valacyclovir 1 g PO BID × 10 days\nAcetaminophen 650 mg PO q6h PRN pain\nStraight catheterization PRN if unable to void"]],
stem:`The nurse is caring for a 22-year-old client with a first episode of genital herpes. Select 3 actions the nurse should take.`,
opts:[`Administer the first dose of valacyclovir as prescribed`,`Assess bladder volume and catheterize per order if unable to void`,`Give acetaminophen and offer a warm sitz bath for comfort`,`Hold valacyclovir until the viral culture confirms HSV`,`Apply topical acyclovir to the lesions before each void`,`Teach that she can't transmit HSV once the lesions heal`],
ans:[0,1,2],
why:`Primary HSV: start antivirals, relieve pain and support comfort, and manage urinary retention (a known complication). Antivirals are started on clinical diagnosis without waiting for culture results.`,
best:`Treats the infection, the pain, and the complication.`,
not:[`Correct.`,`Correct: 11 hours without voiding + suprapubic fullness.`,`Correct.`,`First-episode HSV is treated on clinical grounds; waiting for culture delays the benefit of early therapy.`,`Topical acyclovir adds little benefit and isn't recommended; it's not ordered here.`,`Asymptomatic viral shedding can transmit HSV even when no lesions are present.`],
strat:`"Select 3" = the three most important actions. One addresses the complication hidden in the note. Take-action case.`,
pearl:`Primary HSV: antivirals, comfort, analgesia; watch for urinary retention.`});

add({id:"B21",sec:"bc",type:"mcq",obj:[10],step:"Analyze Cues",np:"Implementation",topic:"Fertility awareness & LAM",
chart:[["Nurses' Notes","Client wants to use the Standard Days method. Her last six cycle lengths: 24, 38, 27, 35, 30, 41 days."]],
stem:`The nurse is counseling a client who wants to use the Standard Days method of family planning. Which response by the nurse would be most helpful?`,
opts:[`"Several of your cycles fall outside this method's range, so let's look at other options."`,`"This method fits you; avoid unprotected sex on cycle days 8 through 19 each month."`,`"Your cycles average about 32 days, which is within range, so this method should work well for you."`,`"You can use the method, and add condoms only in months when your cycle runs long."`],
ans:0,
why:`Standard Days is for cycles commonly 26–32 days. Her cycles range from 24 to 41 days, so the method isn't reliable.`,
best:`Applies the method's eligibility rule to her data.`,
not:[``,`Days 8 to 19 is the correct fertile window, but the method doesn't fit her irregular cycles.`,`Eligibility depends on each cycle falling in the 26–32 day range, not on the average.`,`She can't know in advance which months will run long, so the fertile window can't be predicted.`],
strat:`Compare the client's data to the method's criteria. Analyze-cues item.`,
pearl:`Standard Days: cycles 26–32 days; avoid unprotected sex days 8–19.`});

add({id:"B22",sec:"bc",type:"sata",obj:[10],step:"Evaluate Outcomes",np:"Evaluation",topic:"Fertility awareness & LAM",
chart:[["Nurses' Notes","Client returns after charting her first full cycle with the symptothermal method. She reviews her chart with the nurse."],["Fertility Chart","|Cycle day|BBT (°C)|Cervical mucus\n|1–5|36.3–36.4|Menses\n|6–8|36.3–36.4|Dry\n|9|36.9 (had a cold; slept 4 hours)|Dry\n|10–14|36.3–36.4|Clear, thin, stretchy\n|15|36.6|Thickening\n|16–27|36.7–36.8|Thick, cloudy, sticky"]],
stem:`The nurse reviews the client's first symptothermal chart with her. Which statements by the client indicate correct interpretation of her chart? Select all that apply.`,
opts:[`"Days 10 to 14 were my fertile days, since my mucus was clear and stretchy then."`,`"My temperature went up on day 15 and stayed up, so I had already ovulated by then."`,`"I shouldn't count the day 9 reading, because I had a cold and slept poorly that night."`,`"My temperature rise on day 15 told me ahead of time that ovulation was on its way."`,`"Days 16 to 27 were my most fertile days, because my mucus was thick and sticky then."`,`"Next cycle I'll take my temperature after my morning shower so it is more consistent."`],
ans:[0,1,2],
why:`Fertile mucus is clear, thin, and stretchy (spinnbarkeit), so days 10 to 14 were her fertile days. The sustained BBT rise from day 15 reflects progesterone after ovulation, so it confirms ovulation has occurred rather than predicting it. The isolated day 9 spike coincides with illness and poor sleep, both known confounders, so it should be disregarded. Thick, sticky mucus after the shift marks the infertile luteal phase. BBT is taken on waking, before any activity.`,
best:`Each correct statement reads a cue on her own chart accurately.`,
not:[`Correct: clear, thin, stretchy mucus marks the fertile window.`,`Correct: a sustained rise confirms ovulation has already occurred.`,`Correct: illness and poor sleep falsely raise BBT, so day 9 is disregarded.`,`BBT rises after ovulation because of progesterone; it confirms, it doesn't predict.`,`Thick, sticky mucus after the temperature shift marks the infertile (progesterone) phase.`,`BBT is taken on waking, before getting out of bed; activity or a warm shower raises the reading.`],
strat:`Tie each sign to timing: mucus = near ovulation; BBT = after; one-day spikes with illness are artifacts. Evaluate-outcomes item.`,
pearl:`Symptothermal = BBT + mucus + other signs; more data than single-sign methods.`});

add({id:"B23",sec:"bc",type:"mcq",obj:[10],step:"Generate Solutions",np:"Implementation",topic:"Condoms",
chart:[["Nurses' Notes","Client's partner developed hives and swelling after using latex condoms. Couple wants to keep using condoms for STI and pregnancy protection."]],
stem:`The nurse is counseling a client whose partner had a reaction to latex condoms. Which recommendation would be most appropriate for the nurse to make?`,
opts:[`Use polyurethane (nonlatex) external or internal condoms.`,`Use lambskin condoms, which are latex-free and prevent pregnancy.`,`Switch to a silicone diaphragm used with spermicide each time.`,`Take an oral antihistamine before using latex condoms.`],
ans:0,
why:`Polyurethane condoms avoid latex and still reduce pregnancy and STI risk. The internal condom is a nonlatex option. Animal-skin condoms don't protect against STI/HIV.`,
best:`Keeps dual protection without the allergen.`,
not:[``,`Latex-free and prevents pregnancy, but animal-skin pores allow STI/HIV transmission.`,`Latex-free but gives no reliable STI protection, so it loses one of the couple's goals.`,`Hives with swelling is a true latex allergy; premedicating doesn't make continued exposure safe.`],
strat:`Choose the option that keeps BOTH goals (pregnancy + STI protection). Generate-solutions item.`,
pearl:`Latex or polyurethane for STI protection; never animal-skin for HIV.`});

add({id:"B24",sec:"bc",type:"bowtie",obj:[10],step:"Take Action",np:"Implementation",topic:"Barrier methods",
chart:[["Nurses' Notes","1900: 26-year-old client brought to the ED. Inserted a contraceptive sponge 2 days ago and \"forgot to take it out.\" Reports sudden fever, vomiting, dizziness, and a sunburn-like rash."],["Vital Signs","T 39.6 °C · HR 128 · BP 84/50 · RR 24"]],
stem:BOW_STEM,
acts:[`Remove the sponge as prescribed or per protocol`,`Notify the provider and prepare for IV fluid resuscitation`,`Encourage oral fluids and recheck vital signs in 1 hour`,`Obtain a vaginal culture before removing the device`,`Give an antipyretic and recheck temperature in 30 minutes`],actAns:[0,1],
conds:[`Toxic shock syndrome`,`Pelvic inflammatory disease`,`Acute pyelonephritis`,`Anaphylaxis to spermicide`],cAns:0,
mons:[`Blood pressure`,`Temperature`,`Vaginal discharge character`,`Peeling skin on palms and soles`,`Abdominal pain rating`],monAns:[0,1],
actNot:[`Correct: remove the source.`,`Correct: hypotension = shock.`,`Oral fluids are inadequate for shock and delay emergency care.`,`Removing the source shouldn't wait; cultures can be obtained with or after removal.`,`Treats a symptom while shock and the retained source go unaddressed.`],
condNot:[`Correct: retained barrier device + fever, rash, hypotension.`,`Can cause fever and vomiting but doesn't explain the diffuse rash and shock after a retained device.`,`Can cause fever and vomiting but doesn't explain the sunburn-like rash.`,`Occurs within minutes of exposure, usually with hives or wheezing, not fever 2 days later.`],
monNot:[`Correct.`,`Correct.`,`Not a priority indicator of shock or response.`,`Desquamation develops 1–2 weeks later; it doesn't guide care now.`,`Not a key indicator of perfusion or response to treatment.`],
why:`Retained diaphragm, cap, or sponge beyond the labeled wear time raises toxic shock syndrome risk. Fever, rash, vomiting, and hypotension are an emergency.`,
best:`Removes the source and treats shock.`,
strat:`Know each barrier method's serious complication: TSS. Vital signs make it an emergency. Take-action bowtie.`,
pearl:`Diaphragm, cap, sponge: follow wear-time limits; TSS risk.`});

add({id:"B25",sec:"bc",type:"bowtie",obj:[10],step:"Recognize Cues",np:"Assessment",topic:"ACHES & VTE",
chart:[["Nurses' Notes","1415: 31-year-old client on a combined oral contraceptive reports sudden severe headache \"worst of my life,\" loss of vision in the right visual field, and weakness in the left hand that started 30 minutes ago. History of migraine with aura not previously documented."],["Vital Signs","BP 168/96 · HR 92 · RR 18 · SpO2 98%"]],
stem:BOW_STEM,
acts:[`Activate the emergency response system (stroke alert)`,`Document the exact time of symptom onset and notify the provider`,`Give the client's PRN sumatriptan for her migraine headache`,`Hold tonight's pill and schedule a follow-up visit this week`,`Obtain a urine pregnancy test before any imaging is done`],actAns:[0,1],
conds:[`Acute stroke`,`Migraine with aura`,`Hypertensive emergency`,`Hypoglycemia`],cAns:0,
mons:[`Neurologic status`,`Blood pressure`,`Serum lipid panel`,`Breakthrough bleeding pattern`,`Weight trend`],monAns:[0,1],
actNot:[`Correct.`,`Correct: onset time guides stroke treatment.`,`Triptans are vasoconstrictors and are contraindicated in suspected stroke.`,`Stopping estrogen is appropriate later, but a follow-up visit delays emergency care.`,`Pregnancy status matters, but it shouldn't delay stroke imaging.`],
condNot:[`Correct: H and E in ACHES plus focal weakness in a client taking estrogen.`,`Aura can cause visual changes, but focal weakness and a "worst headache of my life" are not typical migraine and must be treated as stroke until ruled out.`,`BP is elevated but below emergency range, and it doesn't explain focal deficits on its own.`,`Can mimic stroke, but nothing in the chart suggests it; the ACHES cues on estrogen point to stroke.`],
monNot:[`Correct.`,`Correct.`,`A long-term risk factor, not an acute indicator.`,`Not relevant to the emergency.`,`Not relevant to the emergency.`],
why:`Sudden severe headache, vision loss, and focal weakness on estrogen are ACHES red flags for stroke. Migraine with aura further raises stroke risk with estrogen.`,
best:`Treats the most dangerous hypothesis immediately.`,
strat:`ACHES symptoms change the item from routine to emergency. Recognize-cues bowtie.`,
pearl:`H and E in ACHES = possible stroke.`});

add({id:"B26",sec:"bc",type:"mcq",obj:[10],step:"Generate Solutions",np:"Planning",topic:"Estrogen contraindications",
chart:[["Postpartum Note","Postpartum day 2 after vaginal birth. Breastfeeding exclusively. Client requests a reliable method before discharge."]],
stem:`The nurse is caring for a breastfeeding client on postpartum day 2 who requests contraception before discharge. Which method should the nurse anticipate the provider will avoid at this time?`,

not:[``,`Progestin-only; can be placed before discharge.`,`Progestin-only; an option while breastfeeding.`,`An option: exclusive breastfeeding, no menses, under 6 months postpartum.`],

add({id:"B27",sec:"bc",type:"match",obj:[10],step:"Analyze Cues",np:"Analysis",topic:"Methods & mechanisms",
chart:[["History","36-year-old client, G2 P2; youngest child is 3 years old and not breastfeeding. Smokes 20 cigarettes per day. Migraine with aura since age 20. No history of VTE, breast cancer, or liver disease."],["Vital Signs","BP 132/84 · HR 80 · BMI 27"],["Nurses' Notes","Client asks about the methods her friends use and wants to know which ones she could use."]],

cols:["Appropriate option","Contraindicated"],

why:`The cues are age 36, smoking 20 cigarettes a day, and migraine with aura. Each one independently makes estrogen-containing methods unsafe because of stroke and VTE risk. Hormone content, not route, decides safety: the patch and ring contain estrogen just like the pill. Progestin-only and nonhormonal methods remain appropriate.`,
best:`Sort by hormone content, then apply this client's estrogen contraindications.`,

add({id:"B29",sec:"bc",type:"sata",fmt:"n",n:3,obj:[10],step:"Take Action",np:"Implementation",topic:"DMPA",
chart:[["Nurses' Notes","Client arrives for her DMPA injection. Last injection was 16 weeks ago. Reports unprotected intercourse 5 days ago."]],
stem:`The nurse is caring for a client who arrives for a scheduled DMPA injection. Select 3 actions the nurse should take.`,
opts:[`Obtain a pregnancy test per protocol before giving the injection`,`Notify the provider that she is past the 15-week injection window`,`Teach backup contraception use as directed by the provider`,`Give the injection now, since she is within the 4-week grace period`,`Massage the site afterward to speed absorption of the medication`,`Teach that protection begins as soon as today's injection is given`],
